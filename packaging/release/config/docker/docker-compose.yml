services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agri}
      POSTGRES_USER: ${POSTGRES_USER:-agri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agriloop_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - agriloop_redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ../mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - agriloop_mqtt:/mosquitto/data
      - agriloop_mqtt_log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 2 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: config/docker/Api.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: simulation
      APP_MODE: simulation
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SEED_DATA: "false"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agri}
      DATABASE_USER: ${POSTGRES_USER:-agri}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379
      MQTT_URL: tcp://mqtt:1883
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AI_MODE: ${AI_MODE:-rules-only}
      COMMAND_MODE: virtual
      SIMULATOR_AUTO_START: "true"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health | grep -q '\"status\"[[:space:]]*:[[:space:]]*\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30

  seed:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-agri}
      PGUSER: ${POSTGRES_USER:-agri}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ../../db/demo-seed.sql:/seed/demo-seed.sql:ro
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["psql --set=ON_ERROR_STOP=1 --file=/seed/demo-seed.sql"]

  web:
    build:
      context: ../..
      dockerfile: config/docker/Web.Dockerfile
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:80"
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  agriloop_pg:
  agriloop_redis:
  agriloop_mqtt:
  agriloop_mqtt_log:
