[program:agriloop-api]
command=/srv/agriloop/current/bin/run-api.sh --root /srv/agriloop
directory=/srv/agriloop/current
user=agriloop
autostart=true
autorestart=true
startsecs=8
stopasgroup=true
killasgroup=true
environment=APP_ROOT="/srv/agriloop",HOME="/srv/agriloop/shared"
stdout_logfile=/srv/agriloop/shared/logs/api.log
stderr_logfile=/srv/agriloop/shared/logs/api-error.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=7
