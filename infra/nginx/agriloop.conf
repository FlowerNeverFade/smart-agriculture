# Public reverse-proxy/static-site configuration for the main deployment.
# The AutoDL ingress keeps its generated hostname; /agriloop/ is the stable,
# branded application path. API and model endpoints remain same-origin/private.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 6006 default_server;
    listen [::]:6006 default_server;
    server_name _;

    root /srv/agriloop/app/apps/web-ui;
    index index.html;
    client_max_body_size 2m;
    # Preserve the public AutoDL scheme/port when issuing the branded-path
    # redirects; otherwise Nginx would expose its internal :6006 URL.
    absolute_redirect off;

    access_log /srv/agriloop/logs/nginx-access.log;
    error_log /srv/agriloop/logs/nginx-error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /v3/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The OpenAI-compatible vLLM endpoint is deliberately not public.
    location /v1/ {
        return 404;
    }

    # Role-specific entry points all serve the same deployed release under
    # /srv/agriloop. This prevents stale role copies from hiding new UI work,
    # while /api/ keeps one database, simulator and AI service for all roles.
    location = /farm-admin {
        return 301 /farm-admin/;
    }

    location = /farm-admin/ {
        rewrite ^ /farm-admin/index.html last;
    }

    location /farm-admin/ {
        rewrite ^/farm-admin/(.*)$ /$1 break;
        root /srv/agriloop/app/apps/web-ui;
        try_files $uri $uri/ /farm-admin/index.html;
    }

    location = /farmer {
        return 301 /farmer/;
    }

    location = /farmer/ {
        rewrite ^ /farmer/farmer.html last;
    }

    location /farmer/ {
        rewrite ^/farmer/(.*)$ /$1 break;
        root /srv/agriloop/app/apps/web-ui;
        try_files $uri $uri/ /farmer/farmer.html;
    }

    location = /system-admin {
        return 301 /system-admin/;
    }

    location = /system-admin/ {
        rewrite ^ /system-admin/sysadmin.html last;
    }

    location /system-admin/ {
        rewrite ^/system-admin/(.*)$ /$1 break;
        root /srv/agriloop/app/apps/web-ui;
        try_files $uri $uri/ /system-admin/sysadmin.html;
    }

    # Branded entry path. Assets are rewritten to the same static root so
    # existing relative CSS/ES-module URLs continue to work under /agriloop/.
    location = /agri {
        return 301 /agriloop/;
    }

    location = /agriloop {
        return 301 /agriloop/;
    }

    location = /agriloop/ {
        rewrite ^ /index.html last;
    }

    location /agriloop/ {
        rewrite ^/agriloop/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Make the bare public URL land on the branded entry point.
    location = / {
        return 302 /agriloop/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
