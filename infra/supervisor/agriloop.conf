[supervisord]
logfile=/srv/agriloop/logs/supervisord.log
pidfile=/srv/agriloop/supervisord.pid
nodaemon=false

[unix_http_server]
file=/srv/agriloop/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///srv/agriloop/supervisor.sock

[program:agriloop-api]
command=/srv/agriloop/app/scripts/run-api.sh
directory=/srv/agriloop/app
autostart=true
autorestart=true
startsecs=8
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/agriloop/logs/api.log
stderr_logfile=/srv/agriloop/logs/api-error.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=7
environment=APP_ROOT="/srv/agriloop"

[program:qwen-vllm]
command=/srv/agriloop/app/scripts/run-qwen-vllm.sh
directory=/srv/agriloop/app
autostart=true
autorestart=true
startsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/agriloop/logs/qwen-vllm.log
stderr_logfile=/srv/agriloop/logs/qwen-vllm-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=APP_ROOT="/srv/agriloop",CUDA_VISIBLE_DEVICES="0,1"

[program:agriloop-simulator]
command=/srv/agriloop/app/scripts/run-simulator.sh
directory=/srv/agriloop/app
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/agriloop/logs/simulator.log
stderr_logfile=/srv/agriloop/logs/simulator-error.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=7
environment=APP_ROOT="/srv/agriloop",SCENARIO="normal",SCENARIO_ID="remote-demo",SCENARIO_SEED="42",SCENARIO_INTERVAL="5",SCENARIO_SPEED="1",MQTT_HOST="127.0.0.1"

[program:agriloop-cron]
command=/usr/sbin/cron -f
directory=/srv/agriloop
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/agriloop/logs/cron.log
stderr_logfile=/srv/agriloop/logs/cron-error.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

[program:agriloop-nginx]
command=/usr/sbin/nginx -g "daemon off;"
directory=/srv/agriloop
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/agriloop/logs/nginx.log
stderr_logfile=/srv/agriloop/logs/nginx-error.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
