services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      - mosquitto
