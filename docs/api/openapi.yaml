openapi: 3.0.3
info:
  title: AgriLoop 农智闭环后端 API
  version: 1.3.4
  description: |
    Spring Boot 3/Java 17 software-simulation backend. Protected endpoints
    require JWT; command actions require idempotencyKey and an explicit
    current-operator confirmation. The executor is virtual in this release.
servers:
  - url: http://localhost:8080
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: farm
  - name: market
  - name: telemetry
  - name: decision
  - name: execution
  - name: scenario
  - name: management
paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}
      responses:
        '200': {description: JWT 登录成功, content: {application/json: {schema: {$ref: '#/components/schemas/ApiEnvelope'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/register:
    post:
      tags: [auth]
      security: []
      description: |
        创建 FARMER 或 FARM_ADMIN 无需额外授权；FARM_ADMIN 必须提交 farmProfile，服务端原子创建独立空农场，
        不再加入 farm-demo。创建 SYSTEM_ADMIN 必须提交服务端环境变量 SYSTEM_ADMIN_AUTHORIZATION_CODE 对应的授权码。
        恢复码只在成功响应中返回一次，服务端仅保存 BCrypt 哈希。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}
      responses:
        '201': {description: 账号创建成功，返回 JWT、用户与一次性展示的恢复码, content: {application/json: {schema: {$ref: '#/components/schemas/ApiEnvelope'}}}}
        '400': {description: 账号格式、密码强度或 FARM_ADMIN 农场资料不符合要求（FARM_PROFILE_INVALID）}
        '403': {description: SYSTEM_ADMIN_AUTHORIZATION_INVALID 授权码无效}
        '429': {description: SYSTEM_ADMIN_AUTHORIZATION_RATE_LIMITED，连续失败 5 次后限制 15 分钟}
        '409': {description: 账号已存在}
        '503': {description: SYSTEM_ADMIN_CREATION_DISABLED 或 ACCOUNT_PERSISTENCE_UNAVAILABLE}
  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      security: []
      description: 使用账户恢复码重设密码；成功后轮换恢复码并使旧 JWT 失效。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PasswordResetRequest'}}}
      responses:
        '200': {description: 密码已更新，返回新的一次性恢复码, content: {application/json: {schema: {$ref: '#/components/schemas/ApiEnvelope'}}}}
        '400': {description: 请求字段或新密码不符合要求}
        '401': {description: 账号或恢复码无效}
        '429': {description: 15 分钟内失败次数过多}
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      description: 已登录账号校验当前密码后改密；成功后轮换 credentialVersion，使旧 JWT 失效，并返回新令牌。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChangePasswordRequest'}}}
      responses:
        '200': {description: 密码已更新，返回新的 JWT 会话}
        '400': {description: 新密码不符合强度要求或与当前密码相同}
        '401': {description: 未登录或当前密码不正确}
  /api/v1/auth/me:
    get: {tags: [auth], responses: {'200': {description: 当前用户}}}
  /api/v1/users/me/preferences/farmer-workspace:
    get:
      tags: [farm]
      description: 返回当前农户账号跨设备使用的地块排列顺序；新增或恢复的授权地块会稳定追加。
      responses:
        '200': {description: 当前农户工作台地块顺序}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [farm]
      description: 保存当前农户工作台地块顺序；使用 expectedRevision 防止多设备静默覆盖。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FarmerWorkspacePreferenceUpdateRequest'}}}}
      responses:
        '200': {description: 地块顺序已保存}
        '400': {description: 地块顺序格式或数量无效}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: 其他设备已更新顺序，需重新读取}
        '503': {description: 数据库不可用，写入未保存}
  /api/v1/system/status:
    get: {tags: [management], responses: {'200': {description: 依赖状态}}}
  /api/v1/system/ai-mode:
    put: {tags: [management], description: 仅系统管理员可切换智能模型运行模式（full/openai-compatible、rules-only、mock、maxkb），运行期生效、重启后还原为配置文件 AI_MODE 值, requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {aiMode: {type: string, example: full}}}}}}, responses: {'200': {description: 模式保存成功，返回 aiMode/previous/changed}, '400': {description: AI_MODE_INVALID 不支持的智能模型模式}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/simulator/status:
    get: {tags: [management], responses: {'200': {description: 进程内遥测模拟器状态（running、采样间隔、时间流速、已发送事件）}}}
  /api/v1/simulator/start:
    post: {tags: [management], description: 仅农场管理员或系统管理员可启动进程内模拟器, responses: {'200': {description: 模拟器已启动}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/simulator/stop:
    post: {tags: [management], description: 仅农场管理员或系统管理员可停止进程内模拟器, responses: {'200': {description: 模拟器已停止}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/simulator/settings:
    put: {tags: [management], description: 仅管理员可更新全局采样间隔（5–60 秒）和时间流速（1–288x），运行中下一拍生效, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 设置已保存}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/overview:
    get: {tags: [farm], parameters: [{$ref: '#/components/parameters/FarmIdQuery'}], responses: {'200': {description: 当前授权农场的多地块风险总览}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/market-prices:
    get:
      tags: [market]
      description: |
        仅 FARM_ADMIN 可读取其授权农场的日度批发市场参考行情。默认只返回本场在种作物，
        scope=all 返回系统映射的全部监测品种。正式数据按来源日期原样归档，缺失日期不插值，
        不是证券级实时成交或自动卖出信号。
      parameters:
        - {$ref: '#/components/parameters/FarmIdQueryRequired'}
        - {name: rangeDays, in: query, schema: {type: integer, enum: [7, 30, 90], default: 30}}
        - {name: scope, in: query, schema: {type: string, enum: [farm, all], default: farm}}
      responses:
        '200':
          description: 官方日行情、最近持久化快照或明确的不可用状态
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiEnvelope'}
                  - {type: object, properties: {data: {$ref: '#/components/schemas/MarketPriceOverview'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/farms:
    get: {tags: [farm], responses: {'200': {description: 授权农场列表}}}
  /api/v1/plots:
    get: {tags: [farm], parameters: [{$ref: '#/components/parameters/FarmIdQuery'}, {name: status, in: query, schema: {type: string, enum: [ACTIVE, INACTIVE]}}, {name: includeInactive, in: query, schema: {type: boolean, default: false}}], responses: {'200': {description: 按农场和生命周期过滤的授权地块列表}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {tags: [farm], description: 仅农场管理员可在自己管理的农场创建持久化 ACTIVE 地块；不复制示范农场遥测、设备或任务, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 地块持久化成功}, '403': {$ref: '#/components/responses/Forbidden'}, '503': {description: PLOT_PERSISTENCE_UNAVAILABLE，数据库不可用且不会创建临时地块}}}
  /api/v1/plots/{plotId}:
    patch: {tags: [farm], parameters: [{$ref: '#/components/parameters/PlotId'}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 修改作物、品种、生长阶段、生长周期或面积}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/plots/{plotId}/devices:
    put: {tags: [farm], description: 以完整集合方式维护地块设备绑定；设备可从其他地块直接转移，移除或转移后状态重置为 OFFLINE, parameters: [{$ref: '#/components/parameters/PlotId'}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 更新后的设备绑定集合}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 地块停用或跨农场设备绑定被拒绝}}}
    delete: {tags: [farm], description: 仅永久删除已经停用且没有历史依赖的地块；不级联清理历史, parameters: [{$ref: '#/components/parameters/PlotId'}, {name: confirmName, in: query, required: true, schema: {type: string}, description: 必须与地块完整名称一致}], responses: {'200': {description: 地块永久删除成功}, '400': {description: 地块名称确认不匹配}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 地块仍活跃或存在遥测、设备、批次、告警、任务、诊断或审计依赖；details.counts 返回分类数量}}}
  /api/v1/plots/{plotId}/deactivate:
    post: {tags: [farm], parameters: [{$ref: '#/components/parameters/PlotId'}], responses: {'200': {description: 将地块标记为 INACTIVE}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/plots/{plotId}/restore:
    post: {tags: [farm], parameters: [{$ref: '#/components/parameters/PlotId'}], responses: {'200': {description: 将停用地块恢复为 ACTIVE}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/plots/{plotId}/resolved-profile:
    get: {tags: [farm], parameters: [{$ref: '#/components/parameters/PlotId'}], responses: {'200': {description: 参数解析结果}}}
  /api/v1/plots/{plotId}/simulation:
    get:
      tags: [scenario]
      parameters: [{$ref: '#/components/parameters/PlotId'}]
      responses:
        '200': {description: 当前地块独立模拟策略、参数边界、硬件绑定和模拟器状态}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [scenario]
      description: 仅管理员可修改单个地块的场景；保存后由进程内模拟器在下一拍读取，不经 MQTT。
      parameters: [{$ref: '#/components/parameters/PlotId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlotSimulationUpdateRequest'}}}}
      responses:
        '200': {description: 策略已保存}
        '400': {description: 场景或阈值参数无效}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/plots/{plotId}/simulation/reset:
    post:
      tags: [scenario]
      description: 重置 HISTORY、FORECAST 或 ALL；只删除模拟遥测/预测记录，明确保留 sourceMode=REAL 的硬件数据。
      parameters: [{$ref: '#/components/parameters/PlotId'}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, properties: {target: {type: string, enum: [HISTORY, FORECAST, ALL], default: ALL}}}}}}
      responses:
        '200': {description: 重置结果与硬件数据保留标记}
        '400': {description: 重置目标无效}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/crop-packs:
    get: {tags: [farm], parameters: [{$ref: '#/components/parameters/FarmIdQuery'}, {name: includeDrafts, in: query, schema: {type: boolean, default: false}}], responses: {'200': {description: 全局与当前农场 Crop Pack 文档；缺失字段不会由 Mock 补齐}}}
    post: {tags: [farm], description: 系统管理员新增一个由数据库持久化并供三个角色共用的作物包, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'201': {description: 作物包已创建}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 相同作物编号和版本已存在}}}
  /api/v1/crop-packs/{cropCode}/{version}:
    put:
      tags: [farm]
      description: 系统管理员更新作物包；未出现在简化编辑表单中的规则与农艺字段会保留
      parameters:
        - {name: cropCode, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: string}}
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {description: 作物包已更新}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {description: 作物包不存在}}
    delete:
      tags: [farm]
      description: 删除用户维护的作物包版本；内置目录不会被物理删除
      parameters:
        - {name: cropCode, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: 用户维护版本已删除}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {description: 作物包不存在}, '409': {description: 内置作物包不可删除}}
  /api/v1/crop-packs/{cropCode}/{version}/status:
    patch:
      tags: [farm]
      description: 系统管理员发布作物包或转为草稿；状态通过数据库在三个角色间共享
      parameters:
        - {name: cropCode, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: string}}
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses: {'200': {description: 作物包状态已更新}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {description: 作物包不存在}}
  /api/v1/rule-sets:
    get: {tags: [management], parameters: [{$ref: '#/components/parameters/FarmIdQueryRequired'}], responses: {'200': {description: 全局及当前农场启用的确定性告警规则集}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {tags: [management], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'201': {description: 已保存当前农场告警规则}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 规则编号已存在}}}
  /api/v1/alert-learning-cases:
    get: {tags: [management], parameters: [{$ref: '#/components/parameters/FarmIdQueryRequired'}, {name: candidateId, in: query, schema: {type: string}}], responses: {'200': {description: 农场级告警闭环学习案例}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/farms/{farmId}/crop-packs:
    post: {tags: [management], parameters: [{name: farmId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'201': {description: 已保存农场级 Crop Pack 草稿}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/farms/{farmId}/crop-packs/{cropCode}/{version}:
    put: {tags: [management], parameters: [{name: farmId, in: path, required: true, schema: {type: string}}, {name: cropCode, in: path, required: true, schema: {type: string}}, {name: version, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 草稿已更新}, '409': {description: 版本冲突或已启用版本不可覆盖}}}
  /api/v1/farms/{farmId}/crop-packs/{cropCode}/{version}/validate:
    post: {tags: [management], parameters: [{name: farmId, in: path, required: true, schema: {type: string}}, {name: cropCode, in: path, required: true, schema: {type: string}}, {name: version, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Schema 与规则校验结果}}}
  /api/v1/farms/{farmId}/crop-packs/{cropCode}/{version}/activate:
    post: {tags: [management], parameters: [{name: farmId, in: path, required: true, schema: {type: string}}, {name: cropCode, in: path, required: true, schema: {type: string}}, {name: version, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 作物包已启用并替换同作物旧版本}, '409': {description: 版本冲突}}}
  /api/v1/farms/{farmId}/crop-packs/{cropCode}/{version}/archive:
    post: {tags: [management], parameters: [{name: farmId, in: path, required: true, schema: {type: string}}, {name: cropCode, in: path, required: true, schema: {type: string}}, {name: version, in: path, required: true, schema: {type: string}}], responses: {'200': {description: 作物包已归档}}}
  /api/v1/crop-manuals:
    get: {tags: [farm], parameters: [{$ref: '#/components/parameters/FarmIdQuery'}, {name: includeDrafts, in: query, schema: {type: boolean, default: false}}], responses: {'200': {description: 作物培养手册目录，来自当前农场可见的 Crop Pack}}}
  /api/v1/crop-manuals/{cropCode}:
    get:
      tags: [farm]
      parameters:
        - {name: cropCode, in: path, required: true, schema: {type: string}}
        - {name: stageCode, in: query, schema: {type: string}}
      responses:
        '200': {description: 指定作物/生长阶段的培养手册}
        '404': {description: 生长阶段不存在}
        '422': {description: Crop Pack 不存在}
  /api/v1/crop-manuals/{cropCode}/stages/{stageCode}:
    get:
      tags: [farm]
      parameters:
        - {name: cropCode, in: path, required: true, schema: {type: string}}
        - {name: stageCode, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 指定生长阶段培养手册}
        '404': {description: 生长阶段不存在}
  /api/v1/plots/{plotId}/crop-manual:
    get: {tags: [farm], parameters: [{$ref: '#/components/parameters/PlotId'}], responses: {'200': {description: 当前地块作物与生长阶段的培养手册}}}
  /api/v1/plots/{plotId}/health:
    get: {tags: [farm], parameters: [{$ref: '#/components/parameters/PlotId'}], responses: {'200': {description: 按 Crop Pack 阶段目标计算的综合健康分}}}
  /api/v1/crop-batches:
    get: {tags: [farm], parameters: [{$ref: '#/components/parameters/FarmIdQuery'}], responses: {'200': {description: 当前农场有权查看的种植批次}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {tags: [farm], description: 创建种植批次并锁定 Crop Pack 版本；Crop Pack 未给出时长时 plannedCycleDays 必填, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 批次已创建}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {description: 缺少计划周期或 Crop Pack}}}
  /api/v1/crop-batches/{batchId}/plan:
    get: {tags: [farm], parameters: [{$ref: '#/components/parameters/BatchId'}], responses: {'200': {description: 阶段任务}}}
  /api/v1/crop-batches/{batchId}/plan/generate:
    post: {tags: [farm], description: 按计划周期和 Crop Pack 阶段顺序生成可编辑的 DERIVED 预览, parameters: [{$ref: '#/components/parameters/BatchId'}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 生产计划预览}, '409': {description: 已审批计划不可重生成}, '422': {description: 计划周期或阶段缺失}}}
  /api/v1/crop-batches/{batchId}/plan/review:
    post: {tags: [farm], description: 审批原子化生成 CROP_PLAN 工单；重复审批不会生成重复工单, parameters: [{$ref: '#/components/parameters/BatchId'}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 已审批或已驳回计划}, '400': {description: 审批内容或模板来源无效}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/crop-batches/{batchId}/plan-actual:
    get: {tags: [farm], parameters: [{$ref: '#/components/parameters/BatchId'}], responses: {'200': {description: 计划/实际偏差}}}
  /api/v1/plots/{plotId}/telemetry:
    get:
      tags: [telemetry]
      parameters:
        - {$ref: '#/components/parameters/PlotId'}
        - {name: metric, in: query, description: 可选；不填返回地块全部指标, schema: {type: string, enum: [SOIL_MOISTURE, AIR_TEMPERATURE, AIR_HUMIDITY, LIGHT, CO2, PH, WATER_LEVEL, RAINFALL]}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, default: 1000, maximum: 10000}}
      responses: {'200': {description: 遥测历史}}
  /api/v1/telemetry:
    post:
      tags: [telemetry]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TelemetryEvent'}}}}
      responses: {'200': {description: 校验/去重后的遥测}}
  /api/v1/events/stream:
    get:
      tags: [telemetry]
      responses: {'200': {description: SSE 实时事件流, content: {text/event-stream: {schema: {type: string}}}}}
  /api/v1/plots/{plotId}/risk-forecast:
    get: {tags: [decision], parameters: [{$ref: '#/components/parameters/PlotId'}, {name: metric, in: query, description: 预测指标；与地块详情曲线选择一致, schema: {type: string, enum: [SOIL_MOISTURE, AIR_TEMPERATURE, AIR_HUMIDITY, LIGHT, CO2, PH, WATER_LEVEL, RAINFALL], default: SOIL_MOISTURE}}], responses: {'200': {description: 预测或明确弃权}}}
  /api/v1/plots/{plotId}/timeline:
    get: {tags: [decision], parameters: [{$ref: '#/components/parameters/PlotId'}], responses: {'200': {description: 决策时间轴}}}
  /api/v1/forecasts/evaluate:
    post:
      tags: [decision]
      description: 使用当前遥测锚点和未保存策略执行只读确定性试算；不会写入 forecast、地块策略、事件或审计记录。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ForecastEvaluationRequest'}}}}
      responses:
        '200':
          description: 只读试算快照；persisted 固定为 false，requestVersion 原样回显
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ApiEnvelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/ForecastEvaluationResult'}
        '400': {description: 场景、参数或干旱/积水阈值无效}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/rules/evaluate:
    post: {tags: [decision], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 规则评估}}}
  /api/v1/rules:
    get: {tags: [decision], responses: {'200': {description: Crop Pack 规则目录}}}
  /api/v1/diagnoses/evaluate:
    post: {tags: [decision], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 根因与证据}}}
  /api/v1/diagnoses/{diagnosisId}:
    get: {tags: [decision], parameters: [{$ref: '#/components/parameters/DiagnosisId'}], responses: {'200': {description: 根因详情}}}
  /api/v1/diagnoses/{diagnosisId}/explain:
    post: {tags: [decision], parameters: [{$ref: '#/components/parameters/DiagnosisId'}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 基于确定性诊断证据的 AI 解释；不改变主因、置信度或安全门}}}
  /api/v1/decisions/{subjectType}/{subjectId}/readiness:
    get:
      tags: [decision]
      parameters: [{name: subjectType, in: path, required: true, schema: {type: string}}, {name: subjectId, in: path, required: true, schema: {type: string}}]
      responses:
        '200':
          description: 四态决策就绪度；blockingEvidence 决定是否阻断，advisoryEvidence 只提示，executionAllowed 是最终执行判定。missingEvidence 与 conflicts 作为兼容和审计字段保留。
          content: {application/json: {schema: {$ref: '#/components/schemas/DecisionReadinessEnvelope'}}}
  /api/v1/decision-readiness/{readinessId}/evidence-requests:
    post:
      tags: [decision]
      parameters: [{name: readinessId, in: path, required: true, schema: {type: string}}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/EvidenceRequestCreate'}}}}
      responses:
        '200': {description: 已持久化的 OPEN 补证申请；包含 evidenceType、requesterId/requesterName、farmId、plotId、reason、createdAt 和当前状态}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: 巡田/补证操作记录数据库不可用，写入未保存，错误码 OPERATION_RECORD_PERSISTENCE_UNAVAILABLE}
  /api/v1/inspections:
    post:
      tags: [decision]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InspectionCreateRequest'}}}}
      responses:
        '200': {description: 已持久化的 USER_PROVIDED 巡田证据；关联任务时同时写入工单证据引用}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: 巡田/补证操作记录数据库不可用，写入未保存，错误码 OPERATION_RECORD_PERSISTENCE_UNAVAILABLE}
    get:
      tags: [decision]
      description: 按当前 JWT 角色读取持久化巡田记录；FARMER 仅返回本人提交或关联任务分配给本人的记录，FARM_ADMIN 返回指定授权农场全部记录。
      parameters:
        - {$ref: '#/components/parameters/FarmIdQuery'}
        - {name: plotId, in: query, schema: {type: string}, description: 可选地块筛选；与 farmId 同时提供时必须属于该农场}
      responses:
        '200': {description: 按 observedAt 倒序返回当前账号可见的巡田记录}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: 操作记录读取不可用}
  /api/v1/inspections/{inspectionId}/photos:
    post:
      tags: [decision]
      description: 为已保存的巡田记录追加现场照片。文件落本地附件目录，元数据标记 provenance=USER_PROVIDED，不覆盖遥测。
      parameters: [{name: inspectionId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files: {type: array, items: {type: string, format: binary}, maxItems: 6}
      responses:
        '200': {description: '含 photos[] 的巡田记录'}
        '400': {description: 类型、大小或数量不符合要求}
  /api/v1/inspections/{inspectionId}/photos/{photoId}:
    get:
      tags: [decision]
      parameters:
        - {name: inspectionId, in: path, required: true, schema: {type: string}}
        - {name: photoId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: 现场照片二进制
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '404': {description: 照片不存在}
  /api/v1/plots/{plotId}/inspections:
    get: {tags: [decision], parameters: [{$ref: '#/components/parameters/PlotId'}], responses: {'200': {description: 按观测时间倒序返回当前账号有权查看的持久化巡田证据}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/plots/{plotId}/irrigation-guard:
    get:
      tags: [decision]
      parameters:
        - {$ref: '#/components/parameters/PlotId'}
      responses:
        '200': {description: 当前阶段迟滞状态、无时间冷却的灌溉可用状态、自动浇水阈值和最近有效命令；仅限授权地块}
  /api/v1/plots/{plotId}/automatic-watering:
    get:
      tags: [decision]
      parameters:
        - {$ref: '#/components/parameters/PlotId'}
      responses:
        '200': {description: 当前地块自动浇水开关、阈值和来源；仅限授权地块}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [decision]
      description: 按当前操作人确认开启或关闭自动浇水；关闭只阻断自动触发，不改变手动灌溉的安全确认流程。
      parameters:
        - {$ref: '#/components/parameters/PlotId'}
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses:
        '200': {description: 已保存的自动浇水开关状态}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/irrigation/estimate:
    post: {tags: [decision], description: 生成灌溉处方并返回诊断、证据、就绪度、虚拟执行参数和 manualFallback；仅在存在阻塞且仍有可用水量时提供人工兜底入口, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 结构化灌溉处方}}}
  /api/v1/irrigation/auto:
    post: {tags: [decision], description: 土壤含水量低于 10% 且通过数据质量、设备、资源和权限校验时发起一次虚拟浇水；同一遥测事件使用幂等键避免重复命令, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 自动浇水触发、未触发或阻断结果}}}
  /api/v1/irrigation/manual:
    post:
      tags: [execution]
      description: 当前地块处于数据冲突、数据质量、设备状态或决策就绪度阻塞时，由有权限的操作人输入水量并确认一次虚拟人工浇灌；仅绕过决策门，仍校验地块权限、幂等、单次/每日水量、资源容量和最大执行时长。新的幂等键不受次数或冷却限制；结果沿用命令、ACK、效果评价和模拟遥测链路。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ManualIrrigationRequest'}}}}
      responses: {'200': {description: 带 manualOverride、sourcePlanId、bypassedGates、ACK 和效果评价的虚拟人工浇灌命令, content: {application/json: {schema: {$ref: '#/components/schemas/ManualIrrigationCommand'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 幂等键、处方上下文或人工兜底状态冲突}, '422': {description: 水量、时长或资源安全约束拒绝}}
  /api/v1/lighting/virtual:
    post:
      tags: [execution]
      description: 农户操作系统的虚拟补光入口。光照低于当前作物模型包阶段下限时可由本人确认执行；补光时长按系统整点小时选择，设备离线仅在 standalone/simulation 本地演示模式且 allowOfflineDemo=true 时放行，并明确记录为 SIMULATED，不控制真实灯具。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VirtualLightingRequest'}}}}
      responses: {'200': {description: 带离线演示标记、ACK、光照效果评价和模拟遥测的 LIGHT_BOOST 命令}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 幂等键或阶段光照状态冲突}, '422': {description: 光照不可用、未确认或设备不满足离线演示条件}}
  /api/v1/irrigation/plans/{planId}:
    get:
      tags: [decision]
      parameters:
        - name: planId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: 按地块权限读取原始灌溉处方}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/agent/chat:
    post: {tags: [decision], description: 携带 message、plotId、conversationId；可选 displayMessage 用于保存用户可读问题，避免将模型提示词写入历史；可选 images 最多 4 张 JPG/PNG/WebP 原文件 data URL，单张最大 8MB、总计最大 24MB，浏览器不缩放、不转码、不压缩；由原生多模态模型读取且不持久化原图；按当前角色返回连续回答或受控操作预览, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 受控 Agent 输出、可选 vision 元数据与 actionProposal}, '400': {description: 图片格式、数量或体积不符合限制}, '409': {description: 旧浏览器识图组件已停用，需刷新页面}}}
  /api/v1/agent/conversations:
    get:
      tags: [decision]
      description: 按当前 JWT 账号返回最近的 Agent 会话摘要；可按地块过滤，过滤发生在排序和数量限制之前；农户仅能看到自己的会话。
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
        - {name: archived, in: query, schema: {type: boolean, default: false}}
        - {name: plotId, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: 会话标题、关联地块、最后时间和消息数}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/agent/conversations/{conversationId}:
    put:
      tags: [decision]
      description: 更新当前账号拥有的 Agent 会话摘要；可修改标题或置顶状态，服务端校验会话归属。
      parameters:
        - {name: conversationId, in: path, required: true, schema: {type: string, maxLength: 120}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string, maxLength: 36}
                pinned: {type: boolean}
              minProperties: 1
      responses:
        '200': {description: 更新后的会话摘要}
        '400': {description: 没有可更新字段或标题无效}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 对话不存在}
    delete:
      tags: [decision]
      description: 删除当前账号拥有的 Agent 对话及其消息；服务端校验会话归属。
      parameters:
        - {name: conversationId, in: path, required: true, schema: {type: string, maxLength: 120}}
      responses:
        '200': {description: 对话及消息已删除}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: 对话不存在}
  /api/v1/agent/history:
    get:
      tags: [decision]
      description: 按 conversationId 返回当前账号可见的消息历史；会话归属由服务端校验。
      parameters:
        - {name: conversationId, in: query, required: false, schema: {type: string, maxLength: 120}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 40}}
      responses:
        '200': {description: 连续消息、来源和可选 actionProposal}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/agent/actions/{actionId}:
    get: {tags: [decision], description: 查询当前操作所有者的预览、执行中或最终状态, parameters: [{name: actionId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Agent 操作状态与结果}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {description: 操作不存在}}}
  /api/v1/agent/actions/{actionId}/confirm:
    post: {tags: [decision], description: 当前操作所有者确认 10 分钟内的 Agent 操作预览；服务端按工具与角色重新校验权限、范围、安全门和幂等键, parameters: [{name: actionId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 执行结果与受影响事实}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 操作已过期、已处理或状态冲突}}}
  /api/v1/agent/actions/{actionId}/cancel:
    post: {tags: [decision], description: 当前操作所有者取消待确认的 Agent 操作预览, parameters: [{name: actionId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: 操作已取消}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 操作已处理}}}
  /api/v1/agent/tools:
    get: {tags: [decision], description: 按当前身份返回白名单工具及 JSON Schema 版本；农户不返回管理员写工具, responses: {'200': {description: 白名单工具及 JSON Schema 版本}}}
  /api/v1/agent/runs/{traceId}:
    get: {tags: [decision], parameters: [{$ref: '#/components/parameters/TraceId'}], responses: {'200': {description: Agent trace}}}
  /api/v1/decision-passports/{traceId}:
    get: {tags: [decision], parameters: [{$ref: '#/components/parameters/TraceId'}], responses: {'200': {description: 决策护照}}}
  /api/v1/decisions/{traceId}/feedback:
    post: {tags: [decision], parameters: [{$ref: '#/components/parameters/TraceId'}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 反馈/合格案例}}}
  /api/v1/decisions/{traceId}/similar-cases:
    get: {tags: [decision], parameters: [{$ref: '#/components/parameters/TraceId'}], responses: {'200': {description: 确定性相似案例}}}
  /api/v1/commands/virtual:
    post:
      tags: [execution]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VirtualCommandRequest'}}}}
      responses: {'200': {description: 虚拟命令}, '409': {description: 幂等或自动浇水资格冲突}, '422': {description: 就绪度/安全拒绝}}
  /api/v1/commands/{commandId}:
    get: {tags: [execution], parameters: [{$ref: '#/components/parameters/CommandId'}], responses: {'200': {description: 命令与 ACK}}}
  /api/v1/commands/{commandId}/ack:
    post: {tags: [execution], parameters: [{$ref: '#/components/parameters/CommandId'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CommandAck'}}}}, responses: {'200': {description: ACK 与效果评价}}}
  /api/v1/commands/{commandId}/evaluation:
    get: {tags: [execution], parameters: [{$ref: '#/components/parameters/CommandId'}], responses: {'200': {description: 效果评价}}}
  /api/v1/scenarios/runs:
    post: {tags: [scenario], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 固定 seed 情景运行}}}
    get: {tags: [scenario], responses: {'200': {description: 情景运行列表}}}
  /api/v1/scenarios/runs/{runId}:
    get: {tags: [scenario], parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {description: 情景运行}}}
  /api/v1/scenarios/runs/{runId}/snapshot:
    get: {tags: [scenario], parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {description: 冻结只读快照}}}
  /api/v1/scenarios/compare:
    post:
      tags: [scenario]
      description: 使用同一 plotId、冻结快照和 seed 生成只读 EXECUTE/NO_ACTION 双轨；农户仅能比较授权地块且不写回主遥测
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses:
        '200': {description: branches、frozenSnapshot、seed 与兼容的 leftBranch/rightBranch 双轨结果}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/work-items/today:
    get: {tags: [management], parameters: [{$ref: '#/components/parameters/FarmIdQuery'}, {name: plotId, in: query, schema: {type: string}}], responses: {'200': {description: 按当前农场和地块范围过滤的今日农务}}}
  /api/v1/work-orders:
    post: {tags: [management], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 工单}}}
    get: {tags: [management], parameters: [{name: farmId, in: query, schema: {type: string}}, {name: plotId, in: query, schema: {type: string}}, {name: status, in: query, schema: {type: string}}, {name: assigneeId, in: query, schema: {type: string}}], responses: {'200': {description: 按角色和农场地块范围过滤的工单}}}
  /api/v1/work-orders/{workOrderId}/assign:
    post: {tags: [management], parameters: [{name: workOrderId, in: path, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssignWorkOrderRequest'}}}}, responses: {'200': {description: 管理员将任务分配或重新分配给有对应地块权限的活跃种植农户}}}
  /api/v1/work-orders/{workOrderId}/transition:
    post: {tags: [management], parameters: [{name: workOrderId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 农户开始、重新处理、提交结果或管理员取消任务}}}
  /api/v1/work-orders/{workOrderId}/report-issue:
    post: {tags: [management], description: 农户填写具体问题并创建与原任务关联的 FARMER_REPORT 工单；同一农户对同一任务的未结束上报幂等复用，管理员通过工单列表和实时事件接收, parameters: [{name: workOrderId, in: path, required: true, schema: {type: string}}], requestBody: {required: false, content: {application/json: {schema: {type: object, required: [description], properties: {description: {type: string, minLength: 2, maxLength: 1000}, priority: {type: string, enum: [HIGH, MEDIUM, LOW]}}}}}}, responses: {'200': {description: 关联的 FARMER_REPORT 工单与原任务摘要}, '400': {description: 问题描述为空或超过长度限制}, '403': {description: 仅允许该任务的执行农户上报}, '409': {description: 原任务已结束}}}
  /api/v1/work-orders/{workOrderId}/review:
    post: {tags: [management], parameters: [{name: workOrderId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 管理员验收通过或退回任务}}}
  /api/v1/farm-members:
    get: {tags: [management], parameters: [{name: farmId, in: query, required: true, schema: {type: string}}], responses: {'200': {description: 当前农场种植农户；只返回 FARMER 和任务分配所需的安全字段}, '403': {description: 当前账号无该农场成员读取权限}}}
    post: {tags: [management], description: 仅创建种植农户账号并分配当前农场地块；明确拒绝 FARM_ADMIN 和 SYSTEM_ADMIN，关闭角色提升入口, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'201': {description: 已创建种植农户成员}, '400': {description: 账号或初始密码不符合要求}, '403': {description: 无农场管理权限或 MEMBER_ROLE_FORBIDDEN}, '409': {description: 成员账号已存在}, '503': {description: ACCOUNT_PERSISTENCE_UNAVAILABLE}}}
  /api/v1/farm-members/{userId}/status:
    patch:
      tags: [management]
      description: 启用或停用当前农场的种植农户；停用后立即拒绝旧 JWT
      parameters: [{name: userId, in: path, required: true, schema: {type: string}}]
      requestBody: {$ref: '#/components/requestBodies/JsonObject'}
      responses:
        '200': {description: 更新后的成员视图}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/farm-members/{userId}:
    delete: {tags: [management], description: 从当前农场移除种植农户并保留其其他农场范围, parameters: [{name: userId, in: path, required: true, schema: {type: string}}, {name: farmId, in: query, required: true, schema: {type: string}}], responses: {'200': {description: 成员已从当前农场移除}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {description: 成员不存在或不属于当前农场}}}
  /api/v1/farm-members/{userId}/scope:
    patch: {tags: [management], description: 仅维护当前农场种植农户的地块范围；保留其他农场范围且禁止修改角色, parameters: [{name: userId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 更新后的当前农场成员视图}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 成员不属于当前农场}}}
  /api/v1/users:
    get:
      tags: [management]
      description: SYSTEM_ADMIN 读取全平台真实账号及安全范围字段；不返回密码、恢复码哈希或 credentialVersion。
      responses:
        '200': {description: 全局账号列表, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/ApiEnvelope'}, {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/UserAccount'}}}}]}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [management]
      description: SYSTEM_ADMIN 创建三类账号；SYSTEM_ADMIN 仍须再次提交服务端授权码。成功响应中的恢复码只显示一次。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateUserAccountRequest'}}}}
      responses:
        '201': {description: 账号持久化成功，返回安全账号字段与一次性恢复码}
        '400': {description: 账号、密码、角色或范围无效}
        '403': {description: ACCOUNT_MANAGEMENT_FORBIDDEN 或 SYSTEM_ADMIN_AUTHORIZATION_INVALID}
        '429': {description: SYSTEM_ADMIN_AUTHORIZATION_RATE_LIMITED}
        '409': {description: 账号已存在}
        '503': {description: SYSTEM_ADMIN_CREATION_DISABLED 或 ACCOUNT_PERSISTENCE_UNAVAILABLE}
  /api/v1/users/{userId}/status:
    patch:
      tags: [management]
      description: SYSTEM_ADMIN 启用或停用 FARMER/FARM_ADMIN；所有 SYSTEM_ADMIN 账号永久保护。
      parameters: [{name: userId, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountStatusRequest'}}}}
      responses:
        '200': {description: 更新后的安全账号视图}
        '403': {description: ACCOUNT_MANAGEMENT_FORBIDDEN 或 ACCOUNT_SYSTEM_ADMIN_PROTECTED}
        '404': {description: 账号不存在}
        '503': {description: ACCOUNT_PERSISTENCE_UNAVAILABLE}
  /api/v1/users/{userId}:
    delete: {tags: [management], description: SYSTEM_ADMIN 删除 FARMER 或 FARM_ADMIN；所有 SYSTEM_ADMIN 账号永久保护且不能删除, parameters: [{name: userId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: 账号已删除}, '400': {description: 不能删除自己的账号}, '403': {description: ACCOUNT_DELETE_FORBIDDEN 或 ACCOUNT_SYSTEM_ADMIN_PROTECTED}, '404': {description: 账号不存在}, '503': {description: ACCOUNT_PERSISTENCE_UNAVAILABLE}}}
  /api/v1/alerts:
    get: {tags: [management], parameters: [{$ref: '#/components/parameters/FarmIdQuery'}], responses: {'200': {description: 当前农场范围内的告警列表}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/alerts/{alertId}/ack:
    post: {tags: [management], parameters: [{name: alertId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 确认告警}}}
  /api/v1/alerts/{alertId}/close:
    post: {tags: [management], parameters: [{name: alertId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: 关闭告警}}}
  /api/v1/alerts/{alertId}/verification-task:
    post: {tags: [management], description: 单条发布现场核查任务；按地块权限和当前负载自动选择农户，重复请求复用未结束核查任务, parameters: [{name: alertId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 核查任务与分配依据}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 告警已结束或暂无可分配农户}}}
  /api/v1/alerts/{alertId}/escalate:
    post: {tags: [management], parameters: [{name: alertId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: 升级告警}}}
  /api/v1/resource-plans/evaluate:
    post: {tags: [management], description: mode=AUTO 时按 farmId 分析全部活跃地块并生成 10 分钟有效的 DRAFT；继续兼容 demands 试算, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: water-allocation-v2 资源计划草案}}}
  /api/v1/resource-profiles/water:
    get: {tags: [management], description: 读取农场固定日配额、预留、实际使用、余额和未来配额, parameters: [{$ref: '#/components/parameters/FarmIdQuery'}, {name: date, in: query, required: false, schema: {type: string, format: date}}], responses: {'200': {description: 水资源配置与当日余额}, '403': {$ref: '#/components/responses/Forbidden'}}}
    put: {tags: [management], description: 只能设置次日及未来生效的 dailyQuotaLitres，当前日配额冻结, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 更新后的未来配额}, '400': {description: 生效日期或配额无效}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/resource-plans:
    get: {tags: [management], description: 管理员读取农场计划；农户仅返回其授权地块分配, parameters: [{$ref: '#/components/parameters/FarmIdQuery'}, {name: businessDate, in: query, required: false, schema: {type: string, format: date}}, {name: status, in: query, required: false, schema: {type: string}}], responses: {'200': {description: 资源计划列表}}}
  /api/v1/resource-plans/{resourcePlanId}:
    patch: {tags: [management], description: 草稿计划人工调整，必须填写原因并携带 expectedRevision, parameters: [{name: resourcePlanId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 重新校验后的草案}, '409': {description: 版本冲突或计划已过期}}}
    get: {tags: [management], parameters: [{name: resourcePlanId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: 资源计划详情}}}
  /api/v1/resource-plans/{resourcePlanId}/confirm:
    post: {tags: [management], description: 管理员整批确认并原子预留水量；重复确认幂等, parameters: [{name: resourcePlanId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: CONFIRMED 计划}, '409': {description: 过期、版本冲突或余额不足}}}
  /api/v1/resource-plans/{resourcePlanId}/cancel:
    post: {tags: [management], description: 计划开始前取消并释放预留, parameters: [{name: resourcePlanId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: CANCELLED 计划}, '409': {description: 计划已开始执行}}}
  /api/v1/value-ledgers:
    get: {tags: [management], parameters: [{$ref: '#/components/parameters/FarmIdQueryRequired'}], responses: {'200': {description: 当前农场的价值账本}}}
    post: {tags: [management], description: 只按观测事实或管理员明确录入计算水量偏差、节水量和水费，并保存 sourceMode, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: COMPUTED/INCOMPLETE 价值账本}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /api/v1/strategy-candidates:
    get: {tags: [management], parameters: [{$ref: '#/components/parameters/FarmIdQuery'}, {name: status, in: query, schema: {type: string}}], responses: {'200': {description: 农场级策略候选；农场管理员只返回自己农场}}}
    post: {tags: [management], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: DRAFT}}}
  /api/v1/strategy-candidates/{id}/offline-validate:
    post: {tags: [management], parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: OFFLINE_VALIDATED}}}
  /api/v1/strategy-candidates/{id}/transition:
    post: {tags: [management], parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 审批/激活/回滚}}}
  /api/v1/strategy-candidates/{id}/activate:
    post: {tags: [management], parameters: [{name: id, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 农场管理员批准并启用策略候选}, '409': {description: 版本冲突或候选状态不允许}}}
  /api/v1/strategy-candidates/preview:
    get: {tags: [management], parameters: [{$ref: '#/components/parameters/FarmIdQueryRequired'}, {name: alertId, in: query, required: true, schema: {type: string}}], responses: {'200': {description: 相似 ACTIVE 策略的只读决策预览；仍需人工确认}}}
  /api/v1/devices:
    get: {tags: [management], parameters: [{$ref: '#/components/parameters/FarmIdQueryRequired'}], responses: {'200': {description: 当前农场的设备事实列表}}}
    post: {tags: [management], description: 注册设备；sourceMode 可选 SIMULATION（默认）或 REAL，初始固定 OFFLINE/UNBOUND，模拟设备可受控切换，真实设备需等待 MQTT 回执, requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 设备已注册并保存 dataOrigin}, '400': {description: sourceMode 无效}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 设备编号已存在}}}
  /api/v1/devices/{deviceId}:
    patch: {tags: [management], description: 仅修改设备名称和设备类型；设备编号、所属农场和接入来源不可变, parameters: [{name: deviceId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 更新后的设备事实}, '400': {description: 名称或类型无效}, '403': {$ref: '#/components/responses/Forbidden'}}}
    delete: {tags: [management], description: 永久删除设备主记录；必须离线、未绑定且没有待回执控制命令，并通过 confirmName 精确确认；遥测、命令和审计历史保留, parameters: [{name: deviceId, in: path, required: true, schema: {type: string}}, {name: confirmName, in: query, required: true, schema: {type: string}}], responses: {'200': {description: 设备已删除且历史记录保留}, '400': {description: 名称确认不匹配}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 设备在线、已绑定或控制回执未完成}}}
  /api/v1/devices/{deviceId}/bind:
    post: {tags: [management], description: 设备与地块必须属于同一农场，且地块必须为 ACTIVE, parameters: [{name: deviceId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 绑定设备但不改变心跳状态}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 跨农场或停用地块绑定被拒绝}}}
  /api/v1/devices/{deviceId}/unbind:
    post: {tags: [management], parameters: [{name: deviceId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: 解绑设备}}}
  /api/v1/devices/{deviceId}/control:
    post: {tags: [management], description: 仅农场管理员可控制已绑定设备；模拟设备即时完成，REAL/HARDWARE 设备必须等待 MQTT ACK，失败或超时不伪造实际状态, parameters: [{name: deviceId, in: path, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceControlRequest'}}}}, responses: {'200': {description: 控制命令及最新设备记录}, '400': {description: 目标状态或幂等键无效}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {description: 设备未绑定或没有控制通道}}}
  /api/v1/devices/{deviceId}/heartbeat:
    post: {tags: [management], parameters: [{name: deviceId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonObject'}, responses: {'200': {description: 心跳恢复}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    FarmIdQuery: {name: farmId, in: query, required: false, schema: {type: string}}
    FarmIdQueryRequired: {name: farmId, in: query, required: true, schema: {type: string}}
    PlotId: {name: plotId, in: path, required: true, schema: {type: string}}
    BatchId: {name: batchId, in: path, required: true, schema: {type: string}}
    DiagnosisId: {name: diagnosisId, in: path, required: true, schema: {type: string}}
    CommandId: {name: commandId, in: path, required: true, schema: {type: string}}
    TraceId: {name: traceId, in: path, required: true, schema: {type: string}}
    RunId: {name: runId, in: path, required: true, schema: {type: string}}
  requestBodies:
    JsonObject:
      required: true
      content: {application/json: {schema: {type: object, additionalProperties: true}}}
  responses:
    Unauthorized: {description: 认证失败}
    Forbidden: {description: 当前角色或农场/地块范围不允许该操作}
  schemas:
    ApiEnvelope:
      type: object
      required: [requestId, timestamp, schemaVersion]
      properties:
        requestId: {type: string, format: uuid}
        timestamp: {type: string, format: date-time}
        schemaVersion: {type: string}
        data: {type: object, nullable: true}
        error: {type: object, nullable: true}
    DecisionReadinessEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/DecisionReadiness'}
    DecisionReadiness:
      type: object
      required: [readinessId, subject, plotId, status, hardGates, missingEvidence, blockingEvidence, advisoryEvidence, executionAllowed, conflicts, requiredActions, policyVersion]
      properties:
        readinessId: {type: string}
        subject:
          type: object
          required: [type, id]
          properties:
            type: {type: string}
            id: {type: string}
        plotId: {type: string}
        status: {type: string, enum: [READY, NEEDS_EVIDENCE, HUMAN_REVIEW, UNAVAILABLE]}
        score: {type: number, minimum: 0, maximum: 1}
        hardGates: {type: object, additionalProperties: {type: string, enum: [PASS, REVIEW, FAIL]}}
        missingEvidence: {type: array, items: {type: string}, description: 兼容字段；包含阻断和提醒证据，不能单独决定执行}
        blockingEvidence: {type: array, items: {type: string}, description: 当前必须补齐的硬阻断证据}
        advisoryEvidence: {type: array, items: {type: string}, description: 当前仅提示但不阻断常规低风险人工确认灌溉的证据}
        executionAllowed: {type: boolean, description: 前端执行按钮和后端控制接口共同使用的最终允许标记}
        conflicts: {type: array, items: {type: string}}
        requiredActions: {type: array, items: {type: object, additionalProperties: true}}
        policyVersion: {type: string, example: readiness-v2}
        evaluatedAt: {type: string, format: date-time}
    MarketPriceOverview:
      type: object
      required: [farmId, scope, rangeDays, sourceStatus, historyPersistence, availableCropCount, totalCropCount, source, crops]
      properties:
        farmId: {type: string}
        scope: {type: string, enum: [FARM_CROPS, ALL_CATALOG]}
        rangeDays: {type: integer, enum: [7, 30, 90]}
        sourceStatus: {type: string, enum: [LIVE, CACHED, UNAVAILABLE, DISABLED]}
        asOf: {type: string, format: date, nullable: true}
        generatedAt: {type: string, format: date-time}
        historyPersistence: {type: string, description: 当前快照归档介质；IN_MEMORY_FALLBACK 表示历史无法跨重启保留}
        farmCropCodes: {type: array, items: {type: string}}
        availableCropCount: {type: integer, minimum: 0}
        totalCropCount: {type: integer, minimum: 0}
        source:
          type: object
          required: [provider, name, url, cadence, provinceCode, provinceName, unit, method, disclaimer]
          properties:
            provider: {type: string, enum: [MOA_PFSC]}
            name: {type: string}
            url: {type: string, format: uri}
            cadence: {type: string, enum: [DAILY]}
            provinceCode: {type: string}
            provinceName: {type: string}
            preferredMarket: {type: string}
            unit: {type: string, enum: [元/公斤]}
            method: {type: string, description: 参考市场报价优先；否则使用省内上报市场简单平均，非成交量加权}
            disclaimer: {type: string}
        crops: {type: array, items: {$ref: '#/components/schemas/MarketPriceCrop'}}
    MarketPriceCrop:
      type: object
      required: [cropCode, cropName, marketVarietyName, emoji, inFarm, available, status, unit, marketCount, history, salesObservation]
      properties:
        cropCode: {type: string}
        cropName: {type: string}
        marketVarietyName: {type: string, description: 上游行情系统中的匹配品种名称}
        emoji: {type: string}
        inFarm: {type: boolean}
        available: {type: boolean}
        status: {type: string, enum: [LIVE, CACHED, UNAVAILABLE]}
        quoteDate: {type: string, format: date, nullable: true}
        latestPrice: {type: number, format: double, nullable: true}
        unit: {type: string, enum: [元/公斤]}
        change: {type: number, format: double, nullable: true}
        changePct: {type: number, format: double, nullable: true}
        sevenDayChangePct: {type: number, format: double, nullable: true}
        movingAverage7: {type: number, format: double, nullable: true}
        minPrice: {type: number, format: double, nullable: true}
        maxPrice: {type: number, format: double, nullable: true}
        marketCount: {type: integer, minimum: 0}
        priceBasis: {type: string, enum: [PREFERRED_MARKET, PROVINCE_SIMPLE_AVERAGE], nullable: true}
        preferredMarket: {type: string}
        marketQuotes: {type: array, items: {$ref: '#/components/schemas/MarketPriceQuote'}}
        history: {type: array, description: 仅包含实际归档日；客户端必须把缺失日期保留为空白, items: {$ref: '#/components/schemas/MarketPricePoint'}}
        historyDays: {type: integer, minimum: 0}
        requestedRangeDays: {type: integer, enum: [7, 30, 90]}
        salesObservation:
          type: object
          required: [tone, label, message, basis, actionable]
          properties:
            tone: {type: string, enum: [NEUTRAL, STRONG, WEAK, RANGE]}
            label: {type: string}
            message: {type: string}
            basis: {type: string}
            actionable: {type: boolean, description: 仅表示真实样本是否达到规则计算门槛，不构成交易建议}
    MarketPricePoint:
      type: object
      required: [date, price, minPrice, maxPrice, marketCount, priceBasis]
      properties:
        date: {type: string, format: date}
        price: {type: number, format: double, nullable: true}
        minPrice: {type: number, format: double, nullable: true}
        maxPrice: {type: number, format: double, nullable: true}
        marketCount: {type: integer, minimum: 0}
        priceBasis: {type: string, nullable: true}
    MarketPriceQuote:
      type: object
      required: [marketName, price, unit, preferred]
      properties:
        marketName: {type: string}
        price: {type: number, format: double, minimum: 0}
        unit: {type: string, enum: [元/公斤]}
        preferred: {type: boolean}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1}
        password: {type: string, format: password, minLength: 1}
        role: {type: string, enum: [FARM_ADMIN, FARMER, SYSTEM_ADMIN]}
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 4, maxLength: 32, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{3,31}$'}
        password: {type: string, format: password, minLength: 8, maxLength: 64}
        role: {type: string, enum: [FARMER, FARM_ADMIN, SYSTEM_ADMIN], default: FARMER}
        authorizationCode: {type: string, format: password, writeOnly: true, description: 仅 role=SYSTEM_ADMIN 时必填；与服务端环境配置进行恒定时间比较}
        farmProfile: {$ref: '#/components/schemas/FarmRegistrationProfile'}
    FarmRegistrationProfile:
      type: object
      description: 仅 role=FARM_ADMIN 时必填；成功后创建该管理员独占的空农场。
      required: [name, region]
      properties:
        name: {type: string, minLength: 2, maxLength: 60}
        region: {type: string, minLength: 2, maxLength: 80}
    CreateUserAccountRequest:
      type: object
      required: [username, password, role]
      properties:
        username: {type: string, minLength: 4, maxLength: 32, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{3,31}$'}
        password: {type: string, format: password, writeOnly: true, minLength: 8, maxLength: 64}
        role: {type: string, enum: [FARMER, FARM_ADMIN, SYSTEM_ADMIN]}
        farmId: {type: string, description: FARMER/FARM_ADMIN 必填；SYSTEM_ADMIN 忽略}
        plotIds: {type: array, items: {type: string}, description: FARMER 可选；FARM_ADMIN 自动获得所属农场完整范围}
        authorizationCode: {type: string, format: password, writeOnly: true, description: 创建 SYSTEM_ADMIN 时必填}
    AccountStatusRequest:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    UserAccount:
      type: object
      required: [userId, username, role, roleLabel, farmIds, plotIds, enabled, status]
      properties:
        userId: {type: string}
        username: {type: string}
        role: {type: string, enum: [FARMER, FARM_ADMIN, SYSTEM_ADMIN]}
        roleLabel: {type: string}
        farmIds: {type: array, items: {type: string}}
        plotIds: {type: array, items: {type: string}}
        enabled: {type: boolean}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PasswordResetRequest:
      type: object
      required: [username, recoveryCode, newPassword]
      properties:
        username: {type: string, minLength: 4, maxLength: 32}
        recoveryCode: {type: string, example: ABCD-EFGH-JKLM-NPQR}
        newPassword: {type: string, format: password, minLength: 8, maxLength: 64}
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, format: password}
        newPassword: {type: string, format: password, minLength: 8, maxLength: 64}
    FarmerWorkspacePreference:
      type: object
      required: [userId, scope, plotOrder, revision]
      properties:
        userId: {type: string}
        scope: {type: string, enum: [FARMER_WORKSPACE]}
        plotOrder: {type: array, items: {type: string}, maxItems: 500}
        revision: {type: integer, minimum: 0}
        updatedAt: {type: string, format: date-time, nullable: true}
    FarmerWorkspacePreferenceUpdateRequest:
      type: object
      required: [plotOrder, expectedRevision]
      properties:
        plotOrder: {type: array, items: {type: string}, maxItems: 500}
        expectedRevision: {type: integer, minimum: 0}
    TelemetryEvent:
      type: object
      required: [eventId, plotId, deviceId, metric, value, ts]
      properties:
        eventId: {type: string}
        farmId: {type: string}
        plotId: {type: string}
        deviceId: {type: string}
        metric: {type: string, enum: [SOIL_MOISTURE, AIR_TEMPERATURE, AIR_HUMIDITY, LIGHT, CO2, PH, WATER_LEVEL, RAINFALL]}
        value: {type: number}
        unit: {type: string}
        ts: {type: string, format: date-time}
        quality: {type: object, additionalProperties: true}
        scenarioId: {type: string}
        branchId: {type: string, enum: [MAIN, EXECUTE, NO_ACTION]}
        sourceMode: {type: string, enum: [REAL, SIMULATION]}
        provenance: {type: string, enum: [OBSERVED, USER_PROVIDED, DERIVED, SIMULATED, ESTIMATED]}
        dataOrigin: {type: string}
    PlotSimulationUpdateRequest:
      type: object
      required: [scenario]
      properties:
        scenario: {type: string, enum: [NORMAL, DROUGHT, HEAVY_RAIN, SENSOR_DRIFT, DEVICE_OFFLINE]}
        parameters:
          type: object
          description: 地块专属参数；服务端按参数边界裁剪并拒绝干旱阈值不小于积水阈值。
          additionalProperties: {type: number}
    ForecastEvaluationRequest:
      type: object
      required: [plotId]
      properties:
        plotId: {type: string}
        metric: {type: string, enum: [SOIL_MOISTURE, AIR_TEMPERATURE, AIR_HUMIDITY, LIGHT, CO2, PH, WATER_LEVEL, RAINFALL], default: SOIL_MOISTURE}
        scenario: {type: string, enum: [NORMAL, DROUGHT, HEAVY_RAIN, SENSOR_DRIFT, DEVICE_OFFLINE], description: 省略时继承当前地块策略}
        parameters: {type: object, additionalProperties: {type: number}, description: 仅作用于本次试算，越界值会被裁剪并在 warnings 中说明}
        requestVersion: {description: 客户端竞态序号，服务端不解释并原样回显, oneOf: [{type: string}, {type: integer}]}
    ForecastEvaluationResult:
      type: object
      required: [plotId, metric, status, persisted, modelMode, dataSource, inputSnapshot, warnings]
      properties:
        plotId: {type: string}
        metric: {type: string}
        status: {type: string, enum: [AVAILABLE, UNAVAILABLE]}
        persisted: {type: boolean, enum: [false]}
        requestVersion: {nullable: true, oneOf: [{type: string}, {type: integer}]}
        modelMode: {type: string, enum: [DETERMINISTIC_WHAT_IF]}
        dataSource: {type: string, enum: [OBSERVED_PLUS_STRATEGY, SIMULATION_STRATEGY]}
        curve: {type: array, items: {type: object, additionalProperties: true}}
        inputSnapshot: {type: object, additionalProperties: true}
        explanation: {type: object, additionalProperties: true}
        warnings: {type: array, items: {type: string}}
    VirtualCommandRequest:
      type: object
      required: [plotId, idempotencyKey, confirmed]
      properties:
        plotId: {type: string}
        planId: {type: string}
        idempotencyKey: {type: string, minLength: 8}
        confirmed: {type: boolean, description: 当前操作人已核对处方并确认执行；不要求管理员审批}
        approved: {type: boolean, deprecated: true, description: 旧版管理员页面兼容字段；新调用请使用 confirmed}
        approvalRequired: {type: boolean, default: false, description: 固定为 false，保留安全确认而非管理员审批}
        confirmationMode: {type: string, enum: [OPERATOR_CONFIRMED]}
        outcome: {type: string, enum: [SUCCEEDED, PARTIAL, FAILED, TIMEOUT]}
    ManualIrrigationRequest:
      type: object
      required: [plotId, sourcePlanId, waterLitre, idempotencyKey, confirmed]
      properties:
        plotId: {type: string}
        sourcePlanId: {type: string, description: 当前被阻塞灌溉处方编号；服务端会重新确认阻塞状态}
        waterLitre: {type: number, format: double, minimum: 0.1, description: 本次人工浇灌水量（升），仍受单次、每日和资源上限约束}
        idempotencyKey: {type: string, minLength: 1}
        confirmed: {type: boolean, description: 当前操作人已核对地块、原因和水量并确认虚拟人工浇灌}
        source: {type: string, default: farmer-manual-fallback}
    VirtualLightingRequest:
      type: object
      required: [plotId, idempotencyKey, confirmed]
      properties:
        plotId: {type: string}
        boostLux: {type: number, minimum: 1000, description: 模拟补光增量，服务端按阶段上限裁剪}
        durationSeconds: {type: integer, minimum: 1, maximum: 28800, default: 7200, description: 补光计划时长，前端按 1/2/4/6/8 小时选取；虚拟执行不会等待真实时长}
        idempotencyKey: {type: string, minLength: 8}
        confirmed: {type: boolean, description: 当前农户已核对地块并确认虚拟补光}
        allowOfflineDemo: {type: boolean, default: false, description: 仅本地 standalone/simulation 模式允许离线设备虚拟执行}
        source: {type: string, default: farmer-operation-system}
        outcome: {type: string, enum: [SUCCEEDED, PARTIAL, FAILED, TIMEOUT]}
    ManualIrrigationCommand:
      type: object
      required: [commandId, plotId, planId, sourcePlanId, manualOverride, waterLitre, manualWaterLitre, confirmationMode, executionMode, provenance, virtualOnly, cooldownMinutes]
      properties:
        commandId: {type: string}
        plotId: {type: string}
        planId: {type: string, description: 本次虚拟执行使用的刷新后灌溉处方}
        sourcePlanId: {type: string, description: 农户发起人工兜底时查看的被阻塞处方}
        manualOverride: {type: boolean, enum: [true]}
        manualWaterLitre: {type: number, minimum: 0.1}
        waterLitre: {type: number, minimum: 0.1}
        durationSeconds: {type: integer, minimum: 1}
        bypassedGates: {type: array, items: {type: string}}
        overrideReasonCode: {type: string}
        confirmationMode: {type: string, enum: [OPERATOR_MANUAL_OVERRIDE]}
        executionMode: {type: string, enum: [SIMULATED]}
        provenance: {type: string, enum: [SIMULATED]}
        virtualOnly: {type: boolean, enum: [true]}
        cooldownMinutes: {type: integer, minimum: 0, enum: [0]}
        ack: {$ref: '#/components/schemas/CommandAck'}
        evaluation: {type: object, additionalProperties: true, description: ACK 后的效果评价；无数值型湿度基线时 status=INCONCLUSIVE}
    CommandAck:
      type: object
      required: [status]
      properties:
        commandId: {type: string}
        status: {type: string, enum: [SUCCEEDED, PARTIAL, FAILED, TIMEOUT]}
        actualWaterLitre: {type: number, minimum: 0}
        receivedAt: {type: string, format: date-time}
    DeviceControlRequest:
      type: object
      required: [targetStatus, idempotencyKey]
      properties:
        targetStatus: {type: string, enum: [ONLINE, OFFLINE]}
        idempotencyKey: {type: string, minLength: 1, maxLength: 200}
    DeviceControlResponse:
      type: object
      required: [commandId, deviceId, targetStatus, commandStatus, status, device]
      properties:
        commandId: {type: string}
        deviceId: {type: string}
        targetStatus: {type: string, enum: [ONLINE, OFFLINE]}
        commandStatus: {type: string, enum: [PENDING, SUCCEEDED, FAILED, TIMEOUT]}
        status: {type: string, enum: [ONLINE, OFFLINE]}
        device: {type: object, additionalProperties: true}
    FarmMember:
      type: object
      required: [userId, username, displayName, role, roleLabel, farmIds, plotIds, status]
      properties:
        userId: {type: string}
        username: {type: string}
        displayName: {type: string}
        role: {type: string, enum: [FARMER, FARM_ADMIN]}
        roleLabel: {type: string}
        farmIds: {type: array, items: {type: string}}
        plotIds: {type: array, items: {type: string}}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    AssignWorkOrderRequest:
      type: object
      required: [assigneeId]
      properties:
        assigneeId: {type: string, description: 当前农场中拥有工单地块权限的活跃 FARMER 用户 ID}
        note: {type: string, description: 分配说明}
        dueAt: {type: string, format: date-time, description: 可选；重新处置逾期任务时设置晚于当前时间的新处理时限}
    EvidenceRequestCreate:
      type: object
      required: [reason]
      properties:
        farmId: {type: string}
        plotId: {type: string}
        title: {type: string}
        reason: {type: string, minLength: 1, description: 为什么需要补充现场证据}
        evidenceType: {type: string, enum: [FIELD_INSPECTION, RETEST, DEVICE_CHECK], default: FIELD_INSPECTION}
        actionType: {type: string, default: INSPECTION}
        priority: {type: string, enum: [HIGH, MEDIUM, LOW], default: MEDIUM}
    InspectionCreateRequest:
      type: object
      required: [farmId, plotId, observedAt]
      properties:
        farmId: {type: string, description: 当前正式农场 ID；后端会与地块所属农场复核}
        plotId: {type: string}
        workOrderId: {type: string, description: 可选；关联后自动写入工单 evidenceRefs 与审计历史}
        diagnosisId: {type: string, description: 可选；必须与地块一致}
        cropBatchId: {type: string, description: 可选；必须与地块一致}
        observedAt: {type: string, format: date-time}
        soilSurface: {type: string, example: DRY}
        cropCondition: {type: string, example: LEAF_SLIGHT_WILT}
        deviceStatus: {type: string, example: NORMAL}
        evidenceType: {type: string, enum: [FIELD_INSPECTION, RETEST, DEVICE_CHECK], default: FIELD_INSPECTION, description: RETEST 类型必须同时提供 portableSoilMoisture；普通巡田没有便携仪读数时只能形成现场观察证据}
        portableSoilMoisture: {type: number, minimum: 0, maximum: 100, nullable: true}
        notes: {type: string, description: 现场可复核说明}
    InspectionRecord:
      allOf:
        - {$ref: '#/components/schemas/InspectionCreateRequest'}
        - type: object
          required: [inspectionId, operatorId, operatorName, operatorRole, createdAt, updatedAt, provenance, sourceType, quality]
          properties:
            inspectionId: {type: string}
            operatorId: {type: string}
            operatorName: {type: string}
            operatorRole: {type: string, enum: [FARMER, FARM_ADMIN]}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
            revision: {type: integer, minimum: 1}
            evidenceSummary: {type: string}
            evidenceStatus: {type: string, enum: [OBSERVATION_ONLY, ACTIVE, CLEAR, UNAVAILABLE, RESOLVED, SUPERSEDED], description: 当前人工证据与遥测比对状态；历史冲突只标记状态，不删除原始记录}
            portableComparison:
              type: object
              nullable: true
              properties:
                telemetryValue: {type: number}
                portableValue: {type: number}
                deviation: {type: number, minimum: 0}
                status: {type: string, enum: [ACTIVE, CLEAR]}
                evaluatedAt: {type: string, format: date-time}
            resolvedByInspectionId: {type: string, nullable: true}
            resolvedAt: {type: string, format: date-time, nullable: true}
            supersededByInspectionId: {type: string, nullable: true}
            supersededAt: {type: string, format: date-time, nullable: true}
            provenance: {type: string, enum: [USER_PROVIDED]}
            sourceType: {type: string, enum: [HUMAN_OBSERVATION]}
            photos:
              type: array
              items:
                type: object
                properties:
                  photoId: {type: string}
                  fileName: {type: string}
                  contentType: {type: string}
                  sizeBytes: {type: integer}
                  provenance: {type: string, enum: [USER_PROVIDED]}
                  sourceType: {type: string, enum: [HUMAN_OBSERVATION]}
            quality: {type: object, properties: {status: {type: string, enum: [GOOD, INCOMPLETE]}, completeness: {type: number, minimum: 0, maximum: 1}}}
