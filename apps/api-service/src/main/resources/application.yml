server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: agriloop-api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: standalone
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:agriloop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:8}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

agriloop:
  mode: ${APP_MODE:standalone}
  ai-mode: ${AI_MODE:rules-only}
  llm-base-url: ${LLM_BASE_URL:http://127.0.0.1:8000/v1}
  llm-model: ${LLM_MODEL:Qwen3.8-27B}
  llm-api-key: ${LLM_API_KEY:}
  llm-timeout-ms: ${LLM_TIMEOUT_MS:60000}
  llm-max-tokens: ${LLM_MAX_TOKENS:512}
  llm-enable-thinking: ${LLM_ENABLE_THINKING:false}
  llm-preserve-thinking: ${LLM_PRESERVE_THINKING:false}
  llm-reasoning-effort: ${LLM_REASONING_EFFORT:low}
  llm-history-messages: ${LLM_HISTORY_MESSAGES:8}
  command-mode: ${COMMAND_MODE:virtual}
  forecast-mode: ${FORECAST_MODE:deterministic}
  learning-mode: ${LEARNING_MODE:case-only}
  value-mode: ${VALUE_MODE:simulation}
  jwt-secret: ${JWT_SECRET:change-me-in-production-change-me-in-production}
  jwt-ttl-minutes: ${JWT_TTL_MINUTES:720}
  mqtt-url: ${MQTT_URL:tcp://localhost:1883}
  mqtt-client-id: ${MQTT_CLIENT_ID:agriloop-api}
  mqtt-username: ${MQTT_USERNAME:}
  mqtt-password: ${MQTT_PASSWORD:}
  telemetry-stream: ${TELEMETRY_STREAM:agri.telemetry}
  device-timeout-seconds: ${DEVICE_TIMEOUT_SECONDS:90}
  seed-data: ${SEED_DATA:true}
  sse-heartbeat-seconds: ${SSE_HEARTBEAT_SECONDS:15}
  max-irrigation-seconds: ${MAX_IRRIGATION_SECONDS:900}
  daily-water-limit-litres: ${DAILY_WATER_LIMIT_LITRES:5000}
  crop-pack-path: ${CROP_PACK_PATH:classpath:/crop-packs}
  simulator-control-enabled: ${SIMULATOR_CONTROL_ENABLED:true}
  supervisor-config: ${SUPERVISOR_CONFIG:/srv/agriloop/supervisor.conf}
  simulator-program: ${SIMULATOR_PROGRAM:agriloop-simulator}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    # Standalone demos often run without Redis; do not mark the whole app DOWN.
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

logging:
  level:
    com.agriloop: INFO

---
spring:
  config:
    activate:
      on-profile: standalone

# Redis/MQTT are optional in standalone mode.  The API must remain discoverable
# as UP so the Web UI can use the explicit in-memory degradation path.
management:
  health:
    redis:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: simulation
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/agri}
    username: ${DATABASE_USER:agri}
    password: ${DATABASE_PASSWORD:agri}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

agriloop:
  mode: simulation

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:agriloop_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true

agriloop:
  mode: standalone
  seed-data: true
