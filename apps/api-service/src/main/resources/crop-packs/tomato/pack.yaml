cropCode: tomato
version: 1.1.0
schemaVersion: '1.0'
icon: 🍅
status: ACTIVE
identity: {name: 番茄, variety: demonstration, region: 重庆, environment: greenhouse}
ruleVersion: rule-1.0.0
knowledgeVersion: kb-1.1.0
stages:
  - code: seedling
    sequence: 1
    label: 苗期
    target:
      soilMoistureLow: 30
      soilMoistureHigh: 50
      airTemperatureLow: 18
      airTemperatureHigh: 28
      airHumidityLow: 60
      airHumidityHigh: 80
      lightLow: 15000
      lightHigh: 30000
      co2Low: 400
      co2High: 800
      phLow: 5.8
      phHigh: 6.8
      waterLevelLow: 30
      waterLevelHigh: 95
    riskFocus: [WATER_DEFICIT, COLD_STRESS]
    taskTemplates:
      - {actionType: INSPECTION, intervalDays: 2, priority: MEDIUM}
    knowledgeRef: knowledge/seedling.md
  - code: vegetative
    sequence: 2
    label: 营养生长期
    target:
      soilMoistureLow: 25
      soilMoistureHigh: 45
      airTemperatureLow: 18
      airTemperatureHigh: 30
      airHumidityLow: 55
      airHumidityHigh: 80
      lightLow: 20000
      lightHigh: 40000
      co2Low: 500
      co2High: 900
      phLow: 5.8
      phHigh: 6.8
      waterLevelLow: 30
      waterLevelHigh: 95
    riskFocus: [WATER_DEFICIT, HEAT_STRESS]
    taskTemplates:
      - {actionType: IRRIGATION_CHECK, intervalDays: 1, priority: HIGH}
    knowledgeRef: knowledge/vegetative.md
  - code: flowering
    sequence: 3
    label: 开花坐果期
    target:
      soilMoistureLow: 23
      soilMoistureHigh: 43
      airTemperatureLow: 18
      airTemperatureHigh: 32
      airHumidityLow: 50
      airHumidityHigh: 75
      lightLow: 25000
      lightHigh: 45000
      co2Low: 600
      co2High: 1000
      phLow: 5.8
      phHigh: 6.5
      waterLevelLow: 30
      waterLevelHigh: 95
    riskFocus: [WATER_DEFICIT, HEAT_STRESS]
    taskTemplates:
      - {actionType: INSPECTION, intervalDays: 2, priority: MEDIUM}
    knowledgeRef: knowledge/flowering.md
  - code: fruiting
    sequence: 4
    label: 果实成熟期
    target:
      soilMoistureLow: 20
      soilMoistureHigh: 40
      airTemperatureLow: 18
      airTemperatureHigh: 32
      airHumidityLow: 50
      airHumidityHigh: 75
      lightLow: 25000
      lightHigh: 50000
      co2Low: 600
      co2High: 1000
      phLow: 5.8
      phHigh: 6.5
      waterLevelLow: 30
      waterLevelHigh: 95
    riskFocus: [WATER_DEFICIT, HEAT_STRESS]
    taskTemplates:
      - {actionType: IRRIGATION_CHECK, intervalDays: 1, priority: HIGH}
    knowledgeRef: knowledge/fruiting.md
metrics:
  - {code: SOIL_MOISTURE, label: 土壤湿度, unit: '%', availability: SUPPORTED, range: {min: 0, max: 100}}
  - {code: AIR_TEMPERATURE, label: 空气温度, unit: '°C', availability: SUPPORTED, range: {min: -40, max: 80}}
  - {code: AIR_HUMIDITY, label: 空气湿度, unit: '%RH', availability: SUPPORTED, range: {min: 0, max: 100}}
  - {code: LIGHT, label: 光照强度, unit: lux, availability: SIMULATION_ONLY, range: {min: 0, max: 100000}}
  - {code: CO2, label: CO2, unit: ppm, availability: SIMULATION_ONLY, range: {min: 0, max: 10000}}
  - {code: PH, label: 土壤酸碱度, unit: pH, availability: SIMULATION_ONLY, range: {min: 0, max: 14}}
  - {code: WATER_LEVEL, label: 水箱水位, unit: '%', availability: SUPPORTED, range: {min: 0, max: 100}}
  - {code: NITROGEN, label: 速效氮, unit: 'mg/kg', availability: SIMULATION_ONLY, range: {min: 0, max: 300}}
  - {code: PHOSPHORUS, label: 速效磷, unit: 'mg/kg', availability: SIMULATION_ONLY, range: {min: 0, max: 200}}
  - {code: POTASSIUM, label: 速效钾, unit: 'mg/kg', availability: SIMULATION_ONLY, range: {min: 0, max: 400}}
rules:
  - {code: WATER_DEFICIT, metric: SOIL_MOISTURE, operator: LT, durationMinutes: 5, hysteresis: 2, cooldownMinutes: 0, alertCooldownMinutes: 120, emergencyThreshold: 10, automaticWateringThreshold: 10}
  - {code: HEAT_STRESS, metric: AIR_TEMPERATURE, operator: GT, durationMinutes: 10, hysteresis: 1, cooldownMinutes: 60}
  - {code: COLD_STRESS, metric: AIR_TEMPERATURE, operator: LT, durationMinutes: 10, hysteresis: 1, cooldownMinutes: 60}
healthProfile:
  algorithm: crop-stage-health-v1
  metricWeight: 0.68
  deviceWeight: 0.14
  riskWeight: 0.18
  metricWeights:
    SOIL_MOISTURE: 0.30
    AIR_TEMPERATURE: 0.20
    AIR_HUMIDITY: 0.16
    LIGHT: 0.12
    WATER_LEVEL: 0.12
    CO2: 0.10
prescriptionConstraints: {maxDurationSeconds: 900, cooldownMinutes: 0, automaticWateringThreshold: 10, maxDailyWaterLitres: 5000}
forecastProfile: {algorithm: robust-trend-v1, horizonsMinutes: [60, 120, 240], minValidSamples: 6, maxStalenessSeconds: 120}
coordinationProfile: {stageSensitivity: 0.9, starvationGuardMinutes: 120}
knowledge:
  documents: [knowledge/seedling.md, knowledge/vegetative.md, knowledge/flowering.md, knowledge/fruiting.md, knowledge/irrigation.md]
  fallback: [plot, region, stage, crop, general]
scenarios:
  normal: {quality: GOOD, expected: stable}
  drought: {quality: GOOD, expected: soil_moisture_decline}
  heavy-rain: {quality: GOOD, expected: soil_moisture_rise}
  sensor-drift: {quality: DEGRADED, expected: quality_gate}
  device-offline: {quality: BAD, expected: device_gate}
testCases: [normal, drought, heavy-rain, sensor-drift, device-offline]
