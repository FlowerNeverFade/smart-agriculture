<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriLoop · 登录</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="login-page">
    <form class="login-card" id="loginForm" novalidate>
      <div class="login-brand" id="brand"></div>
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" value="admin" />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="演示环境：admin123" />
      </div>
      <div class="login-actions">
        <button class="btn btn-filled" type="submit" id="submitBtn" style="height:46px">登录</button>
        <button class="btn btn-outline" type="button" id="demoBtn" style="height:46px">后端离线？进入离线演示</button>
      </div>
      <div class="login-note" id="loginNote">登录将请求后端 /api/v1/auth/login 并保存 JWT；离线演示模式仅在本地保存虚拟身份。</div>
    </form>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
