<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f3f7ef">
  <title>农智闭环 · 智慧农业登录</title>
  <link rel="stylesheet" href="css/login-motion.css?v=background-modes-1">
</head>
<body>
  <main class="experience" aria-labelledby="pageTitle">
    <div class="environment" aria-hidden="true">
      <div class="environment__fallback" id="liquidFieldFallback">
        <div class="environment__field environment__field--cursor"></div>
        <div class="environment__field environment__field--ambient"></div>
      </div>
      <canvas class="environment__canvas" id="ambientLiquidCanvas"></canvas>
    </div>

    <header class="topbar">
      <img class="brand-logo" src="assets/brand/agriloop-logo.png" width="1366" height="398" alt="AgriLoop">
      <div class="topbar__right">
        <span class="topbar__meta">智慧农业 · 二〇二六</span>
        <div class="mode-switch" role="group" aria-label="背景交互方式">
          <button type="button" data-background-mode="ink" aria-pressed="false">水墨背景</button>
          <button type="button" data-background-mode="wake" aria-pressed="true">折射尾迹</button>
        </div>
      </div>
    </header>

    <div class="login-layout">
      <section class="intro" aria-labelledby="pageTitle">
        <p class="intro__eyebrow">农智闭环 · 智慧农业</p>
        <h1 id="pageTitle">让每一块土地，<br>都拥有持续生长的智慧。</h1>
        <p class="intro__support">汇聚环境、作物与农事信息，<br>让每一次判断有据，让每一步行动从容。</p>
        <p class="intro__capabilities">感知环境&nbsp;&nbsp;·&nbsp;&nbsp;洞察作物&nbsp;&nbsp;·&nbsp;&nbsp;辅助决策</p>
        <p class="intro__status"><span aria-hidden="true"></span>系统运行正常</p>
      </section>

      <section class="auth" aria-labelledby="loginTitle" aria-live="polite">
        <h2 id="loginTitle">欢迎回来</h2>
        <p class="auth__summary">登录智慧农业工作台</p>
      <form id="loginForm" novalidate>
        <label class="field">
          <span>账号</span>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" required>
        </label>

        <label class="field field--password">
          <span>密码</span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
          <button class="field__reveal" id="revealPassword" type="button" aria-label="显示密码">显示</button>
        </label>

        <p class="form-error" id="formError" role="alert"></p>

        <button class="submit" id="submitButton" type="submit">
          <span class="submit__label">进入工作台</span>
          <svg class="submit__arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h13M13 6l6 6-6 6"></path>
          </svg>
          <span class="submit__loading" aria-hidden="true">正在验证</span>
        </button>

        <div class="auth__actions">
          <button class="text-action" id="demoToggle" type="button" aria-expanded="false" aria-controls="demoPanel">演示身份</button>
          <button class="text-action" id="forgotPassword" type="button">忘记密码</button>
        </div>
      </form>

        <div class="demo-panel" id="demoPanel" hidden>
          <p>选择体验身份</p>
          <div class="demo-panel__roles">
            <button type="button" data-user="admin">农场管理员</button>
            <button type="button" data-user="farmer">种植农户</button>
            <button type="button" data-user="operator">田间操作员</button>
            <button type="button" data-user="sysadmin">系统管理员</button>
          </div>
        </div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="js/login.js?v=background-modes-1"></script>
</body>
</html>
