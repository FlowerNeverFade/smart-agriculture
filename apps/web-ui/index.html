<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>AgriLoop · Google Style WebUI</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="css/style.css">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
  
  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/echarts.min.js"></script>
  
  <style>
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .metric-box { padding: 12px; background: var(--g-bg-base); border-radius: var(--g-radius); border: 1px solid var(--g-border-subtle); }
    .metric-label { font-size: 12px; color: var(--g-text-secondary); margin-bottom: 4px; display:flex; justify-content:space-between; }
    .metric-val { font-size: 18px; font-weight: 500; }
    .feed-actions { display: flex; gap: 8px; margin-top: 12px; }
    .chat-msg { margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height:1.5; }
    .chat-msg.user { background: var(--g-primary-bg); color: var(--g-primary-hover); margin-left: auto; border-bottom-right-radius: 4px; }
    .chat-msg.agent { background: var(--g-bg-base); color: var(--g-text-primary); margin-right: auto; border-bottom-left-radius: 4px; border: 1px solid var(--g-border-subtle); }
    .scenario-btn { text-align: left; padding: 16px; border: 1px solid var(--g-border); border-radius: var(--g-radius); cursor: pointer; transition: all 0.2s; background: var(--g-bg-surface); }
    .scenario-btn:hover { border-color: var(--g-primary); background: var(--g-primary-bg); }
    .scenario-btn.active { border-color: var(--g-primary); background: var(--g-primary-bg); box-shadow: 0 0 0 1px var(--g-primary); }
    .gates-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--g-border-subtle); }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <header class="g-header">
      <div class="g-header-left">
        <button class="g-btn icon-only" @click="toggleSidebar"><span class="material-symbols-outlined">menu</span></button>
        <img src="assets/brand/logo.png" height="32" alt="AgriLoop" style="border-radius:4px">
        <span class="g-header-title">AgriLoop Console</span>
      </div>
      <div class="g-header-right">
        <button class="g-btn icon-only" @click="toggleTheme" title="切换主题"><span class="material-symbols-outlined">{{ isDark ? 'light_mode' : 'dark_mode' }}</span></button>
        <button class="g-btn icon-only" @click="logout" title="退出登录"><span class="material-symbols-outlined">logout</span></button>
        <span class="g-badge" :class="isLive ? 'success' : 'warning'">
          {{ isLive ? '系统在线 (UP)' : '仿真态 (MOCK)' }}
        </span>
        <div class="flex items-center gap-2 ml-2">
          <img :src="state.currentUser.avatar" style="width:32px; height:32px; border-radius:50%; background:var(--g-bg-subtle)">
          <span style="font-weight:500">{{ state.currentUser.username }}</span>
        </div>
      </div>
    </header>

    <div class="g-body">
      <nav class="g-sidebar" :class="{collapsed: !isSidebarOpen}">
        <div v-for="nav in navItems" :key="nav.id" 
             class="g-nav-item" :class="{active: currentView === nav.id}"
             @click="currentView = nav.id">
          <span class="material-symbols-outlined">{{ nav.icon }}</span>
          {{ nav.label }}
        </div>
      </nav>

      <main class="g-main">
        <transition name="fade" mode="out-in">
          <component :is="currentViewComponent" :state="state" :route-params="routeParams" @navigate="navigate"></component>
        </transition>
        
        <div class="g-toast-container">
          <transition-group name="toast">
            <div v-for="toast in toasts" :key="toast.id" class="g-toast">
              <span class="material-symbols-outlined" :style="{color: toast.type === 'error' ? 'var(--g-danger)' : 'var(--g-success)'}">{{ toast.type === 'error' ? 'error' : 'check_circle' }}</span>
              {{ toast.message }}
            </div>
          </transition-group>
        </div>
      </main>
    </div>
  </div>

  <!-- Dashboard Template -->
  <template id="tmpl-dashboard">
    <div>
      <div class="flex justify-between items-center mb-4">
        <h2>农智总览 Dashboard</h2>
        <span class="g-badge primary">{{ state.farms[0].name }} · {{ state.farms[0].region }}</span>
      </div>
      
      <div class="g-grid g-grid-2 mb-4">
        <div class="g-card" v-for="plot in state.plots" :key="plot.plotId">
          <div class="flex justify-between items-center mb-4">
            <div>
              <h3 style="display:inline-block; margin-right:8px">{{ plot.name }}</h3>
              <span class="g-badge" :class="plot.deviceStatus==='ONLINE'?'success':'danger'">{{ plot.deviceId }} ({{ plot.lastSeen }})</span>
            </div>
            <span class="g-badge" :class="plot.riskLevel === 'LOW' ? 'success' : (plot.riskLevel === 'WARN' ? 'warning' : 'danger')">
              综合健康 {{ (plot.healthScore * 100).toFixed(0) }}
            </span>
          </div>
          <p class="text-muted mb-4">品种：{{ plot.cropVariety }} | 面积：{{ plot.areaM2 }}㎡ | 阶段：{{ plot.stageLabel }}</p>
          
          <div class="metric-grid">
            <div class="metric-box" v-for="(metric, key) in plot.metrics" :key="key">
              <div class="metric-label">
                <span>{{ metric.label }}</span>
                <span class="material-symbols-outlined" style="font-size:14px; color:var(--g-success)" v-if="metric.status==='NORMAL'">check_circle</span>
                <span class="material-symbols-outlined" style="font-size:14px; color:var(--g-warning)" v-if="metric.status==='WARN'">warning</span>
              </div>
              <div class="metric-val" :style="{color: metric.status==='NORMAL'?'inherit':'var(--g-warning)'}">
                {{ metric.value }} <span style="font-size:12px; color:var(--g-text-secondary)">{{ metric.unit }}</span>
              </div>
              <div style="font-size:11px; color:var(--g-text-secondary); margin-top:4px">靶标: {{ metric.target }}</div>
            </div>
          </div>
        </div>
      </div>

      <h3 class="mt-4 mb-4">智能警报与信息流</h3>
      <div class="g-grid g-grid-2">
        <div class="g-card flex gap-4" v-for="feed in state.feedItems" :key="feed.id">
          <span class="material-symbols-outlined" :style="{color: feed.badge.color === 'amber' ? 'var(--g-warning)' : (feed.badge.color === 'green' ? 'var(--g-success)' : 'var(--g-primary)'), fontSize: '32px'}">
            {{ feed.type === 'DIAGNOSIS' ? 'warning' : (feed.type === 'PRESCRIPTION' ? 'water_drop' : 'info') }}
          </span>
          <div style="flex:1">
            <div class="flex justify-between items-center mb-2">
              <span class="g-badge" style="background:var(--g-bg-base); border:1px solid var(--g-border)">{{ feed.category }}</span>
              <span class="text-muted" style="font-size:12px">{{ feed.timestamp }}</span>
            </div>
            <h4>{{ feed.title }}</h4>
            <p class="text-muted mt-2" style="font-size:13px">{{ feed.summary }}</p>
            
            <div class="feed-actions">
              <button v-for="(act, idx) in feed.actions" :key="idx" 
                      class="g-btn" :class="act.type === 'primary' ? 'primary' : 'secondary'"
                      @click="handleAction(act)">
                {{ act.label }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Decision Console Template -->
  <template id="tmpl-decision-console">
    <div>
      <h2 class="mb-4">智能诊断与处方中枢 (Decision Console)</h2>
      <div class="g-grid g-grid-2">
        
        <!-- Root Cause & Prescription -->
        <div>
          <div class="g-card mb-4" v-if="diagnosis" :class="{'highlight-pulse': highlightDiagnosis}">
            <div class="flex justify-between items-center mb-4">
              <h3 class="flex items-center gap-2">
                <span class="material-symbols-outlined" style="color:var(--g-warning)">psychology</span>
                根因诊断 (Root Cause)
              </h3>
              <span class="g-badge success">置信度 {{ (diagnosis.details.confidence * 100).toFixed(0) }}%</span>
            </div>
            <div class="metric-box mb-4" style="background: var(--g-warning-bg); border-color: var(--g-warning)">
              <h4 style="color: var(--g-warning)">主因：{{ diagnosis.details.primaryCause }}</h4>
              <p class="mt-2" style="font-size:13px">{{ diagnosis.summary }}</p>
            </div>
            
            <div class="g-grid g-grid-2 gap-4">
              <div>
                <div style="font-weight:500; color:var(--g-success); margin-bottom:8px">支持证据 (Supported)</div>
                <ul style="padding-left:16px; font-size:13px; color:var(--g-text-secondary)">
                  <li v-for="(ev, i) in diagnosis.details.supportingEvidence" :key="i" class="mb-2">{{ ev }}</li>
                </ul>
              </div>
              <div>
                <div style="font-weight:500; color:var(--g-text-primary); margin-bottom:8px">反对/排他证据 (Opposing)</div>
                <ul style="padding-left:16px; font-size:13px; color:var(--g-text-secondary)">
                  <li v-for="(ev, i) in diagnosis.details.opposingEvidence" :key="i" class="mb-2">{{ ev }}</li>
                </ul>
              </div>
            </div>
          </div>

          <div class="g-card" v-if="prescription">
            <div class="flex justify-between items-center mb-4">
              <h3 class="flex items-center gap-2">
                <span class="material-symbols-outlined" style="color:var(--g-primary)">receipt_long</span>
                农业处方 (Prescription)
              </h3>
              <span class="g-badge success">READY · 就绪</span>
            </div>
            
            <div class="g-grid g-grid-3 mb-4">
              <div class="metric-box">
                <div class="text-muted" style="font-size:12px">建议补水量</div>
                <div style="font-size:24px; color:var(--g-primary)">{{ prescription.details.waterLitre }}<span style="font-size:14px"> L</span></div>
              </div>
              <div class="metric-box">
                <div class="text-muted" style="font-size:12px">执行时长</div>
                <div style="font-size:24px">{{ prescription.details.durationFormatted }}</div>
              </div>
              <div class="metric-box">
                <div class="text-muted" style="font-size:12px">预估成本</div>
                <div style="font-size:24px">{{ prescription.details.costEstimate.split(' ')[1] }}<span style="font-size:14px"> 元</span></div>
              </div>
            </div>

            <h4 class="mb-2">执行安全门控 (Readiness Gates)</h4>
            <ul class="gates-list mb-4 text-muted" style="font-size:13px">
              <li v-for="(val, key) in prescription.details.hardGates" :key="key">
                <span>{{ key }}</span>
                <span style="color:var(--g-success); font-weight:500">{{ val }}</span>
              </li>
            </ul>

            <div class="flex gap-2">
              <button class="g-btn primary" style="flex:1" @click="showDualTrackModal = true">
                <span class="material-symbols-outlined">bolt</span> 虚拟执行 (What-if)
              </button>
              <button class="g-btn secondary" @click="showPassportModal = true">
                <span class="material-symbols-outlined">policy</span> 决策护照
              </button>
            </div>
          </div>
        </div>

        <!-- Copilot Chat -->
        <div class="g-card flex" style="flex-direction:column; height: calc(100vh - 140px)">
          <div class="flex items-center gap-2 mb-4">
            <span class="material-symbols-outlined" style="color:var(--g-purple)">smart_toy</span>
            <h3>Agent Copilot 沙盘咨询</h3>
          </div>
          
          <div class="metric-box" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:16px" ref="chatBox">
            <div class="text-center text-muted mb-4" style="font-size:12px">AgriLoop 诊断内核已连接 · 模型推理就绪</div>
            <div v-for="(msg, i) in chatHistory" :key="i" class="chat-msg" :class="msg.role">
              <div style="font-size:12px; opacity:0.7; margin-bottom:4px" v-if="msg.role==='agent'">
                <span class="material-symbols-outlined" style="font-size:12px; vertical-align:middle">auto_awesome</span> AgriLoop AI
              </div>
              <div v-html="msg.content"></div>
            </div>
            <div v-if="isTyping" class="chat-msg agent">
               <span class="material-symbols-outlined" style="animation: spin 2s linear infinite;">hourglass_empty</span> 推理中...
            </div>
          </div>
          
          <div class="flex gap-2 mt-4">
            <input type="text" class="g-card" style="flex:1; padding:12px; border-radius:var(--g-radius-pill)" 
                   v-model="chatInput" @keyup.enter="sendMessage"
                   placeholder="询问当前地块的诊断细节或处方计算原理...">
            <button class="g-btn primary icon-only" style="width:48px; height:48px" @click="sendMessage">
              <span class="material-symbols-outlined">send</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Dual Track Modal -->
      <transition name="fade">
        <div class="g-modal-overlay" v-if="showDualTrackModal" @click.self="showDualTrackModal = false">
          <div class="g-modal" style="max-width: 800px;">
            <div class="g-modal-header">
              <h3>双轨推演模拟 (Dual-Track What-if)</h3>
              <button class="g-btn icon-only" @click="showDualTrackModal = false"><span class="material-symbols-outlined">close</span></button>
            </div>
            <div class="g-modal-body">
              <p class="text-muted mb-4">基于当前环境快照和随机种子，平行对比“下发处方 (执行)”与“不下发处方 (不执行)”的演化结果。</p>
              <div id="dualTrackChart" style="width: 100%; height: 350px;"></div>
            </div>
            <div class="g-modal-footer">
              <button class="g-btn secondary" @click="showDualTrackModal = false">取消</button>
              <button class="g-btn primary" @click="confirmExecution">正式下发指令</button>
            </div>
          </div>
        </div>
      </transition>

      <!-- Decision Passport Modal -->
      <transition name="fade">
        <div class="g-modal-overlay" v-if="showPassportModal" @click.self="showPassportModal = false">
          <div class="g-modal">
            <div class="g-modal-header">
              <h3 class="flex items-center gap-2"><span class="material-symbols-outlined" style="color:var(--g-primary)">policy</span> 决策护照 (Passport)</h3>
              <button class="g-btn icon-only" @click="showPassportModal = false"><span class="material-symbols-outlined">close</span></button>
            </div>
            <div class="g-modal-body">
              <ul class="gates-list">
                <li style="flex-direction:column; align-items:flex-start">
                  <div class="flex justify-between" style="width:100%"><span style="font-weight:500">Trace ID</span><span>run-20260822-001</span></div>
                </li>
                <li style="flex-direction:column; align-items:flex-start">
                  <div class="flex justify-between" style="width:100%"><span style="font-weight:500">来源输入 (Observation)</span><span class="g-badge primary">SOIL_MOISTURE=16.8%</span></div>
                  <div class="text-muted mt-1" style="font-size:12px">源自 mock-plot-a01，新鲜度 200ms</div>
                </li>
                <li style="flex-direction:column; align-items:flex-start">
                  <div class="flex justify-between" style="width:100%"><span style="font-weight:500">推导诊断 (Derived)</span><span class="g-badge warning">WATER_DEFICIT</span></div>
                  <div class="text-muted mt-1" style="font-size:12px">置信度 92%，排查了传感器漂移可能</div>
                </li>
                <li style="flex-direction:column; align-items:flex-start">
                  <div class="flex justify-between" style="width:100%"><span style="font-weight:500">参考知识 (Knowledge)</span><span class="g-badge purple">kb-1.0.0</span></div>
                  <div class="text-muted mt-1" style="font-size:12px">匹配番茄结果期，安全上限 900s</div>
                </li>
                <li style="flex-direction:column; align-items:flex-start">
                  <div class="flex justify-between" style="width:100%"><span style="font-weight:500">输出处方 (Action)</span><span class="g-badge success">8m30s / 153L</span></div>
                  <div class="text-muted mt-1" style="font-size:12px">待系统管理员下发指令</div>
                </li>
              </ul>
            </div>
            <div class="g-modal-footer">
              <button class="g-btn primary" @click="showPassportModal = false">关闭</button>
            </div>
          </div>
        </div>
      </transition>
    </div>
  </template>

  <!-- Risk Forecast Template -->
  <template id="tmpl-risk-forecast">
    <div>
      <h2 class="mb-4">未来风险确定性推演 (Time-to-Risk)</h2>
      
      <div class="g-grid" style="grid-template-columns: 3fr 1fr">
        <div class="g-card">
          <div class="flex justify-between items-center mb-4">
            <h3>综合地块含水率推演模型 (Robust Trend v1.2)</h3>
            <span class="g-badge primary">基线：{{ state.riskForecastConfig.baselineMoisture }}%</span>
          </div>
          <div id="riskChart" style="width: 100%; height: 450px;"></div>
        </div>
        
        <div>
          <h3 class="mb-4">情景假设 (What-if Scenarios)</h3>
          <div class="flex" style="flex-direction:column; gap:12px">
            <div class="scenario-btn" 
                 v-for="scenario in state.riskForecastConfig.scenarioCatalog" 
                 :key="scenario.code"
                 :class="{active: currentScenario === scenario.code}"
                 @click="changeScenario(scenario)">
              <div style="font-size:16px; font-weight:500; margin-bottom:4px">{{ scenario.emoji }} {{ scenario.label }}</div>
              <div class="text-muted" style="font-size:12px; margin-bottom:8px">{{ scenario.desc }}</div>
              <div class="flex justify-between items-center">
                <span class="g-badge" style="background:var(--g-bg-base); border:1px solid var(--g-border-subtle)">
                  衰减倍率: {{ scenario.decayFactor }}x
                </span>
                <span v-if="scenario.ttrMinutes" class="g-badge" :style="{backgroundColor: scenario.color, color:'#fff'}">
                  TTR: {{ scenario.ttrMinutes }}m
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Work Orders Template -->
  <template id="tmpl-work-orders">
    <div>
      <div class="flex justify-between items-center mb-4">
        <h2>工单流转与人机协同 (Work Orders & Inspections)</h2>
        <button class="g-btn primary" @click="showFormModal = true">+ 录入巡田记录</button>
      </div>
      
      <div class="g-grid g-grid-3 mb-4">
        <div class="g-card flex items-center gap-4">
          <span class="material-symbols-outlined" style="font-size:40px; color:var(--g-primary)">task</span>
          <div>
            <div class="text-muted">待办任务总数</div>
            <div style="font-size:28px; font-weight:500">{{ state.workOrders.length }}</div>
          </div>
        </div>
        <div class="g-card flex items-center gap-4">
          <span class="material-symbols-outlined" style="font-size:40px; color:var(--g-success)">water_drop</span>
          <div style="flex:1">
            <div class="flex justify-between text-muted mb-1">
              <span>{{ state.resourceProfile.resourceType }}</span>
              <span>{{ state.resourceProfile.remainingLitres }}L 余量</span>
            </div>
            <div style="width:100%; height:8px; background:var(--g-bg-subtle); border-radius:4px; overflow:hidden">
              <div style="height:100%; background:var(--g-success); width:75%"></div>
            </div>
          </div>
        </div>
        <div class="g-card flex items-center gap-4">
          <span class="material-symbols-outlined" style="font-size:40px; color:var(--g-warning)">record_voice_over</span>
          <div>
            <div class="text-muted">人工巡田报告</div>
            <div style="font-size:28px; font-weight:500">{{ state.inspections.length }}</div>
          </div>
        </div>
      </div>

      <div class="g-grid g-grid-2">
        <div class="g-card" :class="{'highlight-pulse': highlightNewOrder}">
          <h3 class="mb-4">系统调度工单</h3>
          <table class="g-table">
            <thead><tr><th>任务 (Task)</th><th>地块</th><th>状态</th><th>优先级</th></tr></thead>
            <tbody>
              <tr v-for="order in state.workOrders" :key="order.workOrderId">
                <td style="font-weight:500">
                  <div style="margin-bottom:4px">{{ order.title }}</div>
                  <div class="text-muted" style="font-size:12px">{{ order.reason }}</div>
                </td>
                <td>{{ order.plotId }}</td>
                <td><span class="g-badge" style="background:var(--g-bg-base); border:1px solid var(--g-border)">{{ order.status }}</span></td>
                <td>
                  <span class="g-badge" :class="order.priority === 'HIGH' ? 'danger' : (order.priority==='MEDIUM'?'warning':'primary')">
                    {{ order.priority }}
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="g-card">
          <h3 class="mb-4">人工核验记录 (Human Observations)</h3>
          <div class="metric-box mb-4" v-for="ins in state.inspections" :key="ins.inspectionId">
            <div class="flex justify-between mb-2">
              <span style="font-weight:500">{{ ins.plotId }} · 巡田反馈</span>
              <span class="text-muted" style="font-size:12px">{{ new Date(ins.observedAt).toLocaleTimeString() }}</span>
            </div>
            <div class="g-grid g-grid-3 gap-2 mb-2">
              <div><span class="text-muted" style="font-size:12px">表层状况：</span>{{ ins.soilSurface }}</div>
              <div><span class="text-muted" style="font-size:12px">植被：</span>{{ ins.cropCondition }}</div>
              <div><span class="text-muted" style="font-size:12px">实测含水：</span>{{ ins.portableSoilMoisture }}%</div>
            </div>
            <div class="text-muted" style="font-size:13px; background:var(--g-bg-hover); padding:8px; border-radius:4px">
              "{{ ins.notes }}"
            </div>
          </div>
        </div>
      </div>

      <!-- Add Inspection Modal -->
      <transition name="fade">
        <div class="g-modal-overlay" v-if="showFormModal" @click.self="showFormModal = false">
          <div class="g-modal">
            <div class="g-modal-header">
              <h3>录入人工巡田数据</h3>
              <button class="g-btn icon-only" @click="showFormModal = false"><span class="material-symbols-outlined">close</span></button>
            </div>
            <div class="g-modal-body">
              <div class="g-form-group">
                <label class="g-form-label">地块选择</label>
                <select class="g-select" v-model="form.plotId">
                  <option value="plot-a01">plot-a01 温室 1 号棚</option>
                  <option value="plot-b01">plot-b01 温室 3 号棚</option>
                </select>
              </div>
              <div class="g-form-group">
                <label class="g-form-label">表层状况 (Soil Surface)</label>
                <input type="text" class="g-input" v-model="form.soilSurface" placeholder="例：DRY, MOIST">
              </div>
              <div class="g-form-group">
                <label class="g-form-label">植被情况 (Crop Condition)</label>
                <input type="text" class="g-input" v-model="form.cropCondition" placeholder="例：NORMAL, LEAF_SLIGHT_WILT">
              </div>
              <div class="g-form-group">
                <label class="g-form-label">手持仪实测含水率 (%)</label>
                <input type="number" class="g-input" v-model="form.portableSoilMoisture">
              </div>
              <div class="g-form-group">
                <label class="g-form-label">备注说明</label>
                <input type="text" class="g-input" v-model="form.notes">
              </div>
            </div>
            <div class="g-modal-footer">
              <button class="g-btn secondary" @click="showFormModal = false">取消</button>
              <button class="g-btn primary" @click="submitInspection">提交核验</button>
            </div>
          </div>
        </div>
      </transition>
    </div>
  </template>

  <!-- Crop Packs Template -->
  <template id="tmpl-crop-packs">
    <div>
      <h2 class="mb-4">作物标准化模型库 (Crop Packs V1.0)</h2>
      
      <div class="g-card mb-4" v-for="crop in state.cropPackDetails" :key="crop.cropCode">
        <div class="flex justify-between items-baseline mb-4">
          <h3 class="flex items-center gap-2">
            <span class="material-symbols-outlined" style="color:var(--g-primary)">psychiatry</span>
            {{ crop.identity.name }} ({{ crop.identity.variety }})
          </h3>
          <span class="text-muted">知识版本: {{ crop.knowledgeVersion }} | 规则版本: {{ crop.ruleVersion }}</span>
        </div>
        
        <div class="text-muted mb-4" style="background:var(--g-bg-base); padding:12px; border-radius:4px; font-size:13px">
          <div v-for="(p, i) in crop.knowledge.content" :key="i" style="margin-bottom:4px">{{ p }}</div>
        </div>

        <h4 class="mb-2">生育阶段包络 (Lifecycle Stages)</h4>
        <div style="overflow-x:auto" class="mb-4">
          <table class="g-table">
            <thead>
              <tr>
                <th>序号</th>
                <th>阶段 (Stage)</th>
                <th>土壤湿度靶标</th>
                <th>环境气温靶标</th>
                <th>重点防护风险</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="stage in crop.stages" :key="stage.code">
                <td>{{ stage.sequence }}</td>
                <td style="font-weight:500">{{ stage.label }} ({{ stage.code }})</td>
                <td>{{ stage.target.soilMoistureLow }}% ~ {{ stage.target.soilMoistureHigh }}%</td>
                <td>{{ stage.target.airTemperatureLow }}°C ~ {{ stage.target.airTemperatureHigh }}°C</td>
                <td>
                  <span class="g-badge mr-2" style="background:var(--g-danger-bg); color:var(--g-danger); margin-right:4px" v-for="r in stage.riskFocus" :key="r">{{ r }}</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <h4 class="mb-2">硬性规则与阈值 (Rules Engine)</h4>
        <div style="overflow-x:auto">
          <table class="g-table">
            <thead>
              <tr>
                <th>规则代码</th>
                <th>判定指标</th>
                <th>操作符</th>
                <th>触发阈值</th>
                <th>持续时间</th>
                <th>动作冷却</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="rule in crop.rules" :key="rule.code">
                <td style="font-weight:500; color:var(--g-primary)">{{ rule.code }}</td>
                <td>{{ rule.metric }}</td>
                <td>{{ rule.operator }}</td>
                <td>{{ rule.threshold }}</td>
                <td>{{ rule.durationMinutes }} min</td>
                <td>{{ rule.cooldownMinutes }} min</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <!-- Value Ledger Template -->
  <template id="tmpl-value-ledger">
    <div>
      <h2 class="mb-4">经营效益审计台账 (Value Ledger)</h2>
      
      <div class="g-grid g-grid-4 mb-4">
        <div class="g-card text-center">
          <div class="text-muted mb-2">规划用水 vs 实际用水</div>
          <div style="font-size:24px; font-weight:500">{{ state.valueLedger.summary.plannedWaterLitres }}L / {{ state.valueLedger.summary.actualWaterLitres }}L</div>
          <div class="g-badge success mt-2">节约 {{ state.valueLedger.summary.savedWaterLitres }}L</div>
        </div>
        <div class="g-card text-center">
          <div class="text-muted mb-2">节约电力折算</div>
          <div style="font-size:24px; font-weight:500; color:var(--g-primary)">{{ state.valueLedger.summary.savedElectricityKwh }} kWh</div>
          <div class="text-muted mt-2" style="font-size:12px">泵站耗能直降</div>
        </div>
        <div class="g-card text-center">
          <div class="text-muted mb-2">节省巡田工时</div>
          <div style="font-size:24px; font-weight:500; color:var(--g-purple)">{{ state.valueLedger.summary.labourSavedHours }} h</div>
          <div class="text-muted mt-2" style="font-size:12px">精准派单优势</div>
        </div>
        <div class="g-card text-center">
          <div class="text-muted mb-2">总经济效益 (人民币)</div>
          <div style="font-size:28px; font-weight:500; color:var(--g-success)">¥ {{ state.valueLedger.summary.totalSavedRmb }}</div>
          <div class="text-muted mt-2" style="font-size:12px">基于当前计价本推算</div>
        </div>
      </div>

      <div class="g-grid" style="grid-template-columns: 2fr 1fr">
        <div class="g-card">
          <h3 class="mb-4">每日偏差率跟踪矩阵</h3>
          <div id="ledgerChart" style="width: 100%; height: 320px;"></div>
        </div>

        <div class="g-card">
          <h3 class="mb-4">数据审计溯源 (Provenance)</h3>
          <ul class="gates-list">
            <li v-for="(prov, i) in state.valueLedger.provenance" :key="i" style="flex-direction:column; align-items:flex-start">
              <div class="flex justify-between" style="width:100%">
                <span style="font-weight:500">{{ prov.key }}</span>
                <span class="g-badge" :class="prov.value==='OBSERVED'?'primary':(prov.value==='DERIVED'?'purple':'warning')">{{ prov.value }}</span>
              </div>
              <div class="text-muted mt-2" style="font-size:12px">{{ prov.tag }}</div>
            </li>
          </ul>

          <h3 class="mt-4 mb-4">反事实推演对标</h3>
          <table class="g-table">
            <thead><tr><th>周期</th><th>传统估算</th><th>AgriLoop</th></tr></thead>
            <tbody>
              <tr v-for="item in state.valueLedger.counterfactual" :key="item.week">
                <td>{{ item.week }}</td>
                <td class="text-muted">¥{{ item.traditionalCostRmb }}</td>
                <td style="color:var(--g-success)">¥{{ item.agriLoopCostRmb }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
