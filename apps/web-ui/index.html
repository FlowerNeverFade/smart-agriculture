<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>AgriLoop · Google Style WebUI</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="css/style.css">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
  
  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/echarts.min.js"></script>
</head>
<body>
  <div id="app" v-cloak>
    <header class="g-header">
      <div class="g-header-left">
        <button class="g-btn icon-only"><span class="material-symbols-outlined">menu</span></button>
        <img src="assets/brand/logo.png" height="32" alt="AgriLoop" style="border-radius:4px">
        <span class="g-header-title">AgriLoop Console</span>
      </div>
      <div class="g-header-right">
        <button class="g-btn icon-only" @click="toggleTheme"><span class="material-symbols-outlined">{{ isDark ? 'light_mode' : 'dark_mode' }}</span></button>
        <span class="g-badge" :class="isLive ? 'success' : 'warning'">
          {{ isLive ? '系统在线 (UP)' : '仿真态 (MOCK)' }}
        </span>
        <button class="g-btn icon-only"><span class="material-symbols-outlined">account_circle</span></button>
      </div>
    </header>

    <div class="g-body">
      <nav class="g-sidebar">
        <div v-for="nav in navItems" :key="nav.id" 
             class="g-nav-item" :class="{active: currentView === nav.id}"
             @click="currentView = nav.id">
          <span class="material-symbols-outlined">{{ nav.icon }}</span>
          {{ nav.label }}
        </div>
      </nav>

      <main class="g-main">
        <component :is="currentViewComponent" :state="state" @navigate="navigate"></component>
      </main>
    </div>
  </div>

  <!-- Dashboard Template -->
  <template id="tmpl-dashboard">
    <div>
      <h2 class="mb-4">农智总览 Dashboard</h2>
      <div class="g-grid g-grid-3">
        <div class="g-card" v-for="plot in state.plots" :key="plot.plotId">
          <div class="flex justify-between items-center mb-4">
            <h3>{{ plot.name }}</h3>
            <span class="g-badge" :class="plot.riskLevel === 'LOW' ? 'success' : 'danger'">
              {{ plot.riskLevel === 'LOW' ? '状态良好' : '高风险' }}
            </span>
          </div>
          <p class="text-muted mb-4">{{ plot.cropName }} · {{ plot.stageLabel }}</p>
          <div class="g-grid g-grid-2 gap-2">
            <div class="g-card" style="padding:12px">
              <div class="text-muted">湿度</div>
              <div style="font-size:20px">{{ plot.metrics.SOIL_MOISTURE.value }}%</div>
            </div>
            <div class="g-card" style="padding:12px">
              <div class="text-muted">气温</div>
              <div style="font-size:20px">{{ plot.metrics.AIR_TEMPERATURE.value }}°C</div>
            </div>
          </div>
          <button class="g-btn secondary mt-4" style="width:100%" @click="$emit('navigate', 'decision-console')">
            进入智能决策
          </button>
        </div>
      </div>

      <h3 class="mt-4 mb-4">最近告警与通知</h3>
      <div class="g-grid">
        <div class="g-card flex items-center gap-4" v-for="feed in state.feedItems" :key="feed.id">
          <span class="material-symbols-outlined" :style="{color: feed.badge.color === 'amber' ? 'var(--g-warning)' : 'var(--g-primary)', fontSize: '32px'}">
            {{ feed.type === 'DIAGNOSIS' ? 'warning' : 'info' }}
          </span>
          <div style="flex:1">
            <h4>{{ feed.title }}</h4>
            <p class="text-muted">{{ feed.summary }}</p>
          </div>
          <div class="text-muted">{{ feed.timestamp }}</div>
        </div>
      </div>
    </div>
  </template>

  <!-- Decision Console Template -->
  <template id="tmpl-decision-console">
    <div>
      <h2 class="mb-4">智能诊断与决策中枢</h2>
      <div class="g-grid g-grid-2">
        <div class="g-card">
          <h3 class="mb-4">AI 根因诊断</h3>
          <div class="g-card mb-4" style="background:var(--g-bg-base)">
            <h4>WATER_DEFICIT (真实土壤缺水)</h4>
            <div class="flex items-center gap-2 mt-2">
              <span class="g-badge success">置信度 92%</span>
              <span class="g-badge primary">数据新鲜度 GOOD</span>
            </div>
            <ul class="mt-4 text-muted" style="padding-left:20px">
              <li>遥测指标连续 3 个采样周期低于基线</li>
              <li>当前蒸散速率加快</li>
            </ul>
          </div>
          <button class="g-btn primary">生成灌溉处方</button>
        </div>
        
        <div class="g-card">
          <h3 class="mb-4">Agent Copilot</h3>
          <div class="g-card mb-4" style="height:300px; overflow-y:auto; background:var(--g-bg-base)">
            <p class="text-muted text-center" style="margin-top:40%">请在下方输入您的农务问题...</p>
          </div>
          <div class="flex gap-2">
            <input type="text" class="g-card" style="flex:1; padding:8px 12px" placeholder="例如：番茄当前阶段的适宜湿度是多少？">
            <button class="g-btn primary icon-only"><span class="material-symbols-outlined">send</span></button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Risk Forecast Template -->
  <template id="tmpl-risk-forecast">
    <div>
      <div class="flex justify-between items-center mb-4">
        <h2>未来风险预测推演</h2>
        <button class="g-btn primary">运行 What-If 模拟</button>
      </div>
      <div class="g-card mb-4">
        <h3 class="mb-4">全场地块综合推演 (Time-to-Risk)</h3>
        <div id="riskChart" style="width: 100%; height: 400px;"></div>
      </div>
      <div class="g-grid g-grid-3">
        <div class="g-card" v-for="scenario in state.riskForecastConfig.scenarioCatalog" :key="scenario.code">
          <h3>{{ scenario.emoji }} {{ scenario.label }}</h3>
          <p class="text-muted mt-2">{{ scenario.desc }}</p>
          <div class="mt-4">
            <span class="g-badge" :class="scenario.enabled ? 'primary' : ''">衰减系数 {{ scenario.decayFactor }}x</span>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Work Orders Template -->
  <template id="tmpl-work-orders">
    <div>
      <h2 class="mb-4">工单与农务协同</h2>
      <div class="g-grid g-grid-3 mb-4">
        <div class="g-card">
          <h3 class="text-muted">本周总任务</h3>
          <div style="font-size:32px; margin-top:8px">12</div>
        </div>
        <div class="g-card">
          <h3 class="text-muted">待执行</h3>
          <div style="font-size:32px; color:var(--g-warning); margin-top:8px">4</div>
        </div>
        <div class="g-card">
          <h3 class="text-muted">水资源状况</h3>
          <div style="font-size:24px; color:var(--g-success); margin-top:12px">充足 (3760L)</div>
        </div>
      </div>

      <div class="g-card">
        <table class="g-table">
          <thead>
            <tr>
              <th>工单标题</th>
              <th>关联地块</th>
              <th>优先级</th>
              <th>状态</th>
              <th>截止时间</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="order in state.workOrders" :key="order.workOrderId">
              <td style="font-weight:500">{{ order.title }}</td>
              <td>{{ order.plotId }}</td>
              <td>
                <span class="g-badge" :class="order.priority === 'HIGH' ? 'danger' : 'primary'">{{ order.priority }}</span>
              </td>
              <td>{{ order.status }}</td>
              <td class="text-muted">今日</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </template>

  <!-- Crop Packs Template -->
  <template id="tmpl-crop-packs">
    <div>
      <h2 class="mb-4">作物标准化包 (Crop Packs)</h2>
      <div class="g-grid g-grid-2">
        <div class="g-card" v-for="crop in state.cropPackDetails" :key="crop.cropCode">
          <div class="flex justify-between items-center mb-4">
            <h3>{{ crop.identity.name }} (v{{ crop.version }})</h3>
            <span class="g-badge primary">{{ crop.identity.region }}</span>
          </div>
          <p class="text-muted mb-4">{{ crop.knowledge.content[2] }}</p>
          
          <table class="g-table">
            <thead><tr><th>生长阶段</th><th>温湿度目标</th></tr></thead>
            <tbody>
              <tr v-for="stage in crop.stages" :key="stage.code">
                <td>{{ stage.label }}</td>
                <td class="text-muted">
                  {{ stage.target.soilMoistureLow }}%~{{ stage.target.soilMoistureHigh }}%, 
                  {{ stage.target.airTemperatureLow }}°C~{{ stage.target.airTemperatureHigh }}°C
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <!-- Value Ledger Template -->
  <template id="tmpl-value-ledger">
    <div>
      <h2 class="mb-4">经营价值与效益对账本</h2>
      <div class="g-grid g-grid-4 mb-4">
        <div class="g-card">
          <h3 class="text-muted">总节水 (L)</h3>
          <div style="font-size:28px; color:var(--g-primary); margin-top:8px">{{ state.valueLedger.summary.savedWaterLitres }}</div>
        </div>
        <div class="g-card">
          <h3 class="text-muted">节约电量 (Kwh)</h3>
          <div style="font-size:28px; color:var(--g-primary); margin-top:8px">{{ state.valueLedger.summary.savedElectricityKwh }}</div>
        </div>
        <div class="g-card">
          <h3 class="text-muted">节省工时</h3>
          <div style="font-size:28px; color:var(--g-primary); margin-top:8px">{{ state.valueLedger.summary.labourSavedHours }} h</div>
        </div>
        <div class="g-card">
          <h3 class="text-muted">直接经济效益</h3>
          <div style="font-size:28px; color:var(--g-success); margin-top:8px">¥ {{ state.valueLedger.summary.totalSavedRmb }}</div>
        </div>
      </div>

      <div class="g-grid g-grid-2">
        <div class="g-card">
          <h3 class="mb-4">反事实推演 (传统 vs AgriLoop)</h3>
          <table class="g-table">
            <thead><tr><th>周期</th><th>传统估算成本</th><th>实际产生金额</th><th>差额</th></tr></thead>
            <tbody>
              <tr v-for="item in state.valueLedger.counterfactual" :key="item.week">
                <td>{{ item.week }}</td>
                <td class="text-muted">¥{{ item.traditionalCostRmb }}</td>
                <td style="color:var(--g-success)">¥{{ item.agriLoopCostRmb }}</td>
                <td><span class="g-badge success">-¥{{ item.traditionalCostRmb - item.agriLoopCostRmb }}</span></td>
              </tr>
            </tbody>
          </table>
        </div>
        
        <div class="g-card">
          <h3 class="mb-4">每日偏差率跟踪</h3>
          <div id="ledgerChart" style="width: 100%; height: 300px;"></div>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
