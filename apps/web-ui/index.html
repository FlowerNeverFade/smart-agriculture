<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>AgriLoop · 智慧农业工作台</title>
  
  <link rel="stylesheet" href="vendor/phosphor/style.css">
  <link rel="stylesheet" href="css/style.css">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
  
  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/echarts.min.js"></script>
  
  <style>
    .feed-actions { display: flex; gap: 8px; margin-top: 12px; }
    .chat-msg { margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height:1.5; }
    .chat-msg.user { background: var(--g-primary-bg); color: var(--g-primary-hover); margin-left: auto; border-bottom-right-radius: 4px; }
    .chat-msg.agent { background: var(--g-bg-base); color: var(--g-text-primary); margin-right: auto; border-bottom-left-radius: 4px; border: 1px solid var(--g-border-subtle); }
    .scenario-btn { text-align: left; padding: 16px; border: 1px solid var(--g-border); border-radius: var(--g-radius); cursor: pointer; transition: all 0.2s; background: var(--g-bg-surface); }
    .scenario-btn:hover { border-color: var(--g-primary); background: var(--g-primary-bg); }
    .scenario-btn.active { border-color: var(--g-primary); background: var(--g-primary-bg); box-shadow: 0 0 0 1px var(--g-primary); }
    .gates-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--g-border-subtle); }
  </style>
</head>
<body>
  <div id="app" v-cloak :class="roleClass">
    <header class="g-header">
      <div class="g-header-left">
        <button class="g-btn icon-only" @click="toggleSidebar" aria-label="展开或收起导航"><app-icon name="menu"></app-icon></button>
        <img src="assets/brand/agriloop-logo.png" height="32" alt="AgriLoop" class="g-brand-logo">
        <span class="g-header-title">AgriLoop Console</span>
      </div>
      <div class="g-header-right">
        <button class="g-btn icon-only" @click="toggleTheme" title="切换主题" aria-label="切换主题"><app-icon :name="isDark ? 'light_mode' : 'dark_mode'"></app-icon></button>
        <button class="g-btn icon-only" @click="logout" title="退出登录" aria-label="退出登录"><app-icon name="logout"></app-icon></button>
        <span class="g-badge" :class="isLive ? 'success' : 'warning'">
          {{ isLive ? '系统在线 (UP)' : '仿真态 (MOCK)' }}
        </span>
        <div class="flex items-center gap-2 ml-2">
          <span class="g-user-avatar" aria-hidden="true">{{ state.currentUser.avatar }}</span>
          <span class="g-user-identity">
            <strong>{{ state.currentUser.username }}</strong>
            <small>{{ state.currentUser.roleLabel }}</small>
          </span>
        </div>
      </div>
    </header>

    <div class="g-body">
      <nav class="g-sidebar" :class="{collapsed: !isSidebarOpen}">
        <button v-for="nav in navItems" :key="nav.id" type="button"
             class="g-nav-item" :class="{active: currentView === nav.id}"
             :aria-current="currentView === nav.id ? 'page' : null"
             @click="navigate(nav.id)">
          <app-icon :name="nav.icon"></app-icon>
          {{ nav.label }}
        </button>
      </nav>

      <main class="g-main">
        <transition name="fade" mode="out-in">
          <component :is="currentViewComponent" :state="state" :route-params="routeParams"
                     @navigate="navigate" @open-plot-detail="openPlotDetail"
                     @plot-change="applyPlotChange"></component>
        </transition>

        <plot-detail-modal v-if="selectedPlot" :plot="selectedPlot" :work-orders="state.workOrders"
                           @close="closePlotDetail" @navigate="navigateFromPlotDetail"></plot-detail-modal>
        
        <div class="g-toast-container">
          <transition-group name="toast">
            <div v-for="toast in toasts" :key="toast.id" class="g-toast">
              <app-icon :name="toast.type === 'error' ? 'error' : 'check_circle'" :style="{color: toast.type === 'error' ? 'var(--g-danger)' : 'var(--g-success)'}"></app-icon>
              {{ toast.message }}
            </div>
          </transition-group>
        </div>
      </main>
    </div>
  </div>

  <!-- Dashboard Template -->
  <template id="tmpl-dashboard">
    <section v-if="isFarmAdmin" class="manager-dashboard" aria-labelledby="manager-dashboard-title">
      <header class="manager-dashboard-header">
        <div class="manager-dashboard-heading">
          <h1 id="manager-dashboard-title">农场总览</h1>
          <p>先看地块状态，再处理异常和农务。</p>
        </div>
        <div class="manager-dashboard-actions">
          <label class="sr-only" for="manager-farm-select">选择农场</label>
          <select id="manager-farm-select" class="g-select manager-farm-select" v-model="selectedFarmId">
            <option v-for="farm in state.farms" :key="farm.farmId" :value="farm.farmId">
              {{ farm.name }} · {{ farm.region }}
            </option>
          </select>
          <button type="button" class="g-btn primary manager-create-task" @click="createTask">
            <app-icon name="add_task"></app-icon>
            创建农务任务
          </button>
        </div>
      </header>

      <div class="manager-summary-strip" aria-label="今日农场概况">
        <div class="manager-summary-item" v-for="item in managerSummary" :key="item.id">
          <span>{{ item.label }}</span>
          <strong>{{ item.value }}</strong>
        </div>
      </div>

      <div class="manager-plot-grid" aria-label="地块状态列表">
        <article v-for="plot in state.plots" :key="plot.plotId"
                 class="manager-plot-card" :class="`is-${cardTone(plot)}`"
                 role="button" tabindex="0" :data-plot-card="plot.plotId"
                 :aria-label="`查看${plot.name}二维详情`"
                 @click="openPlotDetail(plot, $event)"
                 @keydown.enter.prevent="openPlotDetail(plot, $event)"
                 @keydown.space.prevent="openPlotDetail(plot, $event)">
          <header class="manager-plot-card-header">
            <div class="manager-plot-title">
              <h2>{{ plot.name }}</h2>
              <span>{{ plot.lastSeen || '—' }}</span>
            </div>
            <div class="manager-plot-card-tools">
              <div class="manager-health-score">综合健康 <strong>{{ healthScore(plot) }}</strong></div>
              <div class="manager-plot-actions" @click.stop>
                <button type="button" class="manager-more-button" :aria-expanded="plotMenuId === plot.plotId"
                        :aria-label="`${plot.name}地块操作`" @click.stop="togglePlotMenu(plot.plotId)">
                  <app-icon name="more_vertical"></app-icon>
                </button>
                <div v-if="plotMenuId === plot.plotId" class="manager-plot-menu" role="menu">
                  <button type="button" role="menuitem" @click="openEditPlot(plot)">
                    <app-icon name="edit"></app-icon><span>修改地块</span>
                  </button>
                  <button type="button" class="is-danger" role="menuitem" @click="requestDeletePlot(plot)">
                    <app-icon name="delete"></app-icon><span>删除地块</span>
                  </button>
                </div>
              </div>
            </div>
          </header>
          <p class="manager-plot-meta">
            <span>品种：{{ plot.cropVariety || '—' }}</span>
            <span>面积：{{ plot.areaM2 ?? '—' }}㎡</span>
            <span>生长阶段：{{ plot.stageLabel || '—' }}</span>
            <span>生长周期：{{ plot.growthCycleDays ? `${plot.growthCycleDays}天` : '—' }}</span>
          </p>
          <div class="manager-metric-grid">
            <div class="manager-metric" :class="`is-${metricTone(metric)}`" v-for="metric in plotMetrics(plot)" :key="metric.code">
              <div class="manager-metric-label">
                <span>{{ metric.label }}</span>
                <app-icon :name="metricStatusIcon(metric)"></app-icon>
              </div>
              <div class="manager-metric-value">
                {{ formatMetric(metric) }} <small v-if="formatMetric(metric) !== '—'">{{ metric.unit }}</small>
              </div>
              <div class="manager-metric-target">靶标：{{ metric.target }}</div>
            </div>
          </div>
        </article>
        <button type="button" class="manager-plot-card manager-add-plot-card" @click="openCreatePlot">
          <span class="manager-add-plot-icon"><app-icon name="add"></app-icon></span>
          <strong>添加新地块</strong>
          <small>录入作物种类、生长周期和地块面积</small>
        </button>
      </div>
      <div v-if="!state.plots.length" class="simple-empty-state manager-plot-empty">
        <app-icon name="info"></app-icon>
        <h2>暂无可显示的地块</h2>
        <p>请确认后端服务和当前账户的地块权限；系统不会用演示指标代替正式数据。</p>
      </div>

      <div v-if="plotEditor.open" class="g-modal-overlay manager-plot-editor-overlay" @click.self="closePlotEditor">
        <form class="g-modal manager-plot-editor" role="dialog" aria-modal="true" @submit.prevent="submitPlot">
          <div class="g-modal-header">
            <div>
              <p>{{ plotEditor.mode === 'edit' ? '修改地块信息' : '新增地块' }}</p>
              <h2>{{ plotEditor.mode === 'edit' ? plotDraft.name : '添加一个新地块' }}</h2>
            </div>
            <button type="button" class="g-btn icon-only" aria-label="关闭" @click="closePlotEditor"><app-icon name="close"></app-icon></button>
          </div>
          <div class="g-modal-body manager-plot-form">
            <label class="g-form-group manager-form-span-2">
              <span class="g-form-label">地块名称 *</span>
              <input class="g-input" v-model.trim="plotDraft.name" maxlength="40" required placeholder="例如：C02 辣椒试验田">
            </label>
            <label class="g-form-group">
              <span class="g-form-label">作物种类 *</span>
              <select class="g-select" v-model="plotDraft.cropCode" required>
                <option v-for="crop in cropOptions" :key="crop.code" :value="crop.code">{{ crop.name }}</option>
              </select>
            </label>
            <label class="g-form-group">
              <span class="g-form-label">作物品种 *</span>
              <input class="g-input" v-model.trim="plotDraft.cropVariety" maxlength="40" required placeholder="例如：千禧水果番茄">
            </label>
            <label class="g-form-group">
              <span class="g-form-label">当前生长阶段 *</span>
              <select class="g-select" v-model="plotDraft.stageCode" required>
                <option v-for="stage in stageOptions" :key="stage.code" :value="stage.code">{{ stage.label }}</option>
              </select>
            </label>
            <label class="g-form-group">
              <span class="g-form-label">完整生长周期（天）*</span>
              <input class="g-input" type="number" v-model.number="plotDraft.growthCycleDays" min="1" max="1000" required>
            </label>
            <label class="g-form-group manager-form-span-2">
              <span class="g-form-label">地块面积（㎡）*</span>
              <input class="g-input" type="number" v-model.number="plotDraft.areaM2" min="1" step="0.1" required>
            </label>
            <p class="manager-form-note manager-form-span-2">保存后，农场总览、地块详情、设备绑定和任务选择中的地块信息会同时更新。</p>
          </div>
          <div class="g-modal-footer">
            <button type="button" class="g-btn secondary" :disabled="plotSaving" @click="closePlotEditor">取消</button>
            <button type="submit" class="g-btn primary" :disabled="plotSaving">{{ plotSaving ? '保存中…' : '保存地块' }}</button>
          </div>
        </form>
      </div>

      <div v-if="deleteConfirm.open" class="g-modal-overlay manager-plot-editor-overlay" @click.self="cancelDeletePlot">
        <section class="g-modal manager-delete-dialog" role="alertdialog" aria-modal="true">
          <div class="manager-delete-icon"><app-icon name="delete"></app-icon></div>
          <h2>确定删除这个地块？</h2>
          <p>“{{ deleteConfirm.plot?.name }}”将从农场总览和所有地块选择列表中移除，此操作不能撤销。</p>
          <div class="g-modal-footer">
            <button type="button" class="g-btn secondary" :disabled="plotSaving" @click="cancelDeletePlot">取消</button>
            <button type="button" class="g-btn danger" :disabled="plotSaving" @click="confirmDeletePlot">{{ plotSaving ? '删除中…' : '确认删除' }}</button>
          </div>
        </section>
      </div>
    </section>

    <div v-else>
      <div class="flex justify-between items-center mb-4">
        <div>
          <h2>{{ state.currentUser.roleLabel }} · 工作台</h2>
          <p class="role-summary">{{ state.currentUser.roleDescription }}</p>
        </div>
        <span class="g-badge primary">{{ state.farms[0].name }} · {{ state.farms[0].region }}</span>
      </div>
      <div class="g-grid g-grid-2 mb-4">
        <div class="g-card" v-for="plot in state.plots" :key="plot.plotId">
          <div class="flex justify-between items-center mb-4">
            <div>
              <h3 style="display:inline-block; margin-right:8px">{{ plot.name }}</h3>
              <span class="g-badge" :class="plot.deviceStatus==='ONLINE'?'success':'danger'">{{ plot.deviceId }} ({{ plot.lastSeen }})</span>
            </div>
            <span class="g-badge" :class="plot.riskLevel === 'LOW' ? 'success' : (plot.riskLevel === 'WARN' ? 'warning' : 'danger')">
              综合健康 {{ healthScore(plot) }}
            </span>
          </div>
          <p class="text-muted mb-4">品种：{{ plot.cropVariety }} | 面积：{{ plot.areaM2 }}㎡ | 阶段：{{ plot.stageLabel }}</p>
          <div class="metric-grid">
            <div class="metric-box" v-for="metric in plotMetrics(plot)" :key="metric.code">
              <div class="metric-label">
                <span>{{ metric.label }}</span>
                <app-icon :name="metricStatusIcon(metric)" :class="`metric-${metricTone(metric)}`"></app-icon>
              </div>
              <div class="metric-val" :class="`metric-${metricTone(metric)}`">
                {{ formatMetric(metric) }} <span>{{ metric.unit }}</span>
              </div>
              <div class="metric-target">靶标：{{ metric.target }}</div>
            </div>
          </div>
        </div>
      </div>

      <h3 class="mt-4 mb-4">智能警报与信息流</h3>
      <div class="g-grid g-grid-2">
        <div class="g-card flex gap-4" v-for="feed in state.feedItems" :key="feed.id">
          <app-icon :name="feed.type === 'DIAGNOSIS' ? 'warning' : (feed.type === 'PRESCRIPTION' ? 'water_drop' : 'info')"
                    :style="{color: feed.badge.color === 'amber' ? 'var(--g-warning)' : (feed.badge.color === 'green' ? 'var(--g-success)' : 'var(--g-primary)'), fontSize: '32px'}"></app-icon>
          <div style="flex:1">
            <div class="flex justify-between items-center mb-2">
              <span class="g-badge" style="background:var(--g-bg-base); border:1px solid var(--g-border)">{{ feed.category }}</span>
              <span class="text-muted" style="font-size:12px">{{ feed.timestamp }}</span>
            </div>
            <h4>{{ feed.title }}</h4>
            <p class="text-muted mt-2" style="font-size:13px">{{ feed.summary }}</p>
            <div class="feed-actions">
              <button v-for="(act, idx) in visibleActions(feed.actions)" :key="idx"
                      class="g-btn" :class="act.type === 'primary' ? 'primary' : 'secondary'"
                      @click="handleAction(act)">{{ act.label }}</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="tmpl-plot-detail-modal">
    <transition name="fade">
      <div class="g-modal-overlay plot-detail-overlay" @click.self="close" @keydown.esc="close">
        <section class="g-modal plot-detail-dialog" role="dialog" aria-modal="true" :aria-labelledby="`plot-detail-${plot.plotId}`">
          <header class="g-modal-header plot-detail-header">
            <div>
              <p>二维地块详情</p>
              <h2 :id="`plot-detail-${plot.plotId}`">{{ plot.name }}</h2>
            </div>
            <button type="button" class="g-btn icon-only" data-plot-detail-close @click="close" aria-label="关闭地块详情">
              <app-icon name="close"></app-icon>
            </button>
          </header>
          <div class="g-modal-body plot-detail-body">
            <div class="plot-detail-facts">
              <div><span>品种</span><strong>{{ plot.cropVariety || '—' }}</strong></div>
              <div><span>面积</span><strong>{{ plot.areaM2 ?? '—' }}㎡</strong></div>
              <div><span>生长阶段</span><strong>{{ plot.stageLabel || '—' }}</strong></div>
              <div><span>综合健康</span><strong>{{ healthScore(plot.healthScore) }}</strong></div>
            </div>

            <section class="plot-detail-section" aria-labelledby="plot-detail-metrics-title">
              <h3 id="plot-detail-metrics-title">关键数据</h3>
              <div class="plot-detail-metrics">
                <div class="plot-detail-metric" :class="`is-${metricTone(metric)}`" v-for="metric in metrics" :key="metric.code">
                  <div><span>{{ metric.label }}</span><app-icon :name="metricTone(metric) === 'normal' ? 'check_circle' : metricTone(metric) === 'unavailable' ? 'remove_circle_outline' : 'warning_amber'"></app-icon></div>
                  <strong>{{ formatMetric(metric) }} <small v-if="formatMetric(metric) !== '—'">{{ metric.unit }}</small></strong>
                  <p>建议范围：{{ metric.target }}</p>
                </div>
              </div>
            </section>

            <section class="plot-plain-issue" :class="`is-${issueSummary.tone}`" aria-labelledby="plot-detail-issue-title">
              <app-icon :name="issueSummary.tone === 'normal' ? 'check_circle' : 'warning_amber'"></app-icon>
              <div><h3 id="plot-detail-issue-title">{{ issueSummary.title }}</h3><p>{{ issueSummary.detail }}</p></div>
            </section>

            <section class="plot-detail-section" aria-labelledby="plot-detail-work-title">
              <div class="plot-detail-section-heading">
                <h3 id="plot-detail-work-title">相关农务</h3>
                <button type="button" class="text-action" @click="openView('work-orders', { openCreateTask: true })">安排农务</button>
              </div>
              <div class="plot-related-work" v-if="relatedWork.length">
                <article v-for="item in relatedWork" :key="item.workOrderId || item.workItemId">
                  <div><strong>{{ item.title || '未命名任务' }}</strong><span>{{ statusLabel(item) }}</span></div>
                  <p>{{ item.reason || '暂无执行说明' }}</p>
                  <time>{{ dueLabel(item) }}</time>
                </article>
              </div>
              <p class="plot-empty-work" v-else>这块地目前没有相关农务。</p>
            </section>
          </div>
          <footer class="g-modal-footer plot-detail-footer">
            <button type="button" class="g-btn secondary" @click="openView('decision-console', { highlight: 'diagnosis' })">查看告警</button>
            <button type="button" class="g-btn primary" @click="openView('work-orders', { openCreateTask: true })">安排农务</button>
          </footer>
        </section>
      </div>
    </transition>
  </template>

  <!-- Decision Console Template -->
  <template id="tmpl-decision-console">
    <div>
      <h2 class="mb-4">智能诊断与处方中枢 (Decision Console)</h2>
      <div class="g-grid g-grid-2">
        
        <!-- Root Cause & Prescription -->
        <div>
          <div class="g-card mb-4" v-if="diagnosis" :class="{'highlight-pulse': highlightDiagnosis}">
            <div class="flex justify-between items-center mb-4">
              <h3 class="flex items-center gap-2">
                <app-icon name="psychology" style="color:var(--g-warning)"></app-icon>
                根因诊断 (Root Cause)
              </h3>
              <span class="g-badge success">置信度 {{ (diagnosis.details.confidence * 100).toFixed(0) }}%</span>
            </div>
            <div class="metric-box mb-4" style="background: var(--g-warning-bg); border-color: var(--g-warning)">
              <h4 style="color: var(--g-warning)">主因：{{ diagnosis.details.primaryCause }}</h4>
              <p class="mt-2" style="font-size:13px">{{ diagnosis.summary }}</p>
            </div>
            
            <div class="g-grid g-grid-2 gap-4">
              <div>
                <div style="font-weight:500; color:var(--g-success); margin-bottom:8px">支持证据 (Supported)</div>
                <ul style="padding-left:16px; font-size:13px; color:var(--g-text-secondary)">
                  <li v-for="(ev, i) in diagnosis.details.supportingEvidence" :key="i" class="mb-2">{{ ev }}</li>
                </ul>
              </div>
              <div>
                <div style="font-weight:500; color:var(--g-text-primary); margin-bottom:8px">反对/排他证据 (Opposing)</div>
                <ul style="padding-left:16px; font-size:13px; color:var(--g-text-secondary)">
                  <li v-for="(ev, i) in diagnosis.details.opposingEvidence" :key="i" class="mb-2">{{ ev }}</li>
                </ul>
              </div>
            </div>
          </div>

          <div class="g-card" v-if="prescription">
            <div class="flex justify-between items-center mb-4">
              <h3 class="flex items-center gap-2">
                <app-icon name="receipt_long" style="color:var(--g-primary)"></app-icon>
                农业处方 (Prescription)
              </h3>
              <span class="g-badge success">READY · 就绪</span>
            </div>
            
            <div class="g-grid g-grid-3 mb-4">
              <div class="metric-box">
                <div class="text-muted" style="font-size:12px">建议补水量</div>
                <div style="font-size:24px; color:var(--g-primary)">{{ prescription.details.waterLitre }}<span style="font-size:14px"> L</span></div>
              </div>
              <div class="metric-box">
                <div class="text-muted" style="font-size:12px">执行时长</div>
                <div style="font-size:24px">{{ prescription.details.durationFormatted }}</div>
              </div>
              <div class="metric-box">
                <div class="text-muted" style="font-size:12px">预估成本</div>
                <div style="font-size:24px">{{ prescription.details.costEstimate.split(' ')[1] }}<span style="font-size:14px"> 元</span></div>
              </div>
            </div>

            <h4 class="mb-2">执行安全门控 (Readiness Gates)</h4>
            <ul class="gates-list mb-4 text-muted" style="font-size:13px">
              <li v-for="(val, key) in prescription.details.hardGates" :key="key">
                <span>{{ key }}</span>
                <span style="color:var(--g-success); font-weight:500">{{ val }}</span>
              </li>
            </ul>

            <div class="flex gap-2">
              <button class="g-btn primary" style="flex:1" @click="openExecution">
                <app-icon name="bolt"></app-icon> 虚拟执行 (What-if)
              </button>
              <button class="g-btn secondary" @click="showPassportModal = true">

                <th>阶段 (Stage)</th>
                <th>土壤湿度靶标</th>
                <th>环境气温靶标</th>
                <th>重点防护风险</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="stage in crop.stages" :key="stage.code">
                <td>{{ stage.sequence }}</td>
                <td style="font-weight:500">{{ stage.label }} ({{ stage.code }})</td>
                <td>{{ stage.target.soilMoistureLow }}% ~ {{ stage.target.soilMoistureHigh }}%</td>
                <td>{{ stage.target.airTemperatureLow }}°C ~ {{ stage.target.airTemperatureHigh }}°C</td>
                <td>
                  <span class="g-badge mr-2" style="background:var(--g-danger-bg); color:var(--g-danger); margin-right:4px" v-for="r in stage.riskFocus" :key="r">{{ r }}</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <h4 class="mb-2">硬性规则与阈值 (Rules Engine)</h4>
        <div style="overflow-x:auto">
          <table class="g-table">
            <thead>
              <tr>
                <th>规则代码</th>
                <th>判定指标</th>
                <th>操作符</th>
                <th>触发阈值</th>
                <th>持续时间</th>
                <th>动作冷却</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="rule in crop.rules" :key="rule.code">
                <td style="font-weight:500; color:var(--g-primary)">{{ rule.code }}</td>
                <td>{{ rule.metric }}</td>
                <td>{{ rule.operator }}</td>
                <td>{{ rule.threshold }}</td>
                <td>{{ rule.durationMinutes }} min</td>
                <td>{{ rule.cooldownMinutes }} min</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <!-- Value Ledger Template -->
  <template id="tmpl-value-ledger">
    <div>
      <h2 class="mb-4">经营效益审计台账 (Value Ledger)</h2>
      
      <div class="g-grid g-grid-4 mb-4">
        <div class="g-card text-center">
          <div class="text-muted mb-2">规划用水 vs 实际用水</div>
          <div style="font-size:24px; font-weight:500">{{ state.valueLedger.summary.plannedWaterLitres }}L / {{ state.valueLedger.summary.actualWaterLitres }}L</div>
          <div class="g-badge success mt-2">节约 {{ state.valueLedger.summary.savedWaterLitres }}L</div>
        </div>
        <div class="g-card text-center">
          <div class="text-muted mb-2">节约电力折算</div>
          <div style="font-size:24px; font-weight:500; color:var(--g-primary)">{{ state.valueLedger.summary.savedElectricityKwh }} kWh</div>
          <div class="text-muted mt-2" style="font-size:12px">泵站耗能直降</div>
        </div>
        <div class="g-card text-center">
          <div class="text-muted mb-2">节省巡田工时</div>
          <div style="font-size:24px; font-weight:500; color:var(--g-purple)">{{ state.valueLedger.summary.labourSavedHours }} h</div>
          <div class="text-muted mt-2" style="font-size:12px">精准派单优势</div>
        </div>
        <div class="g-card text-center">
          <div class="text-muted mb-2">总经济效益 (人民币)</div>
          <div style="font-size:28px; font-weight:500; color:var(--g-success)">¥ {{ state.valueLedger.summary.totalSavedRmb }}</div>
          <div class="text-muted mt-2" style="font-size:12px">基于当前计价本推算</div>
        </div>
      </div>

      <div class="g-grid" style="grid-template-columns: 2fr 1fr">
        <div class="g-card">
          <h3 class="mb-4">每日偏差率跟踪矩阵</h3>
          <div id="ledgerChart" style="width: 100%; height: 320px;"></div>
        </div>

        <div class="g-card">
          <h3 class="mb-4">数据审计溯源 (Provenance)</h3>
          <ul class="gates-list">
            <li v-for="(prov, i) in state.valueLedger.provenance" :key="i" style="flex-direction:column; align-items:flex-start">
              <div class="flex justify-between" style="width:100%">
                <span style="font-weight:500">{{ prov.key }}</span>
                <span class="g-badge" :class="prov.value==='OBSERVED'?'primary':(prov.value==='DERIVED'?'purple':'warning')">{{ prov.value }}</span>
              </div>
              <div class="text-muted mt-2" style="font-size:12px">{{ prov.tag }}</div>
            </li>
          </ul>

          <h3 class="mt-4 mb-4">反事实推演对标</h3>
          <table class="g-table">
            <thead><tr><th>周期</th><th>传统估算</th><th>AgriLoop</th></tr></thead>
            <tbody>
              <tr v-for="item in state.valueLedger.counterfactual" :key="item.week">
                <td>{{ item.week }}</td>
                <td class="text-muted">¥{{ item.traditionalCostRmb }}</td>
                <td style="color:var(--g-success)">¥{{ item.agriLoopCostRmb }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
