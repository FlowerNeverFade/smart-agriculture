<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f2f8ee">
  <title>AgriLoop · 智慧农业工作台</title>
  <link rel="stylesheet" href="css/style.css?v=20260825-plot-workspace">
  <link rel="stylesheet" href="vendor/phosphor/style.css">
  <link rel="stylesheet" href="css/farm-monitor.css?v=20260824-branch-refresh">
  <link rel="stylesheet" href="css/modules/forecast.css?v=20260824-branch-refresh">
  <link rel="stylesheet" href="css/modules/value-ledger.css?v=20260824-branch-refresh">
  <link rel="stylesheet" href="css/modules/crop-packs.css?v=20260824-branch-refresh">
  <link rel="stylesheet" href="css/modules/work-orders.css?v=20260824-branch-refresh">
  <link rel="stylesheet" href="css/crop-sandbox.css?v=20260824-branch-refresh">
  <link rel="icon" href="assets/brand/agriloop-logo.png">
</head>
<body class="dashboard-page">
  <div class="dashboard-environment" aria-hidden="true">
    <div class="dashboard-environment__fallback" id="liquidFieldFallback">
      <div class="dashboard-environment__field dashboard-environment__field--primary"></div>
      <div class="dashboard-environment__field dashboard-environment__field--ambient"></div>
    </div>
    <canvas class="dashboard-environment__canvas" id="ambientLiquidCanvas"></canvas>
  </div>

  <main class="dashboard-stage" aria-label="AgriLoop 智慧农业工作台">
    <section class="dashboard-shell" id="dashboardShell">
      <header class="dashboard-header">
        <div class="dashboard-header__brand-group">
          <button class="dashboard-brand" id="btnLogoHome" type="button" title="返回首页" aria-label="返回首页">
            <img src="assets/brand/agriloop-logo.png" width="1366" height="398" alt="AgriLoop">
          </button>
          <span class="dashboard-header__divider" aria-hidden="true"></span>
          <div class="farm-menu">
            <button class="farm-selector" id="btnFarmSelector" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span>示范农场 · 重庆科学城</span>
              <i class="ph ph-caret-down" aria-hidden="true"></i>
            </button>
            <div class="farm-menu__popover" id="farmMenuPopover" role="listbox" aria-label="选择农场" hidden>
              <button class="farm-menu__option is-selected" type="button" role="option" aria-selected="true" data-farm-id="farm-demo">
                <span>示范农场</span>
                <small>重庆科学城 · 当前农场</small>
              </button>
            </div>
          </div>
        </div>

        <div class="dashboard-header__tools">
          <time class="dashboard-date" id="dashboardDate"></time>
          <button class="header-icon-button" id="btnNotifications" type="button" aria-label="查看需要处理的事项" title="查看需要处理的事项">
            <i class="ph ph-bell" aria-hidden="true"></i>
            <span class="header-icon-button__dot" aria-hidden="true"></span>
          </button>
          <div class="user-menu">
            <button class="user-profile" id="btnUserMenu" type="button" aria-haspopup="menu" aria-expanded="false">
              <span class="user-avatar" id="userAvatar" aria-hidden="true">农</span>
              <span class="user-profile__copy">
                <strong id="userDisplayName">用户</strong>
                <small id="userRoleLabel">农场管理员</small>
              </span>
              <i class="ph ph-caret-down" aria-hidden="true"></i>
            </button>
            <div class="user-menu__popover" id="userMenuPopover" role="menu" hidden>
              <div class="user-menu__summary">
                <strong id="userMenuName">用户</strong>
                <span id="userMenuRole">农场管理员</span>
              </div>
              <div class="user-system-controls" id="systemUserControls" hidden>
                <div class="user-system-controls__heading">
                  <span>数据模拟器</span>
                  <span class="simulator-status-tag" id="simulatorStatusTag">需登录</span>
                </div>
                <strong id="simulatorStatusText">登录后查看状态</strong>
                <p id="simulatorStatusHint">仅管理员可以控制演示数据。</p>
                <div class="user-system-controls__actions">
                  <button class="text-control" id="btnRefreshSimulator" type="button">刷新状态</button>
                  <button class="compact-action" id="btnToggleSimulator" type="button" disabled>启动</button>
                </div>
              </div>
              <button class="user-menu__logout" id="btnLogout" type="button" role="menuitem">
                <i class="ph ph-sign-out" aria-hidden="true"></i>
                退出登录
              </button>
            </div>
          </div>
        </div>
      </header>

      <div class="dashboard-body">
        <nav class="global-nav" aria-label="主要功能">
          <div class="global-nav__items" id="moduleNavList"></div>
          <button class="global-nav__help" id="btnOpenSearch" type="button" title="搜索全部功能（Ctrl+K）" aria-label="搜索全部功能">
            <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
            <span>搜索</span>
          </button>
        </nav>

        <aside class="plot-panel" id="plotPanel" aria-label="我的地块">
          <div class="plot-panel__header">
            <div>
              <h1>我的地块</h1>
              <span id="plotsCountTag">0 个地块</span>
            </div>
            <button class="plot-panel__close" id="btnClosePlotPanel" type="button" aria-label="关闭地块列表">
              <i class="ph ph-x" aria-hidden="true"></i>
            </button>
          </div>
          <label class="plot-search" for="plotSearchInput">
            <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
            <input type="search" id="plotSearchInput" placeholder="查找地块" autocomplete="off">
          </label>
          <ul class="plot-list" id="plotListContainer" aria-label="地块列表"></ul>
        </aside>

        <section class="plot-workspace" id="mainFeedArea" aria-labelledby="workspacePlotName">
          <div class="workspace-scroll">
            <header class="workspace-header">
              <div>
                <h2 id="workspacePlotName">正在读取地块</h2>
                <p id="workspacePlotMeta">数据加载中</p>
              </div>
              <button class="workspace-switch" id="btnSwitchPlot" type="button" aria-label="切换地块">
                <i class="ph ph-arrows-left-right" aria-hidden="true"></i>
                <span>切换地块</span>
                <i class="ph ph-caret-down" aria-hidden="true"></i>
              </button>
            </header>

            <section class="priority-banner" id="priorityBanner" aria-live="polite">
              <span class="priority-banner__icon" aria-hidden="true"><i class="ph ph-drop"></i></span>
              <div class="priority-banner__copy">
                <h3 id="priorityTitle">正在判断当前情况</h3>
                <p id="priorityDescription">请稍候，系统正在读取最新数据。</p>
              </div>
              <button class="priority-banner__action" id="btnQuickAction" type="button">安排处理</button>
            </section>

            <section class="essential-metrics" id="essentialMetrics" aria-label="当前关键数据"></section>

            <section class="trend-section" aria-labelledby="trendTitle">
              <div class="section-heading">
                <div>
                  <h3 id="trendTitle">土壤湿度变化</h3>
                  <span>最近 4 小时</span>
                </div>
                <button class="section-link" id="btnOpenPlotDetail" type="button">查看详细数据 <i class="ph ph-arrow-right"></i></button>
              </div>
              <div class="moisture-chart" id="moistureChart" aria-live="polite">
                <div class="workspace-loading">正在读取湿度变化…</div>
              </div>
            </section>

            <div class="workspace-lower">
              <section class="schedule-section" aria-labelledby="scheduleTitle">
                <div class="section-heading">
                  <h3 id="scheduleTitle">今天的安排</h3>
                </div>
                <div class="schedule-list" id="todaySchedule"></div>
                <button class="section-link section-link--footer" id="btnViewAllWork" type="button">查看全部农务 <i class="ph ph-arrow-right"></i></button>
              </section>

              <section class="attention-section" aria-labelledby="attentionTitle">
                <div class="section-heading">
                  <h3 id="attentionTitle">其他需要留意</h3>
                </div>
                <div class="attention-list" id="attentionList"></div>
              </section>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div class="sr-only" aria-live="polite">
    <span id="headerCurrentView">首页</span>
    <span id="systemStatusPill"><span class="dot"></span><span id="systemStatusText">正在检查数据连接</span></span>
    <span id="rightAiModeTag">正在检查智能服务</span>
  </div>

  <div class="subview-modal-backdrop" id="subviewModal">
    <div class="subview-modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="subview-modal-header">
        <div class="subview-modal-title">
          <span id="modalIcon" aria-hidden="true">🌿</span>
          <span id="modalTitle">功能详情</span>
          <span class="module-badge highlight" id="modalTag">已连接</span>
        </div>
        <button class="close-modal-btn" id="btnCloseModal" type="button" title="关闭" aria-label="关闭">✕</button>
      </div>
      <div class="subview-modal-body" id="subviewModalBody">
        <div id="modalDynamicContent"></div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <div class="cmd-palette-backdrop" id="cmdPaletteBackdrop">
    <div class="cmd-palette" role="dialog" aria-modal="true" aria-label="搜索全部功能">
      <div class="cmd-input-wrap">
        <i class="ph ph-magnifying-glass cmd-icon" aria-hidden="true"></i>
        <input type="text" class="cmd-input" id="cmdInput" placeholder="搜索地块、农务或功能…" autocomplete="off">
        <span class="cmd-kbd">ESC</span>
      </div>
      <div class="cmd-results" id="cmdResults"></div>
    </div>
  </div>

  <script type="module" src="js/app.js?v=20260825-plot-workspace"></script>
</body>
</html>
