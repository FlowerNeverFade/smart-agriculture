<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-surface-style="classic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>AgriLoop · 智慧农业工作台</title>

  <link rel="stylesheet" href="vendor/phosphor/style.css">
  <link rel="stylesheet" href="vendor/material-symbols/material-symbols.css?v=20260901-v593-market-v3">
  <link rel="stylesheet" href="css/google-material.css">
  <link rel="stylesheet" href="css/style.css?v=20260901-v593-market-v3">
  <link rel="stylesheet" href="css/account-profile.css?v=20260901-v593-market-v3">
  <link rel="stylesheet" href="css/modules/admin-alerts.css?v=20260901-v593-market-v3">
  <link rel="stylesheet" href="css/modules/admin-ai-chat.css?v=20260901-v593-market-v3">
  <link rel="stylesheet" href="css/modules/work-order-lifecycle.css?v=20260901-v593-market-v3">
  <link rel="stylesheet" href="css/modules/decision-console.css?v=20260901-v593-market-v3">
  <link rel="stylesheet" href="css/modules/admin-resource-planning.css?v=20260901-v593-market-v3">
  <link rel="stylesheet" href="css/modules/admin-management.css?v=20260901-v593-market-v3">
  <link rel="stylesheet" href="css/modules/admin-market.css?v=20260901-v598-domestic-data-v1">
  <link rel="stylesheet" href="css/modules/admin.css?v=20260901-v5910-farm-onboarding-v1">
  <link rel="stylesheet" href="css/modules/ai-chat-shared.css?v=20260901-v593-market-v3">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">

  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/echarts.min.js"></script>

  <style>
    .feed-actions { display: flex; gap: 8px; margin-top: 12px; }
    .chat-msg { margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height:1.5; }
    .chat-msg-content { white-space: pre-line; overflow-wrap: anywhere; }
    .chat-msg.user { background: var(--g-primary-bg); color: var(--g-primary-hover); margin-left: auto; border-bottom-right-radius: 4px; }
    .chat-msg.agent { background: var(--g-bg-base); color: var(--g-text-primary); margin-right: auto; border-bottom-left-radius: 4px; border: 1px solid var(--g-border-subtle); }
    .scenario-btn { text-align: left; padding: 16px; border: 1px solid var(--g-border); border-radius: var(--g-radius); cursor: pointer; transition: all 0.2s; background: var(--g-bg-surface); }
    .scenario-btn:hover { border-color: var(--g-primary); background: var(--g-primary-bg); }
    .scenario-btn.active { border-color: var(--g-primary); background: var(--g-primary-bg); box-shadow: 0 0 0 1px var(--g-primary); }
    .gates-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--g-border-subtle); }

    .cm-section { margin-bottom: 16px; }
    .cm-section-label { font-size: 12px; font-weight: 600; color: var(--g-text-secondary); margin-bottom: 10px; }
    .cm-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
    .cm-pick-card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      min-height: 88px; padding: 12px; border: 1px solid var(--g-border-subtle);
      border-radius: var(--g-radius); background: var(--g-bg-base); color: var(--g-text-primary);
      font: inherit; text-align: left; cursor: pointer;
      transition: border-color .2s, background .2s, box-shadow .2s, transform .15s;
    }
    .cm-pick-card:hover { border-color: var(--g-primary); background: var(--g-primary-bg); transform: translateY(-1px); }
    .cm-pick-card.active {
      border-color: var(--g-primary); background: var(--g-primary-bg);
      box-shadow: inset 0 0 0 1px var(--g-primary); color: var(--g-primary);
    }
    .cm-pick-icon { font-size: 22px; line-height: 1; }
    .cm-pick-seq {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 6px; font-size: 11px; font-weight: 700;
      background: var(--g-bg-subtle); color: var(--g-text-secondary);
    }
    .cm-pick-card.active .cm-pick-seq { background: var(--g-primary); color: #fff; }
    .cm-pick-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
    .cm-pick-meta { font-size: 11px; color: var(--g-text-secondary); line-height: 1.35; }
    .cm-pick-card.active .cm-pick-meta { color: var(--g-primary); opacity: .85; }
    .cm-summary {
      display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px;
      margin: 16px 0; padding: 12px 14px; border-radius: var(--g-radius);
      background: var(--g-bg-base); border: 1px solid var(--g-border-subtle);
    }
    @media (max-width: 720px) {
      .cm-card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="app" v-cloak :class="roleClass">
    <header class="g-header" :class="{ 'farmer-header': isFarmer }">
      <div class="g-header-left">
        <button class="g-btn icon-only" @click="toggleSidebar" aria-label="展开或收起导航"><app-icon name="menu"></app-icon></button>
        <img src="assets/brand/agriloop-logo.png" height="32" alt="AgriLoop" class="g-brand-logo">
      </div>

      <div v-if="state.currentUser.role !== 'FARM_ADMIN'" class="g-header-center">
          <button type="button" class="g-header-farm-select-btn" @click.stop="showFarmMenu = !showFarmMenu">
          <span>{{ selectedFarm.name || shellCopy.chooseFarm }}{{ selectedFarm.region ? ' · ' + selectedFarm.region : '' }}</span>
          <app-icon name="expand_more" style="font-size: 20px; color: var(--g-text-secondary);"></app-icon>
        </button>
        <div v-if="showFarmMenu" class="g-header-farm-menu" @click.stop>
          <button type="button" class="g-header-farm-option"
                  v-for="farm in state.farms" :key="farm.farmId"
                  :class="{ active: farm.farmId === selectedFarmId }"
                  @click="selectedFarmId = farm.farmId; showFarmMenu = false">
            {{ farm.name }}{{ farm.region ? ' · ' + farm.region : '' }}
          </button>
        </div>
      </div>

      <div class="g-header-right">
        <button class="g-btn icon-only" @click="toggleTheme" :title="shellCopy.toggleTheme" :aria-label="shellCopy.toggleTheme"><app-icon :name="isDark ? 'light_mode' : 'dark_mode'"></app-icon></button>
        <button class="g-btn icon-only" @click="logout" :title="shellCopy.logout" :aria-label="shellCopy.logout"><app-icon name="logout"></app-icon></button>
        <span class="g-badge" :class="state.sessionMode === 'demo' ? 'warning' : (isLive ? 'success' : 'danger')">
          {{ sessionModeLabel }}
        </span>
        <div class="account-profile-anchor ml-2">
          <button type="button" class="account-profile-trigger" :aria-label="shellCopy.openProfile" aria-haspopup="dialog"
                  :aria-expanded="showProfileMenu ? 'true' : 'false'" @click.stop="toggleProfileMenu">
            <span class="g-user-avatar" :class="{'material-symbols-outlined': state.currentUser.role === 'SYSTEM_ADMIN'}" aria-hidden="true">{{ state.currentUser.role === 'SYSTEM_ADMIN' ? 'admin_panel_settings' : state.currentUser.avatar }}</span>
            <span class="g-user-identity">
              <strong>{{ state.currentUser.username }}</strong>
              <small>{{ state.currentUser.roleLabel }}</small>
            </span>
            <app-icon name="expand_more" class="account-profile-chevron"></app-icon>
          </button>

          <div v-if="showProfileMenu" class="account-profile-popover" :class="accountProfile.roleClass"
               role="dialog" aria-label="个人中心" @click.stop>
            <div class="account-profile-popover-header">
              <div class="account-profile-popover-identity">
                <span class="account-profile-avatar"><app-icon :name="accountProfile.icon"></app-icon></span>
                <div>
                  <strong>{{ accountProfile.displayName }}</strong>
                  <span>{{ accountProfile.roleLabel }}</span>
                </div>
              </div>
              <button type="button" class="g-btn icon-only account-profile-close" :title="shellCopy.closeProfile" :aria-label="shellCopy.closeProfile" @click="closeProfileMenu">
                <app-icon name="close"></app-icon>
              </button>
            </div>

            <dl class="account-profile-popover-info">
              <div v-for="row in accountProfile.rows" :key="row.label">
                <dt>{{ row.label }}</dt>
                <dd><span v-if="row.badge" class="account-profile-status" :class="row.tone === 'danger' ? 'is-danger' : ''">{{ row.value }}</span><template v-else>{{ row.value }}</template></dd>
              </div>
            </dl>

            <div class="account-profile-section-title">{{ accountProfile.sectionLabel }}</div>
            <div class="account-profile-popover-stats">
              <div v-for="stat in accountProfile.stats" :key="stat.label">
                <strong>{{ stat.value }}</strong><span>{{ stat.label }}</span><small>{{ stat.detail }}</small>
              </div>
            </div>

            <div class="account-profile-popover-footer">
              <button type="button" class="g-btn secondary" @click="openAccountModal">
                <app-icon name="lock_reset"></app-icon>修改密码
              </button>
              <button type="button" class="g-btn secondary" @click="forgotPassword">
                <app-icon name="help"></app-icon>找回密码
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="g-body">
      <nav class="g-sidebar" :class="{collapsed: !isSidebarOpen, 'farmer-sidebar': isFarmer}">
        <div class="g-sidebar-main" :class="{ 'farmer-nav-main': isFarmer }">
          <button v-for="nav in mainNavItems" :key="nav.id" type="button"
               class="g-nav-item"
               :data-nav="nav.id"
               :class="{active: currentView === nav.id, 'farmer-nav-item': isFarmer}"
               :aria-current="currentView === nav.id ? 'page' : null"
               @click="navigate(nav.id)">
            <app-icon v-if="isFarmer" :name="nav.icon"></app-icon>
            <app-icon v-else :name="nav.icon"></app-icon>
            <span class="g-nav-label" :class="{ 'farmer-nav-label': isFarmer }">{{ nav.label }}</span>
          </button>
        </div>
        <div v-if="footerNavItems.length || isFarmer" class="g-sidebar-footer" :class="{ 'farmer-nav-footer': isFarmer }">
          <button v-for="nav in footerNavItems" :key="nav.id" type="button"
               class="g-nav-item"
               :data-nav="nav.id"
               :class="{active: currentView === nav.id, 'farmer-nav-item': isFarmer}"
               :aria-current="currentView === nav.id ? 'page' : null"
               @click="navigate(nav.id)">
            <app-icon :name="nav.icon"></app-icon>
            <span class="g-nav-label" :class="{ 'farmer-nav-label': isFarmer }">{{ nav.label }}</span>
          </button>
        </div>
      </nav>

      <main class="g-main" :class="{ 'farmer-main': isFarmer }">
        <transition name="fade" mode="out-in">
          <keep-alive include="AdminAiChatView">
            <component :is="currentViewComponent" :state="state" :user-settings="userSettings" :route-params="routeParams"
                       @navigate="navigate" @open-plot-detail="openPlotDetail"
                       @plot-change="applyPlotChange" @data-invalidated="handleDataInvalidated"
                       @context-changed="handleContextChanged"
                        @settings-changed="handleSettingsChanged"></component>
          </keep-alive>
        </transition>

        <plot-detail-modal v-if="selectedPlot" :plot="selectedPlot" :work-orders="state.workOrders" :state="state"
                           @close="closePlotDetail" @navigate="navigateFromPlotDetail"
                           @data-invalidated="handleDataInvalidated"></plot-detail-modal>

        <div v-if="showAccountModal" class="account-security-overlay" @click.self="closeAccountModal">
          <form class="account-security-card" @submit.prevent="changePassword">
            <div class="account-security-card-header">
              <div>
                <h2>修改密码</h2>
                <p>为 {{ accountProfile.username }} 更新登录密码。</p>
              </div>
              <button type="button" class="g-btn icon-only" title="关闭" aria-label="关闭" @click="closeAccountModal">
                <app-icon name="close"></app-icon>
              </button>
            </div>
            <div class="account-security-card-body">
              <label>当前密码<input v-model="passwordForm.current" type="password" autocomplete="current-password" required></label>
              <label>新密码<input v-model="passwordForm.next" type="password" autocomplete="new-password" minlength="8" required></label>
              <label>确认新密码<input v-model="passwordForm.confirm" type="password" autocomplete="new-password" minlength="8" required></label>
              <p v-if="passwordError" class="account-security-error">{{ passwordError }}</p>
            </div>
            <div class="account-security-card-footer">
              <button type="button" class="g-btn secondary" @click="closeAccountModal">取消</button>
              <button type="submit" class="g-btn primary">确认修改</button>
            </div>
          </form>
        </div>

        <div class="g-toast-container">
          <transition-group name="toast">
            <div v-for="toast in toasts" :key="toast.id" class="g-toast">
              <app-icon :name="toast.type === 'error' ? 'error' : 'check_circle'" :style="{color: toast.type === 'error' ? 'var(--g-danger)' : 'var(--g-success)'}"></app-icon>
              {{ toast.message }}
            </div>
          </transition-group>
        </div>
      </main>
    </div>
  </div>

  <!-- Dashboard Template -->
  <template id="tmpl-dashboard">
    <section v-if="isFarmAdmin" class="manager-dashboard" aria-labelledby="manager-dashboard-title">
      <header class="manager-dashboard-header">
        <div class="manager-dashboard-heading">
          <h1 id="manager-dashboard-title">农场总览</h1>
          <p>先看地块状态，再处理异常和农务。</p>
        </div>
        <div class="manager-dashboard-actions">
          <button type="button" class="g-btn primary manager-create-task" @click="createTask">
            <app-icon name="add_task"></app-icon>
            创建农务任务
          </button>
        </div>
      </header>

      <div class="manager-summary-strip" aria-label="今日农场概况">
        <button type="button" class="manager-summary-item" v-for="item in managerSummary" :key="item.id"
                :data-summary="item.id"
                :title="item.hint" :aria-label="`${item.label} ${item.value}，${item.hint}`"
                @click="openManagerSummary(item)">
          <span class="manager-summary-icon"><app-icon :name="item.icon"></app-icon></span>
          <span class="manager-summary-copy">
            <span>{{ item.label }}</span>
            <strong>{{ item.value }}</strong>
          </span>
        </button>
      </div>

      <div v-if="visiblePlots.length" class="manager-plot-grid" aria-label="地块状态和管理列表">
        <article v-for="plot in visiblePlots" :key="plot.plotId"
                 class="manager-plot-card" :class="[`is-${cardTone(plot)}`, { 'has-open-menu': plotMenuId === plot.plotId }]"
                 role="button" tabindex="0" :data-plot-card="plot.plotId"
                 :aria-label="`查看${plot.name}二维详情`"
                 @click="openPlotDetail(plot, $event)"
                 @keydown.enter.prevent="openPlotDetail(plot, $event)"
                 @keydown.space.prevent="openPlotDetail(plot, $event)">
          <header class="manager-plot-card-header">
            <div class="manager-plot-title">
              <h2>{{ plot.name }}</h2>
              <span>{{ plot.lastSeen || '—' }}</span>
            </div>
            <div class="manager-plot-card-tools">
              <span class="manager-lifecycle-status" :class="String(plot.status || 'ACTIVE').toLowerCase()">{{ String(plot.status || 'ACTIVE').toUpperCase() === 'INACTIVE' ? '已停用' : '使用中' }}</span>
              <div class="manager-health-score" :class="`is-${healthTone(plot)}`">综合健康 <strong>{{ healthScore(plot) }}</strong></div>
              <div class="manager-plot-actions" @click.stop>
                <button type="button" class="manager-more-button" :aria-expanded="plotMenuId === plot.plotId"
                        :aria-label="`${plot.name}地块操作`" @click.stop="togglePlotMenu(plot.plotId)">
                  <app-icon name="more_vertical"></app-icon>
                </button>
                <div v-if="plotMenuId === plot.plotId" class="manager-plot-menu" role="menu">
                  <button type="button" role="menuitem" @click="openEditPlot(plot)">
                    <app-icon name="edit"></app-icon><span>修改地块</span>
                  </button>
                  <button v-if="String(plot.status || 'ACTIVE').toUpperCase() !== 'INACTIVE'" type="button" role="menuitem" @click="deactivatePlot(plot)">
                    <app-icon name="block"></app-icon><span>停用地块</span>
                  </button>
                  <button v-else type="button" role="menuitem" @click="restorePlot(plot)">
                    <app-icon name="refresh"></app-icon><span>恢复地块</span>
                  </button>
                  <button v-if="String(plot.status || 'ACTIVE').toUpperCase() === 'INACTIVE'" type="button" class="is-danger" role="menuitem" @click="requestDeletePlot(plot)">
                    <app-icon name="delete"></app-icon><span>永久删除</span>
                  </button>
                </div>
              </div>
            </div>
          </header>
          <div class="manager-plot-context">
            <section class="manager-crop-identity" :data-crop="cropKeyFor(plot)" :aria-label="`${cropLabelFor(plot)}作物信息`">
              <span class="manager-crop-art" aria-hidden="true">
                {{ cropEmojiFor(plot) }}
              </span>
              <span class="manager-crop-copy">
                <span>作物种类</span>
                <strong>{{ cropLabelFor(plot) }}</strong>
                <small>{{ displayText(plot.cropVariety || '品种待补充') }}</small>
              </span>
            </section>
            <dl class="manager-plot-facts" aria-label="地块生长信息">
              <div><dt>设施类型</dt><dd>{{ plot.facilityLabel || facilityOptions.find(item => item.code === plot.facilityType)?.label || '露地（裸地）' }}</dd></div>
              <div><dt>地块面积</dt><dd>{{ plot.areaM2 ?? '—' }}㎡</dd></div>
              <div><dt>生长阶段</dt><dd>{{ plot.stageLabel || '—' }}</dd></div>
              <div><dt>种植状态</dt><dd>{{ plot.cultivationStatusLabel || '正常种植' }}</dd></div>
              <div><dt>最近作业</dt><dd>{{ plot.lastOperationLabel || '暂无记录' }}</dd></div>
              <div><dt>生长周期</dt><dd>{{ plot.growthCycleDays ? `${plot.growthCycleDays}天` : '—' }}</dd></div>
            </dl>
          </div>
          <div class="manager-metric-grid" aria-label="十一项环境与肥力指标">
            <div class="manager-metric" :class="`is-${metricTone(metric)}`" :data-metric="metric.code" v-for="metric in plotMetrics(plot)" :key="metric.code">
              <div class="manager-metric-label">
                <span class="manager-metric-name">
                  <span class="manager-metric-glyph"><app-icon :name="metricVisualIcon(metric)"></app-icon></span>
                  <span>{{ metric.label }}</span>
                </span>
                <app-icon class="manager-metric-state" :name="metricStatusIcon(metric)"></app-icon>
              </div>
              <div class="manager-metric-value">
                {{ formatMetric(metric) }} <small v-if="formatMetric(metric) !== '—'">{{ metric.unit }}</small>
              </div>
              <div class="manager-metric-target">靶标：{{ metric.target }}</div>
            </div>
          </div>
        </article>
        <button type="button" class="manager-plot-card manager-add-plot-card" @click="openCreatePlot">
          <span class="manager-add-plot-icon"><app-icon name="add"></app-icon></span>
          <strong>添加新地块</strong>
          <small>录入作物种类、生长周期和地块面积</small>
        </button>
      </div>
      <div v-if="!visiblePlots.length" class="simple-empty-state manager-plot-empty">
        <span class="manager-plot-empty-icon"><app-icon name="add_location_alt"></app-icon></span>
        <p class="manager-plot-empty-eyebrow">{{ managedFarm.name || '你的农场' }}{{ managedFarm.region ? ` · ${managedFarm.region}` : '' }}</p>
        <h2>添加第一块地，开始管理农场</h2>
        <p>录入真实地块资料后，它会进入总览、设备绑定和农务任务；系统不会复制示范农场的数据。</p>
        <button type="button" class="g-btn primary manager-first-plot-button" @click="openCreatePlot">
          <app-icon name="add"></app-icon>添加第一块地
        </button>
        <small>现在不添加也没关系，你可以稍后从农场总览继续。</small>
      </div>

      <div v-if="plotEditor.open" class="g-modal-overlay manager-plot-editor-overlay" @click.self="closePlotEditor">
        <form class="g-modal manager-plot-editor" role="dialog" aria-modal="true" @submit.prevent="submitPlot">
          <div class="g-modal-header">
            <div>
              <p>{{ plotEditor.mode === 'edit' ? '修改地块信息' : '新增地块' }}</p>
              <h2>{{ plotEditor.mode === 'edit' ? plotDraft.name : '添加一个新地块' }}</h2>
            </div>
            <button type="button" class="g-btn icon-only" aria-label="关闭" @click="closePlotEditor"><app-icon name="close"></app-icon></button>
          </div>
          <div class="g-modal-body manager-plot-form">
            <label class="g-form-group manager-form-span-2">
              <span class="g-form-label">地块名称 *</span>
              <input class="g-input" v-model.trim="plotDraft.name" maxlength="40" required placeholder="例如：C02 辣椒试验田">
            </label>
            <label class="g-form-group">
              <span class="g-form-label">作物种类 *</span>
              <select class="g-select" v-model="plotDraft.cropCode" required>
                <option v-for="crop in cropOptions" :key="crop.code" :value="crop.code">{{ crop.name }}</option>
              </select>
            </label>
            <label class="g-form-group">
              <span class="g-form-label">作物品种 *</span>
              <input class="g-input" v-model.trim="plotDraft.cropVariety" maxlength="40" required placeholder="例如：千禧水果番茄">
            </label>
            <label class="g-form-group">
              <span class="g-form-label">当前生长阶段 *</span>
              <select class="g-select" v-model="plotDraft.stageCode" required>
                <option v-for="stage in stageOptions" :key="stage.code" :value="stage.code">{{ stage.label }}</option>
              </select>
            </label>
            <label class="g-form-group">
              <span class="g-form-label">地块类型 *</span>
              <select class="g-select" v-model="plotDraft.facilityType" required>
                <option v-for="facility in facilityOptions" :key="facility.code" :value="facility.code">{{ facility.label }}</option>
              </select>
              <small>{{ facilityOptions.find(item => item.code === plotDraft.facilityType)?.description }}</small>
            </label>
            <label class="g-form-group">
              <span class="g-form-label">完整生长周期（天）*</span>
              <input class="g-input" type="number" v-model.number="plotDraft.growthCycleDays" min="1" max="1000" required>
            </label>
            <label class="g-form-group manager-form-span-2">

  <template id="tmpl-work-orders">

            <app-icon name="fact_check"></app-icon>录入巡田记录

        <div class="g-card flex items-center gap-4">

          <div>
            <div class="text-muted">待办任务总数</div>
            <div style="font-size:28px; font-weight:500">{{ state.workOrders.length }}</div>
          </div>
        </div>
        <div class="g-card flex items-center gap-4">
          <app-icon name="water_drop" style="font-size:40px; color:var(--g-success)"></app-icon>

              <span>{{ state.resourceProfile.remainingLitres }} 升余量</span>
            </div>
            <div style="width:100%; height:8px; background:var(--g-bg-subtle); border-radius:4px; overflow:hidden">
              <div style="height:100%; background:var(--g-success); width:75%"></div>
            </div>
          </div>
        </div>
        <div class="g-card flex items-center gap-4">
          <app-icon name="record_voice_over" style="font-size:40px; color:var(--g-warning)"></app-icon>

            <div class="text-muted">人工巡田报告</div>
            <div style="font-size:28px; font-weight:500">{{ state.inspections.length }}</div>

        </div>
      </div>

      <div class="g-grid g-grid-2">
        <div class="g-card" :class="{'highlight-pulse': highlightNewOrder}">
          <h3 class="mb-4">系统调度工单</h3>
          <table class="g-table">
            <thead><tr><th>任务</th><th>地块</th><th>状态</th><th>优先级</th></tr></thead>
            <tbody>
              <tr v-for="order in state.workOrders" :key="order.workOrderId">
                <td style="font-weight:500">
                  <div style="margin-bottom:4px">{{ order.title }}</div>
                  <div class="text-muted" style="font-size:12px">{{ order.reason }}</div>
                </td>
                <td>{{ order.plotId }}</td>
                <td><span class="g-badge" style="background:var(--g-bg-base); border:1px solid var(--g-border)">{{ workStatusLabel(order.status) }}</span></td>
                <td>
                  <span class="g-badge" :class="order.priority === 'HIGH' ? 'danger' : (order.priority==='MEDIUM'?'warning':'primary')">
                    {{ priorityLabel(order.priority) }}
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="g-card">
          <h3 class="mb-4">人工核验记录</h3>
          <div class="metric-box mb-4" v-for="ins in state.inspections" :key="ins.inspectionId">
            <div class="flex justify-between mb-2">
              <span style="font-weight:500">{{ ins.plotId }} · 巡田反馈</span>
              <span class="text-muted" style="font-size:12px">{{ new Date(ins.observedAt).toLocaleTimeString() }}</span>
            </div>
            <div class="g-grid g-grid-3 gap-2 mb-2">
              <div><span class="text-muted" style="font-size:12px">表层状况：</span>{{ inspectionObservationLabel('soil', ins.soilSurface) }}</div>
              <div><span class="text-muted" style="font-size:12px">植被：</span>{{ inspectionObservationLabel('crop', ins.cropCondition) }}</div>
              <div><span class="text-muted" style="font-size:12px">实测含水：</span>{{ ins.portableSoilMoisture }}%</div>
            </div>
            <div class="text-muted" style="font-size:13px; background:var(--g-bg-hover); padding:8px; border-radius:4px">

      <transition name="fade">
        <div class="g-modal-overlay" v-if="showWorkOrderModal" @click.self="showWorkOrderModal = false" @keydown.esc="showWorkOrderModal = false">

            <div class="g-modal-header">
              <div><p class="modal-context-label">新建任务</p><h3>创建农务任务</h3></div>
              <button type="button" class="g-btn icon-only" @click="showWorkOrderModal = false" aria-label="关闭创建任务窗口"><app-icon name="close"></app-icon></button>
            </div>
            <div class="g-modal-body task-create-grid">
              <div class="g-form-group span-2">
                <label class="g-form-label" for="task-title">任务标题</label>
                <input id="task-title" class="g-input" v-model="workOrderForm.title" maxlength="80" required placeholder="例如：复测 A01 土壤湿度">
              </div>
              <div class="g-form-group">
                <label class="g-form-label" for="task-plot">地块</label>
                <select id="task-plot" class="g-select" v-model="workOrderForm.plotId" required>
                  <option v-for="plot in state.plots" :key="plot.plotId" :value="plot.plotId">{{ plot.name }}</option>
                </select>
              </div>
              <div class="g-form-group">
                <label class="g-form-label" for="task-priority">优先级</label>
                <select id="task-priority" class="g-select" v-model="workOrderForm.priority">
                  <option value="HIGH">紧急</option><option value="MEDIUM">中</option><option value="LOW">普通</option>
                </select>
              </div>
              <div class="g-form-group">
                <label class="g-form-label" for="task-type">任务类型</label>
                <select id="task-type" class="g-select" v-model="workOrderForm.actionType">
                  <option value="SOWING">播种</option><option value="TRANSPLANTING">移栽</option><option value="FERTILIZATION">施肥</option><option value="PEST_CONTROL">植保</option><option value="WEEDING">除草</option><option value="PRUNING">整枝</option><option value="IRRIGATION">灌溉</option><option value="HARVEST">采收</option><option value="INSPECTION">巡田核验</option><option value="IRRIGATION_CHECK">灌溉巡检</option><option value="FIELD_OPERATION">田间作业</option><option value="DEVICE_CHECK">设备检查</option><option value="IRRIGATION_REVIEW">灌溉方案审批</option>
                </select>
              </div>
              <div class="g-form-group">
                <label class="g-form-label" for="task-due">截止时间</label>
                <input id="task-due" type="datetime-local" class="g-input" v-model="workOrderForm.dueAt" required>
              </div>
              <div class="g-form-group span-2">
                <label class="g-form-label" for="task-reason">执行说明</label>
                <textarea id="task-reason" class="g-input" rows="4" v-model="workOrderForm.reason" required placeholder="说明任务原因、验收标准或安全注意事项"></textarea>
              </div>
            </div>
            <div class="g-modal-footer">
              <button type="button" class="g-btn secondary" @click="showWorkOrderModal = false">取消</button>
              <button type="submit" class="g-btn primary">创建并进入待分配</button>
            </div>
          </form>
        </div>
      </transition>

      <!-- Add Inspection Modal -->
      <transition name="fade">
        <div class="g-modal-overlay" v-if="showFormModal" @click.self="showFormModal = false">
          <div class="g-modal">
            <div class="g-modal-header">
              <h3>录入人工巡田数据</h3>
              <button class="g-btn icon-only" @click="showFormModal = false" aria-label="关闭"><app-icon name="close"></app-icon></button>
            </div>
            <div class="g-modal-body">
              <div class="g-form-group">
                <label class="g-form-label">地块选择</label>
                <select class="g-select" v-model="form.plotId">
                  <option value="plot-a01">plot-a01 温室 1 号棚</option>
                  <option value="plot-b01">plot-b01 温室 3 号棚</option>
                </select>
              </div>
              <div class="g-form-group">
                <label class="g-form-label">表层状况</label>
                <input type="text" class="g-input" v-model="form.soilSurface" placeholder="例：干燥、湿润">
              </div>
              <div class="g-form-group">
                <label class="g-form-label">植被情况</label>
                <input type="text" class="g-input" v-model="form.cropCondition" placeholder="例：长势正常、叶片轻微萎蔫">
              </div>
              <div class="g-form-group">
                <label class="g-form-label">手持仪实测含水率 (%)</label>
                <input type="number" class="g-input" v-model="form.portableSoilMoisture">
              </div>
              <div class="g-form-group">
                <label class="g-form-label">备注说明</label>
                <input type="text" class="g-input" v-model="form.notes">
              </div>
            </div>
            <div class="g-modal-footer">
              <button class="g-btn secondary" @click="showFormModal = false">取消</button>
              <button class="g-btn primary" @click="submitInspection">提交核验</button>
            </div>
          </div>
        </div>
      </transition>
    </div>
  </template>

          </tr></thead>
          <tbody>
            <template v-for="record in filteredRecords" :key="record.traceId">
              <tr @click="togglePassport(record.traceId)" style="cursor:pointer">
                <td style="white-space:nowrap">{{ record.time }}</td>
                <td style="font-family:var(--g-mono);font-size:11px;color:var(--g-primary)">{{ record.traceId }}</td>
                <td><span class="status-pill agent">{{ record.operator }}</span></td>
                <td>{{ record.plotId }}</td>
                <td>{{ record.typeLabel }}</td>
                <td>{{ displayText(record.summary) }}</td>
                <td><span class="status-pill" :class="record.result === 'PASS' ? 'approved' : record.result === 'REJECT' ? 'rejected' : 'pending'">{{ record.result === 'PASS' ? '通过' : record.result === 'REJECT' ? '否决' : '待审' }}</span></td>
                <td><app-icon name="expand_more" style="font-size:18px;transition:transform 0.2s" :style="{transform: expandedPassport===record.traceId?'rotate(180deg)':''}"></app-icon></td>
              </tr>
              <!-- Decision Passport Expansion -->
              <tr v-if="expandedPassport === record.traceId">
                <td colspan="8" style="padding:0">
                  <div class="passport-panel">
                    <div class="passport-section">
                      <div class="passport-section-title">📌 触发源</div>
                      <dl class="passport-kv">
                        <dt>触发条件</dt><dd>{{ displayText(record.passport.trigger) }}</dd>
                        <dt>作物模型包</dt><dd>{{ record.passport.cropPack }}</dd>
                        <dt>规则版本</dt><dd>{{ record.passport.ruleVersion }}</dd>
                      </dl>
                    </div>
                    <div class="passport-section">
                      <div class="passport-section-title">🔍 检索证据</div>
                      <dl class="passport-kv">
                        <dt>知识检索引用</dt><dd>{{ record.passport.ragRef }}</dd>
                        <dt>相似案例</dt><dd>{{ record.passport.similarCase }}</dd>
                      </dl>
                    </div>
                    <div class="passport-section">
                      <div class="passport-section-title">🤖 智能助手推理</div>
                      <dl class="passport-kv">
                        <dt>诊断结论</dt><dd>{{ displayText(record.passport.diagnosis) }}</dd>
                        <dt>处方建议</dt><dd>{{ displayText(record.passport.prescription) }}</dd>
                        <dt>工具调用</dt><dd style="font-family:var(--g-mono);font-size:11px">{{ record.passport.toolCall }}</dd>
                      </dl>
                    </div>
                    <div class="passport-section">
                      <div class="passport-section-title">🛡️ 安全检查</div>
                      <dl class="passport-kv">
                        <dt>安全门</dt><dd>{{ displayText(record.passport.safetyGates) }}</dd>
                        <dt>风险等级</dt><dd>{{ levelLabel(record.passport.riskLevel) }}</dd>
                      </dl>
                    </div>
                    <div class="passport-section" v-if="record.passport.execution">
                      <div class="passport-section-title">✅ 执行与评价</div>
                      <dl class="passport-kv">
                        <dt>执行状态</dt><dd><span class="status-pill" :class="record.passport.execution.rawStatus === 'COMPLETED' || record.passport.execution.rawStatus === 'DONE' ? 'completed' : 'warning'">{{ record.passport.execution.statusLabel || localizedStatusLabel(record.passport.execution.rawStatus || record.passport.execution.status) }}</span></dd>
                        <dt>效果评价</dt><dd>{{ displayText(record.passport.execution.evaluation) }}</dd>

          </tbody>
        </table>
      </div>

  <!-- ADMIN: Simulator -->
  <template id="tmpl-admin-simulator">
    <div>
      <h2 class="g-page-title"><app-icon name="science"></app-icon> 仿真模拟</h2>

      <!-- Control Bar -->
      <div class="sim-control-bar">
        <span class="sim-status-dot" :class="simRunning ? 'running' : 'stopped'"></span>
        <div class="sim-info">
          <div class="sim-info-label">模拟器状态</div>
          <div class="sim-info-value">{{ simRunning ? '运行中' : '已停止' }}</div>
        </div>
        <div class="sim-info">
          <div class="sim-info-label">当前场景</div>
        <div class="sim-info-value">{{ scenarioLabel(state.adminOverview.simulator.scenario) }}</div>
        </div>
        <div class="sim-info">
          <div class="sim-info-label">已发送事件</div>
          <div class="sim-info-value">{{ state.adminOverview.simulator.eventsEmitted }}</div>
        </div>
        <div class="sim-info">
          <div class="sim-info-label">采样间隔</div>
          <div class="sim-info-value">{{ sampleInterval }} 秒</div>
        </div>
        <div class="sim-info">
          <div class="sim-info-label">时间流速</div>
          <div class="sim-info-value">{{ timeScale }}×</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="g-btn primary" v-if="!simRunning" :disabled="simBusy" @click="toggleSimulator">
            <app-icon name="play_arrow"></app-icon> 启动
          </button>
          <button class="g-btn danger" v-else :disabled="simBusy" @click="toggleSimulator">
            <app-icon name="stop"></app-icon> 停止
          </button>
        </div>
      </div>

      <div class="sim-settings-panel">
        <div class="admin-section-title" style="margin-bottom:12px"><app-icon name="tune"></app-icon> 全局采样与时间流速</div>
        <p class="sim-settings-help">保存即生效，不必重启 API。采样间隔控制墙上时钟多久产生一批遥测；时间流速控制物理日夜与土壤变化快慢。地块详情仍可单独覆盖流速。</p>
        <label class="sim-slider">
          <span class="sim-slider-label">采样间隔 {{ sampleInterval }} 秒</span>
          <input type="range" min="5" max="60" step="1" v-model.number="sampleInterval" :disabled="simBusy" @change="saveSimulatorSettings">
          <span class="sim-slider-hint">每隔多少墙上秒产生一批遥测（5–60 秒，默认 20）</span>
        </label>
        <label class="sim-slider">
          <span class="sim-slider-label">时间流速 {{ timeScale }}×</span>
          <input type="range" min="1" max="288" step="1" v-model.number="timeScale" :disabled="simBusy" @change="saveSimulatorSettings">
          <span class="sim-slider-hint">默认 144：10 分钟 ≈ 1 个模拟日（1–288 倍）</span>
        </label>
      </div>

      <!-- Scenario Selection -->
      <div class="admin-section-head">
        <div class="admin-section-title"><app-icon name="category"></app-icon> 场景配置矩阵</div>
        <div style="display:flex; gap: 8px; align-items: center">
          <span style="font-size: 13px; color: var(--g-text-secondary)">批量应用：</span>
          <select v-model="globalScenario" style="padding: 4px 8px; border-radius: var(--g-radius); border: 1px solid var(--g-border); background: var(--g-bg-base); color: var(--g-text-primary)">
            <option value="">-- 选择场景 --</option>
            <option v-for="sc in scenarios" :key="sc.id" :value="sc.id">{{ sc.icon }} {{ sc.label }}</option>
          </select>
        </div>
      </div>
      <div class="admin-table-wrap" style="margin-bottom: 24px">
        <table class="admin-table">
          <thead><tr>
            <th style="font-size:13px; color:var(--g-text-primary); font-weight:600">地块 ID</th>
            <th style="font-size:13px; color:var(--g-text-primary); font-weight:600">地块名称</th>
            <th style="font-size:13px; color:var(--g-text-primary); font-weight:600">当前种植</th>
            <th style="font-size:13px; color:var(--g-text-primary); font-weight:600">异常场景注入</th>
            <th style="font-size:13px; color:var(--g-text-primary); font-weight:600">模拟</th>
          </tr></thead>
          <tbody>
            <tr v-for="plot in plotScenarios" :key="plot.plotId">
              <td style="font-family:var(--g-mono);font-size:11px">{{ plot.plotId }}</td>
              <td style="font-weight:500">{{ plot.name }}</td>
              <td><span class="status-pill info">{{ plot.cropName }}</span></td>
              <td>
                <select v-model="plot.scenario" style="width:100%; max-width: 200px; padding: 6px; border-radius: var(--g-radius); border: 1px solid var(--g-border); background: var(--g-bg-base); color: var(--g-text-primary)">
                  <option v-for="sc in scenarios" :key="sc.id" :value="sc.id">{{ sc.icon }} {{ sc.label }}</option>
                </select>
              </td>
              <td>
                <button v-if="plot.enabled !== false" class="g-btn text sm" style="font-size:12px" :disabled="simBusy" @click="togglePlotSimulation(plot)">
                  <app-icon name="stop" style="font-size:16px"></app-icon> 停止
                </button>
                <button v-else class="g-btn text sm" style="font-size:12px" :disabled="simBusy" @click="togglePlotSimulation(plot)">
                  <app-icon name="play_arrow" style="font-size:16px"></app-icon> 启动
                </button>
              </td>
            </tr>
            <tr v-if="!plotScenarios || plotScenarios.length === 0">
              <td colspan="5" style="text-align:center;color:var(--g-text-secondary);padding:24px">无可用地块数据</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Scenario matrix actions -->
      <div class="admin-section-actions" style="display:flex; align-items:center; gap:12px; margin-bottom:24px">
        <button class="g-btn primary" :disabled="simBusy" @click="applyPlotScenarios">
          <app-icon name="save"></app-icon> 保存场景配置
        </button>
        <span style="font-size:12px;color:var(--g-text-secondary)">保存后后端模拟器将按各地块所选场景生成遥测数据，刷新后保留。</span>
      </div>

      <!-- History -->
      <div class="admin-section-head">
        <div class="admin-section-title"><app-icon name="history"></app-icon> 运行历史</div>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr>
            <th>场景编号</th><th>场景类型</th><th>开始时间</th><th>结束时间</th><th>事件数</th><th>状态</th><th>操作</th>
          </tr></thead>
          <tbody>
            <tr v-for="run in state.adminSimHistory" :key="run.scenarioId">
              <td style="font-family:var(--g-mono);font-size:11px">{{ run.scenarioId }}</td>
              <td>{{ run.typeLabel || scenarioLabel(run.type) }}</td>
              <td>{{ run.startTime }}</td>
              <td>{{ run.endTime || '—' }}</td>
              <td>{{ run.events }}</td>
              <td><span class="status-pill" :class="run.status === 'COMPLETED' ? 'completed' : run.status === 'RUNNING' ? 'info' : 'warning'">{{ run.statusLabel || localizedStatusLabel(run.status) }}</span></td>
              <td class="admin-action-cell">
                <button class="g-btn text sm" @click="openDualTrack(run)"><app-icon name="compare_arrows"></app-icon> 双轨对比</button>
                <button class="g-btn text sm" @click="openReplay(run)"><app-icon name="replay"></app-icon> 回放</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Dual-track comparison modal -->
      <div class="admin-modal-overlay" v-if="adminDualTrackModal" @click.self="adminDualTrackModal = false">
        <div class="admin-modal admin-modal-wide">
          <div class="admin-modal-header">
            <h3>双轨对比 · {{ selectedDualTrackScenario }}</h3>
            <button class="g-btn icon-only" @click="adminDualTrackModal = false"><app-icon name="close"></app-icon></button>
          </div>
          <div class="admin-modal-body"><div id="adminDualTrackChart" class="admin-dual-chart"></div></div>
        </div>
      </div>

      <!-- Scenario replay modal -->
      <div class="admin-modal-overlay" v-if="adminReplayModal" @click.self="adminReplayModal = false">
        <div class="admin-modal">
          <div class="admin-modal-header">
            <h3>场景回放 · {{ selectedReplayScenario }}</h3>
            <button class="g-btn icon-only" @click="adminReplayModal = false"><app-icon name="close"></app-icon></button>
          </div>
          <div class="admin-modal-body">
            <ol class="admin-replay-timeline">
              <li v-for="event in replayEvents" :key="event.time + event.action">
                <span class="admin-replay-time">{{ event.time }}</span>
                <span class="admin-replay-node"></span>
                <span><strong>{{ event.action }}</strong><small>{{ event.agent }}</small></span>
              </li>
            </ol>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ADMIN: Rules & Versions -->
  <template id="tmpl-admin-rules">
    <div>
      <h2 class="g-page-title"><app-icon name="rule_folder"></app-icon> 规则与版本</h2>

      <div class="admin-tabs">
        <button class="admin-tab" :class="{active: activeTab === 'packs'}" @click="activeTab = 'packs'">作物模型包</button>
        <button class="admin-tab" :class="{active: activeTab === 'rules'}" @click="activeTab = 'rules'">规则集</button>
        <button class="admin-tab" :class="{active: activeTab === 'candidates'}" @click="activeTab = 'candidates'">策略候选</button>
      </div>

      <!-- Tab: Crop Packs -->
      <div v-if="activeTab === 'packs'">
        <div class="admin-pack-toolbar">
          <div class="admin-pack-hint">已发布且允许种植的作物包会出现在新地块创建表单中，保存后农场管理员与农户会自动读取同一版本</div>
          <button class="g-btn primary" :disabled="savingPack" @click="openCreatePack"><app-icon name="add"></app-icon> 新增作物包</button>
        </div>
        <div class="pack-grid" :style="{ gridTemplateColumns: `repeat(${masonryCols}, 1fr)` }">
          <div class="pack-grid-column" v-for="(colPacks, colIdx) in masonryColumns" :key="colIdx">
            <div class="pack-card" v-for="pack in colPacks" :key="packKey(pack)" @click="togglePack(packKey(pack))">
            <div class="pack-card-head">
              <span class="pack-card-icon">{{ pack.icon }}</span>
              <div>
                <div class="pack-card-title">{{ pack.name }}</div>
                <div class="pack-card-ver">v{{ pack.version || '1.0.0' }} · {{ pack.status === 'published' ? '已发布' : '草稿' }}</div>
              </div>
              <span class="status-pill" :class="pack.status" style="margin-left:auto">{{ pack.status === 'published' ? '已发布' : '草稿' }}</span>
            </div>
            <div class="pack-card-stats">
              <span><app-icon name="timeline" style="font-size:14px"></app-icon> {{ pack.stages.length }} 个阶段</span>
              <span><app-icon name="speed" style="font-size:14px"></app-icon> 统一八项遥测</span>
              <span><app-icon name="menu_book" style="font-size:14px"></app-icon> {{ pack.knowledgeDocs.length }} 篇知识</span>
            </div>
            <div class="admin-pack-availability" :class="{enabled: pack.availableForPlanting && pack.status === 'published'}">
              <app-icon :name="pack.availableForPlanting && pack.status === 'published' ? 'check_circle' : 'block'"></app-icon>
              {{ pack.availableForPlanting && pack.status === 'published' ? '可供新地块选择' : '暂不可用于新地块' }}
            </div>

            <div v-if="expandedPacks[packKey(pack)]" style="margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--g-border-subtle); font-size: 12px; color: var(--g-text-secondary); cursor: default;" @click.stop>
              <div class="admin-pack-detail-grid">
                <div><strong>生长阶段</strong><span>{{ pack.stages.join('、') }}</span></div>
                <div><strong>指标</strong><span>统一八项后端遥测指标，由地块配置监测类型</span></div>
                <div><strong>知识文档</strong><div class="admin-knowledge-docs"><article v-for="(doc, index) in pack.knowledgeDocs" :key="doc.id || index" class="admin-knowledge-doc"><button class="admin-knowledge-doc-toggle" @click="toggleKnowledge(packKey(pack), index)"><span><b>{{ displayText(doc.title || `知识文档 ${index + 1}`) }}</b><small v-if="doc.stageCode">{{ displayText(doc.stageCode) }}</small></span><app-icon :name="expandedKnowledge === `${packKey(pack)}:${index}` ? 'expand_less' : 'expand_more'"></app-icon></button><p v-if="expandedKnowledge === `${packKey(pack)}:${index}`">{{ displayText(doc.content || '暂无正文') }}</p></article><span v-if="!pack.knowledgeDocs.length" class="admin-knowledge-empty">暂无知识文档</span></div></div>
              </div>
              <div style="margin-top: 12px; display: flex; gap: 8px;">
                <button class="g-btn text sm" style="padding: 4px 8px" :disabled="savingPack" @click="openEditPack(pack)"><app-icon name="edit"></app-icon>编辑</button>
                <button class="g-btn text sm" style="padding: 4px 8px" :disabled="savingPack" @click="togglePackStatus(pack)">{{ pack.status === 'published' ? '转为草稿' : '发布' }}</button>
                <button v-if="canDeletePack(pack)" class="g-btn text sm danger-text" style="padding: 4px 8px" :disabled="savingPack" @click="deletePack(pack)"><app-icon name="delete"></app-icon>删除</button>
              </div>
            </div>
          </div>
          </div>
        </div>

        <div class="admin-modal-overlay" v-if="showPackModal" @click.self="showPackModal = false">
          <div class="admin-modal">
            <div class="admin-modal-header">
              <h3>{{ editingPackId ? '编辑作物包' : '新增作物包' }}</h3>
              <button class="g-btn icon-only" :disabled="savingPack" @click="showPackModal = false"><app-icon name="close"></app-icon></button>
            </div>
            <div class="admin-modal-body admin-pack-form">
              <label>作物包编号</label><input v-model="packForm.id" :disabled="!!editingPackId || savingPack" placeholder="例如 cp-lettuce">
              <label>版本号</label><input v-model="packForm.version" :disabled="!!editingPackId || savingPack" placeholder="例如 1.0.0">
              <label>作物名称</label><input v-model="packForm.name" placeholder="例如 生菜">
              <label>作物图标</label>
              <div class="admin-icon-picker"><button v-for="icon in cropIcons" :key="icon" type="button" :class="{selected: packForm.icon === icon}" @click="packForm.icon = icon">{{ icon }}</button></div>
              <label>生长阶段（每行一个）</label><textarea :value="packForm.stages.join('\n')" @input="packForm.stages = $event.target.value.split('\n')" rows="4"></textarea>
              <label>知识子文档</label>
              <div class="admin-doc-editor" v-for="(doc, index) in packForm.knowledgeDocs" :key="index"><input v-model="doc.title" placeholder="子文档标题"><textarea v-model="doc.content" rows="3" placeholder="正文内容"></textarea><button type="button" class="g-btn text sm danger-text" @click="removeKnowledgeDoc(index)"><app-icon name="delete"></app-icon>删除子文档</button></div>
              <button type="button" class="g-btn text sm" @click="addKnowledgeDoc"><app-icon name="add"></app-icon>添加知识子文档</button>
              <div class="admin-form-grid">
                <div><label>发布状态</label><select v-model="packForm.status"><option value="draft">草稿</option><option value="published">已发布</option></select></div>
              </div>
              <label class="admin-checkbox"><input type="checkbox" v-model="packForm.availableForPlanting"> 允许新地块选择此作物</label>
            </div>
            <div class="admin-modal-footer">
              <button class="g-btn" @click="showPackModal = false">取消</button>
              <button class="g-btn primary" :disabled="savingPack || !packForm.id || !packForm.name" @click="savePack">{{ savingPack ? '保存中…' : '保存' }}</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab: Rules -->
      <div v-if="activeTab === 'rules'">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr>
              <th>规则编号</th><th>描述</th><th>类型</th><th>版本</th><th>状态</th>
            </tr></thead>
            <tbody>
              <tr v-for="rule in state.adminRules" :key="rule.id">
                <td style="font-family:var(--g-mono);font-size:12px">{{ rule.id }}</td>
                <td>{{ displayText(rule.description) }}</td>
                <td><span class="status-pill info">{{ rule.typeLabel || rule.type }}</span></td>
                <td>v{{ rule.version }}</td>
                <td><span class="status-pill" :class="rule.status">{{ rule.status === 'published' ? '已发布' : '草稿' }}</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Tab: Strategy Candidates -->
      <div v-if="activeTab === 'candidates'">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr>
              <th>候选编号</th><th>来源</th><th>描述</th><th>离线验证</th><th>状态</th><th>操作</th>
            </tr></thead>
            <tbody>
              <tr v-for="cand in state.adminStrategyCandidates" :key="cand.id">
                <td style="font-family:var(--g-mono);font-size:12px">{{ cand.id }}</td>
                <td><span class="status-pill" :class="cand.source === 'learning' ? 'agent' : 'info'">{{ cand.sourceLabel || (cand.source === 'learning' ? '案例学习' : '人工录入') }}</span></td>
                <td>{{ displayText(cand.description) }}</td>
                <td><span class="status-pill" :class="cand.status">{{ cand.statusLabel || ({pending:'待验证',verified:'已验证',approved:'已批准',rejected:'已拒绝'}[cand.status] || '未知') }}</span></td>
                <td>
                  <button v-if="cand.status==='verified'" class="g-btn text sm" @click="transitionCandidate(cand, 'APPROVED')">批准</button>
                  <button v-if="cand.status==='verified'" class="g-btn text sm" style="color:var(--g-danger)" @click="transitionCandidate(cand, 'REJECTED')">拒绝</button>
                  <button v-if="cand.status==='active'" class="g-btn text sm" style="color:var(--g-danger)" @click="transitionCandidate(cand, 'ROLLED_BACK')">回滚</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <!-- Shared: Workspace Settings -->
  <template id="tmpl-settings">
    <section class="settings-page" aria-labelledby="settings-page-title">
      <header class="settings-page-header">
        <div>
          <span class="settings-kicker">{{ roleLabel }} · 个人偏好</span>
          <h1 id="settings-page-title"><app-icon name="settings"></app-icon> 工作台设置</h1>
          <p>自定义当前浏览器中的外观、信息密度和数据刷新方式。设置即时生效，不会修改服务器上的业务数据。</p>
        </div>
        <span class="settings-local-badge"><app-icon name="lock_reset"></app-icon> 仅本机保存</span>
      </header>

      <div class="settings-grid">
        <article class="g-card settings-card">
          <div class="settings-card-head"><div><span class="settings-card-kicker">显示外观</span><h2>主题与颜色</h2><p>让三种角色的工作台保持清晰统一，也可以按个人习惯调整。</p></div><app-icon name="tune"></app-icon></div>
          <div class="settings-field">
            <span class="settings-label">主题</span>
            <div class="settings-theme-options" role="group" aria-label="选择主题">
              <button v-for="theme in themeOptions" :key="theme.value" type="button" class="settings-theme-option" :class="{active: settings.theme === theme.value}" @click="updateSetting('theme', theme.value)"><span class="settings-theme-icon"><app-icon :name="theme.value === 'dark' ? 'dark_mode' : theme.value === 'light' ? 'light_mode' : 'settings'"></app-icon></span><strong>{{ theme.label }}</strong><small>{{ theme.hint }}</small></button>
            </div>
          </div>
          <div v-if="state.currentUser?.role === 'FARM_ADMIN'" class="settings-field">
            <span class="settings-label">工作台主题</span>
            <div class="settings-preset-grid" role="group" aria-label="选择工作台主题">
              <button v-for="preset in presetOptions" :key="preset.value" type="button" class="settings-preset-option" :class="['preset-' + preset.value, {active: settings.preset === preset.value}]" @click="updateSetting('preset', preset.value)"><span class="settings-preset-preview"><i></i><b></b><em></em></span><span class="settings-preset-copy"><strong>{{ preset.label }}</strong><small>{{ preset.hint }}</small></span><app-icon v-if="settings.preset === preset.value" name="check_circle"></app-icon></button>
            </div>
          </div>
          <div class="settings-field">
            <span class="settings-label">卡片风格</span>
            <div class="settings-theme-options settings-surface-options" role="group" aria-label="选择卡片风格">
              <button v-for="surface in surfaceStyleOptions" :key="surface.value" type="button" class="settings-theme-option settings-surface-option" :data-style="surface.value" :data-surface-style="surface.value" :class="{active: settings.surfaceStyle === surface.value}" @click="updateSetting('surfaceStyle', surface.value)"><span class="settings-theme-icon"><app-icon :name="surface.value === 'classic' ? 'grid_view' : surface.value === 'glass-latest' ? 'auto_awesome' : 'tune'"></app-icon></span><strong>{{ surface.label }}</strong><small>{{ surface.hint }}</small></button>
            </div>
          </div>
          <div class="settings-field">
            <span class="settings-label">强调色</span>
            <div class="settings-accent-options" role="group" aria-label="选择强调色">
              <button v-for="accent in accentOptions" :key="accent.value" type="button" class="settings-accent-option" :class="{active: settings.accent === accent.value && !settings.customAccent}" :style="{'--settings-swatch': accent.color}" @click="updateSetting('accent', accent.value)"><i></i><span>{{ accent.label }}</span><app-icon v-if="settings.accent === accent.value && !settings.customAccent" name="check_circle"></app-icon></button>
              <label v-if="state.currentUser?.role === 'FARM_ADMIN'" class="settings-custom-accent" :class="{active: !!settings.customAccent}" title="自定义主题色"><input type="color" :value="settings.customAccent || '#2f7d55'" @input="updateSetting('customAccent', $event.target.value)"><span>自定义</span><app-icon v-if="settings.customAccent" name="check_circle"></app-icon></label>
            </div>
          </div>
          <div v-if="state.currentUser?.role === 'FARM_ADMIN'" class="settings-field settings-preview-field">
            <span class="settings-label">实时预览</span>
            <div class="settings-live-preview"><div class="settings-preview-rail"><span></span><span></span><span></span></div><div class="settings-preview-body"><div class="settings-preview-toolbar"><i></i><i></i><b></b></div><div class="settings-preview-cards"><div></div><div></div><div></div></div><div class="settings-preview-line"></div></div><div class="settings-preview-caption"><strong>{{ presetLabel }}</strong><span>当前主题会同步到农场管理员工作台</span></div></div>
          </div>
          <div class="settings-two-col">
            <label>显示密度<select :value="settings.density" @change="updateSetting('density', $event.target.value)"><option value="comfortable">舒适</option><option value="compact">紧凑</option></select></label>
            <label>内容宽度<select :value="settings.layout" @change="updateSetting('layout', $event.target.value)"><option value="standard">标准</option><option value="wide">宽屏</option></select></label>
          </div>
          <div v-if="state.currentUser?.role === 'FARM_ADMIN'" class="settings-field"><label>界面字体<select :value="settings.fontFamily" @change="updateSetting('fontFamily', $event.target.value)"><option v-for="item in fontOptions" :key="item.value" :value="item.value">{{ item.label }}</option></select><small class="settings-field-hint">选择适合当前设备和阅读习惯的字体。</small></label></div>
          <label class="settings-switch"><input type="checkbox" :checked="settings.reducedMotion" @change="updateSetting('reducedMotion', $event.target.checked)"><span class="settings-switch-track"></span><span><strong>减少动效</strong><small>减少过渡和动画，适合低性能设备或对动效敏感时使用。</small></span></label>
        </article>

        <article class="g-card settings-card">
          <div class="settings-card-head"><div><span class="settings-card-kicker">数据体验</span><h2>刷新与提示</h2><p>控制工作台如何更新信息，以及是否保留来源标识。</p></div><app-icon name="sync"></app-icon></div>
          <label class="settings-switch"><input type="checkbox" :checked="settings.autoRefresh" @change="updateSetting('autoRefresh', $event.target.checked)"><span class="settings-switch-track"></span><span><strong>自动刷新工作台</strong><small>保持页面打开时拉取最新任务、遥测和建议。</small></span></label>
          <label class="settings-select-field">刷新间隔<select :value="settings.refreshInterval" :disabled="!settings.autoRefresh" @change="updateSetting('refreshInterval', Number($event.target.value))"><option v-for="seconds in refreshOptions" :key="seconds" :value="seconds">{{ seconds }} 秒</option></select></label>
          <label class="settings-switch"><input type="checkbox" :checked="settings.showDataOrigin" @change="updateSetting('showDataOrigin', $event.target.checked)"><span class="settings-switch-track"></span><span><strong>显示数据来源</strong><small>保留模拟、后端或人工记录标识，便于核对信息。</small></span></label>
          <div class="settings-info"><app-icon name="info"></app-icon><p>外观和工作台偏好只写入当前浏览器的本地存储。系统管理员的账号、规则、模拟策略等平台配置仍在“系统管理”中维护。</p></div>
        </article>
      </div>

      <footer class="settings-footer"><div><strong>当前设置</strong><span>{{ presetLabel }} · 主题：{{ themeLabel }} · 卡片：{{ surfaceStyleLabel }} · 强调色：{{ settings.customAccent || accentLabel }} · {{ fontLabel }}</span></div><button type="button" class="g-btn secondary" @click="resetSettings"><app-icon name="replay"></app-icon>恢复默认设置</button></footer>
    </section>
  </template>

  <!-- ADMIN: System Settings -->
  <template id="tmpl-admin-settings">
    <div>
      <h2 class="g-page-title"><app-icon name="admin_panel_settings"></app-icon> 系统管理</h2>

      <div class="admin-tabs">
        <button class="admin-tab" :class="{active: activeTab === 'users'}" @click="activeTab = 'users'">账号管理</button>
        <button class="admin-tab" :class="{active: activeTab === 'permissions'}" @click="activeTab = 'permissions'">权限矩阵</button>
        <button class="admin-tab" :class="{active: activeTab === 'config'}" @click="activeTab = 'config'">系统配置</button>
        <button class="admin-tab" :class="{active: activeTab === 'appearance'}" @click="activeTab = 'appearance'">界面风格</button>
        <button class="admin-tab" :class="{active: activeTab === 'logs'}" @click="activeTab = 'logs'">操作审计日志</button>
      </div>

      <!-- Tab: Appearance Management -->
      <div v-if="activeTab === 'appearance'" class="admin-appearance-management">
        <section class="admin-appearance-intro">
          <span class="admin-appearance-intro-icon"><app-icon name="tune"></app-icon></span>
          <div>
            <span class="admin-section-kicker">默认基线 · main@4e9326a</span>
            <h3>农场管理员经典界面</h3>
            <p>默认使用 main@4e9326a 农场管理员的白色玻璃卡片和紧凑导航。main@c9b6282 之后新增的玻璃材质集中在这里管理，切换后立即作用于当前浏览器。</p>
          </div>
          <span class="admin-appearance-current"><app-icon name="check_circle"></app-icon>{{ appearanceStyleLabel }}</span>
        </section>

        <div class="admin-appearance-section-title"><span>默认风格</span><small>新用户和“恢复默认设置”会使用此风格</small></div>
        <button type="button" class="admin-appearance-option is-default" :class="{active: appearanceSettings.surfaceStyle === 'classic'}" data-surface-style="classic" @click="selectAppearanceStyle('classic')">
          <span class="admin-appearance-option-icon"><app-icon name="grid_view"></app-icon></span>
          <span><strong>经典卡片</strong><small>农场管理员纯色卡片基线 · 清晰边框、紧凑信息层级</small></span>
          <app-icon v-if="appearanceSettings.surfaceStyle === 'classic'" name="check_circle" class="admin-appearance-check"></app-icon>
        </button>

        <div class="admin-appearance-section-title"><span>新版风格（管理）</span><small>来自 c9b6282 及后续版本，可随时切换</small></div>
        <div class="admin-appearance-grid">
          <button v-for="surface in appearanceStyleOptions" :key="surface.value" type="button" class="admin-appearance-option" :class="{active: appearanceSettings.surfaceStyle === surface.value}" :data-surface-style="surface.value" @click="selectAppearanceStyle(surface.value)">
            <span class="admin-appearance-option-icon"><app-icon :name="surface.value === 'glass-latest' ? 'auto_awesome' : 'tune'"></app-icon></span>
            <span><strong>{{ surface.label }}</strong><small>{{ surface.hint }}</small></span>
            <app-icon v-if="appearanceSettings.surfaceStyle === surface.value" name="check_circle" class="admin-appearance-check"></app-icon>
          </button>
        </div>

        <div class="admin-appearance-footer">
          <p><app-icon name="info"></app-icon>外观偏好保存在当前浏览器，不会修改农场数据、账号权限或模拟策略。</p>
          <button type="button" class="g-btn secondary" @click="resetAppearanceStyle"><app-icon name="replay"></app-icon>恢复经典默认</button>
        </div>
      </div>

      <!-- Tab: Users -->
      <div v-if="activeTab === 'users'">
        <div class="admin-filter-bar">
          <select v-model="roleFilter">
            <option value="all">全部角色</option>
            <option value="SYSTEM_ADMIN">系统管理员</option>
            <option value="FARM_ADMIN">农场管理员</option>
            <option value="FARMER">种植农户</option>
          </select>
          <div style="margin-left:auto">
            <button class="g-btn primary" @click="showCreateUser = true">
              <app-icon name="person_add"></app-icon> 创建用户
            </button>
          </div>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr>
              <th>用户编号</th><th>用户名</th><th class="admin-user-role">角色</th><th>所属农场</th><th>关联地块</th><th class="admin-user-status">状态</th><th>创建时间</th><th>操作</th>
            </tr></thead>
            <tbody>
              <tr v-for="u in filteredUsers" :key="u.userId">
                <td style="font-family:var(--g-mono);font-size:11px">{{ u.userId }}</td>
                <td style="font-weight:500">{{ u.username }}</td>
                <td class="admin-user-role"><span class="status-pill" :class="u.role === 'SYSTEM_ADMIN' ? 'audit' : u.role === 'FARM_ADMIN' ? 'info' : 'completed'">{{ u.roleLabel }}</span></td>
                <td>{{ u.farmName }}</td>
                <td>{{ u.plotIds.join(', ') }}</td>
                <td class="admin-user-status"><span class="status-pill" :class="u.enabled ? 'enabled' : 'disabled'">{{ u.enabled ? '启用' : '停用' }}</span></td>
                <td>{{ u.createdAt }}</td>
                <td>
                  <button class="g-btn text sm" @click="toggleUser(u)">{{ u.enabled ? '停用' : '启用' }}</button>
                  <button class="g-btn text sm" style="color:var(--g-danger)" @click="deleteUser(u.userId)">删除</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Create User Modal -->
        <div class="admin-modal-overlay" v-if="showCreateUser" @click.self="showCreateUser = false">
          <div class="admin-modal">
            <div class="admin-modal-header">
              <h3>创建用户</h3>
              <button class="g-btn icon-only" @click="showCreateUser = false"><app-icon name="close"></app-icon></button>
            </div>
            <div class="admin-modal-body">
              <label>用户名</label>
              <input type="text" v-model="newUser.username" placeholder="4-32位字母数字">
              <label>密码</label>
              <input type="password" v-model="newUser.password" placeholder="8位以上，含字母和数字">
              <label>角色</label>
              <select v-model="newUser.role">
                <option value="FARMER">种植农户</option>
                <option value="FARM_ADMIN">农场管理员</option>
                <option value="SYSTEM_ADMIN">系统管理员</option>
              </select>
              <label>关联农场</label>
              <select v-model="newUser.farmId">
                <option value="farm-demo">农智示范农场</option>
              </select>
            </div>
            <div class="admin-modal-footer">
              <button class="g-btn" @click="showCreateUser = false">取消</button>
              <button class="g-btn primary" @click="createUser">确认创建</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab: Permissions -->
      <div v-if="activeTab === 'permissions'">
        <div class="admin-table-wrap">
          <table class="perm-matrix">
            <thead><tr>
              <th>功能模块</th><th>种植农户</th><th>农场管理员</th><th>系统管理员</th>
            </tr></thead>
            <tbody>
              <tr v-for="perm in permissionMatrix" :key="perm.module">
                <td v-html="formatPerm(perm.module)"></td>
                <td v-html="formatPerm(perm.farmer)"></td>
                <td v-html="formatPerm(perm.farmAdmin)"></td>
                <td v-html="formatPerm(perm.sysAdmin)"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Tab: Config -->
      <div v-if="activeTab === 'config'">
        <div class="g-grid" style="grid-template-columns: 1fr 1fr; gap: 20px">
          <div class="g-card" style="padding:20px">
            <div class="admin-section-title" style="margin-bottom:16px"><app-icon name="head_circuit"></app-icon> 智能模型运行模式</div>
            <select v-model="state.adminOverview.aiMode" style="width:100%;padding:10px;border:1px solid var(--g-border);border-radius:var(--g-radius);background:var(--g-bg-base);color:var(--g-text-primary);font-size:14px">
              <option value="full">完整模式（智能模型 + 知识检索 + 规则）</option>
              <option value="rules-only">规则兜底（仅确定性规则）</option>
              <option value="mock">模拟模式（固定输出）</option>
            </select>
          </div>
          <div class="g-card" style="padding:20px">
            <div class="admin-section-title" style="margin-bottom:16px"><app-icon name="tune"></app-icon> 设备参数</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px">
              <div><label style="display:block;color:var(--g-text-secondary);margin-bottom:4px">心跳超时（秒）</label><input type="number" value="120" style="width:100%;padding:8px;border:1px solid var(--g-border);border-radius:var(--g-radius);background:var(--g-bg-base);color:var(--g-text-primary)"></div>
              <div><label style="display:block;color:var(--g-text-secondary);margin-bottom:4px">命令冷却窗口（秒）</label><input type="number" value="60" style="width:100%;padding:8px;border:1px solid var(--g-border);border-radius:var(--g-radius);background:var(--g-bg-base);color:var(--g-text-primary)"></div>
              <div><label style="display:block;color:var(--g-text-secondary);margin-bottom:4px">灌溉上限（升/次）</label><input type="number" value="100" style="width:100%;padding:8px;border:1px solid var(--g-border);border-radius:var(--g-radius);background:var(--g-bg-base);color:var(--g-text-primary)"></div>
              <div><label style="display:block;color:var(--g-text-secondary);margin-bottom:4px">数据保留（天）</label><input type="number" value="90" style="width:100%;padding:8px;border:1px solid var(--g-border);border-radius:var(--g-radius);background:var(--g-bg-base);color:var(--g-text-primary)"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab: Audit Logs -->
      <div v-if="activeTab === 'logs'">
        <div class="admin-filter-bar">
          <select v-model="logFilter">
            <option value="all">全部操作</option>
            <option value="LOGIN">登录</option>
            <option value="USER_CREATE">创建用户</option>
            <option value="CONFIG_CHANGE">修改配置</option>
            <option value="RULE_PUBLISH">发布规则</option>
          </select>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr>
              <th>时间</th><th>操作人</th><th>操作类型</th><th>详情</th><th>IP 地址</th>
            </tr></thead>
            <tbody>
              <tr v-for="log in filteredLogs" :key="log.id">
                <td style="white-space:nowrap">{{ log.time }}</td>
                <td style="font-weight:500">{{ log.operator }}</td>
                <td><span class="status-pill" :class="log.action === 'LOGIN' ? 'info' : log.action === 'CONFIG_CHANGE' ? 'warning' : 'audit'">{{ log.actionLabel }}</span></td>
                <td>{{ displayText(log.detail) }}</td>
                <td style="font-family:var(--g-mono);font-size:11px">{{ log.ip }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>
</body>
</html>
