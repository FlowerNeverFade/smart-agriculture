<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriLoop · 农智闭环工作台</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%231e8e3e" d="M12 2C7 6 4 9.5 4 13.6 4 18.2 7.6 21.5 12 22c4.4-.5 8-3.8 8-8.4C20 9.5 17 6 12 2Z"/></svg>' />
</head>
<body>
  <div class="app">
    <!-- 左侧导航 -->
    <nav class="rail" aria-label="主导航">
      <div class="rail-logo" id="railLogo"></div>
      <div class="rail-nav" id="railNav"></div>
      <div class="rail-bottom" id="railBottom"></div>
    </nav>

    <div class="main-col">
      <!-- 顶栏 -->
      <header class="topbar">
        <h1 id="viewTitle">地块选择</h1>
        <div class="spacer"></div>
        <label class="search-box" id="searchBox"></label>
        <button class="icon-btn" id="bellBtn" aria-label="告警通知"></button>
        <button class="user-chip" id="userChip" aria-label="用户菜单"></button>
      </header>

      <!-- 地块选择条（仅地块视图） -->
      <div class="plot-bar" id="plotBar"></div>

      <div class="content-wrap">
        <main class="content" id="view"></main>
        <aside class="sys-rail" id="sysRail" aria-label="系统信息"></aside>
      </div>
    </div>
  </div>

  <script src="vendor/echarts.min.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
