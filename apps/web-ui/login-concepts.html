<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#02070b">
  <title>农智闭环 · 生长地平线</title>
  <link rel="stylesheet" href="css/login-concepts.css?v=20260902-v5911-zhcn-v2">
</head>
<body>
  <main class="experience" aria-labelledby="loginTitle">
    <div class="scene" aria-hidden="true">
      <img class="scene__frame" data-growth-frame="0" src="assets/login-concepts/horizon-start.png" alt="" fetchpriority="high">
      <img class="scene__frame" data-growth-frame="1" src="assets/login-concepts/horizon-stage-25.png" alt="" decoding="async">
      <img class="scene__frame" data-growth-frame="2" src="assets/login-concepts/horizon-stage-50.png" alt="" decoding="async">
      <img class="scene__frame" data-growth-frame="3" src="assets/login-concepts/horizon-stage-75.png" alt="" decoding="async">
      <img class="scene__frame" data-growth-frame="4" src="assets/login-concepts/horizon-stage-100.png" alt="" decoding="async">
      <div class="scene__veil"></div>
    </div>

    <header class="brand" aria-label="农智闭环">
      <img class="brand__logo" src="assets/brand/agriloop-logo.png" alt="农智闭环标志">
    </header>

    <button class="motion-control" id="motionToggle" type="button" aria-label="暂停生长动画">暂停动画</button>

    <section class="auth" aria-live="polite" aria-labelledby="loginTitle">
      <h1 id="loginTitle">登录</h1>
      <form id="loginForm" novalidate>
        <label class="field">
          <span>账号</span>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" required>
        </label>

        <label class="field">
          <span>登录身份</span>
          <select id="loginRole" name="role" required>
            <option value="" selected disabled>请选择账户身份</option>
            <option value="FARMER">种植农户</option>
            <option value="FARM_ADMIN">农场管理员</option>
            <option value="SYSTEM_ADMIN">系统管理员</option>
          </select>
        </label>

        <label class="field field--password">
          <span>密码</span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
          <button class="field__reveal" id="revealPassword" type="button" data-reveal="password" aria-label="显示密码">显示</button>
        </label>

        <p class="form-error" id="loginError" role="alert"></p>

        <button class="submit" id="loginButton" type="submit">
          <span class="submit__label">进入系统</span>
          <span class="submit__loading" aria-hidden="true">验证中</span>
        </button>

        <div class="auth__actions">
          <button class="text-action" id="demoToggle" type="button" aria-expanded="false" aria-controls="demoPanel">演示身份</button>
          <button class="text-action" id="forgotPassword" type="button">忘记密码</button>
        </div>
      </form>

      <div class="demo-panel" id="demoPanel" hidden>
        <p>选择体验身份</p>
        <div class="demo-panel__roles">
          <button type="button" data-user="admin">农场管理员</button>
          <button type="button" data-user="farmer">种植农户</button>
          <button type="button" data-user="sysadmin">系统管理员</button>
        </div>
      </div>
    </section>

    <div class="growth-loader" aria-live="polite">
      <span id="growthStatus">土壤苏醒</span>
      <progress id="growthProgress" max="100" value="0">0%</progress>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="js/login.js?v=20260902-v5911-login-concepts-v2"></script>
  <script type="module" src="js/login-concepts.js?v=20260902-v5911-login-concepts-v2"></script>
</body>
</html>
